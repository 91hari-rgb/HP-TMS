<style>
/* Layout: ops console — fixed sidebar + dense work area; collapses to a top tab strip on phones. Palette: night-shift slate with a hi-vis amber signal. */
:root{
  --bg:#f3f5f7; --panel:#ffffff; --sunk:#e9edf1; --line:#d6dde4; --fg:#16212c; --muted:#5c6b79;
  --nav:#14202b; --nav-fg:#c9d4de; --nav-active:#f2a516;
  --accent:#d98a00; --accent-fg:#1a1200; --accent-soft:#fdf0d5;
  --ok:#1f8a5b; --ok-soft:#dcf2e7; --warn:#b86e00; --warn-soft:#fdebc8; --bad:#c23b31; --bad-soft:#f9dedb; --info:#2a6db5; --info-soft:#dde9f7;
  --map-bg:#e4ebf0; --map-grid:#d2dce4; --map-lane:#8fa3b4;
  --f-sans:"IBM Plex Sans","IBM Plex Sans Arabic","Noto Sans Devanagari",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e151c; --panel:#152029; --sunk:#1b2833; --line:#2a3a47; --fg:#e3eaf0; --muted:#8fa0ae;
  --nav:#0a1016; --nav-fg:#a9b7c3; --nav-active:#f5b335;
  --accent:#f5b335; --accent-fg:#1a1200; --accent-soft:#3a2c0e;
  --ok:#43c08a; --ok-soft:#163528; --warn:#f0a43a; --warn-soft:#3a2a10; --bad:#f0776d; --bad-soft:#3d1c1a; --info:#6aa8ec; --info-soft:#162a40;
  --map-bg:#111c25; --map-grid:#1c2a36; --map-lane:#4c6273; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e151c; --panel:#152029; --sunk:#1b2833; --line:#2a3a47; --fg:#e3eaf0; --muted:#8fa0ae;
  --nav:#0a1016; --nav-fg:#a9b7c3; --nav-active:#f5b335;
  --accent:#f5b335; --accent-fg:#1a1200; --accent-soft:#3a2c0e;
  --ok:#43c08a; --ok-soft:#163528; --warn:#f0a43a; --warn-soft:#3a2a10; --bad:#f0776d; --bad-soft:#3d1c1a; --info:#6aa8ec; --info-soft:#162a40;
  --map-bg:#111c25; --map-grid:#1c2a36; --map-lane:#4c6273; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-sans);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--nav)}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100%}
.side{background:var(--nav);color:var(--nav-fg);padding-block:18px;padding-inline:14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;padding-left:max(14px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;letter-spacing:.02em}
.brand-mark{width:30px;height:30px;border-radius:5px;background:var(--nav-active);color:#1a1200;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:600}
.brand small{display:block;font-weight:400;color:var(--nav-fg);font-size:11px;letter-spacing:.04em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:5px;color:var(--nav-fg);text-decoration:none;font-weight:500}
.nav a:hover{background:#ffffff12;color:#fff}
.nav a[aria-current="page"]{background:#ffffff14;color:#fff;box-shadow:inset 3px 0 0 var(--nav-active)}
[dir="rtl"] .nav a[aria-current="page"]{box-shadow:inset -3px 0 0 var(--nav-active)}
.nav svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8}
.nav-sep{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:#7f909e;padding:10px 10px 4px}
.side-foot{margin-top:auto;font-size:11.5px;color:#7f909e}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px;padding-inline:20px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding-right:max(20px,env(safe-area-inset-right,0px))}
.top h1{font-size:17px;margin:0;font-weight:600;margin-inline-end:auto;text-wrap:balance}
.ctl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
select,input[type=text],input[type=number],input[type=date],input[type=search],textarea{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:6px 8px;min-width:0}
select:focus,input:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.content{padding-block:18px 40px;padding-inline:20px;padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px;min-width:0}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:6px 12px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.05)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:3px 8px;font-size:12.5px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line)}
.panel-h h2{font-size:14px;margin:0;font-weight:600;margin-inline-end:auto}
.panel-b{padding:14px}
.grid{display:grid;gap:16px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.g-2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g-2e{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:1100px){.g-2,.g-2e{grid-template-columns:minmax(0,1fr)}}
.kpi{padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi .l{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.kpi .v{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--sunk);position:sticky;top:0}
th.sort{cursor:pointer;user-select:none}
th.sort:hover{color:var(--fg)}
tbody tr:hover{background:var(--sunk)}
tbody tr.click{cursor:pointer}
td.r,th.r{text-align:end}
.pill{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:500;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-info{background:var(--info-soft);color:var(--info)} .p-acc{background:var(--accent-soft);color:var(--warn)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar input[type=search]{width:240px;max-width:100%}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:10px 14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.bar{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--info)}
.bar.over > i{background:var(--bad)}
.hbar{display:grid;grid-template-columns:110px 1fr 48px;gap:8px;align-items:center;font-size:12.5px}
.hbar .bar{height:14px;border-radius:3px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.map{width:100%;height:auto;display:block;background:var(--map-bg);border-radius:var(--r)}
.map text{font-family:var(--f-mono);font-size:12px;fill:var(--muted);font-weight:500}
.drawer-bg{position:fixed;inset:0;background:#0008;z-index:20;display:flex;justify-content:flex-end}
.drawer{background:var(--panel);width:min(560px,100%);height:100%;overflow:auto;padding:18px;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
[dir="rtl"] .drawer{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:18px}
.drawer h2{margin:0;font-size:18px}
.modal-bg{position:fixed;inset:0;background:#0008;z-index:20;display:grid;place-items:center;padding:16px}
.modal{background:var(--panel);border-radius:8px;width:min(640px,100%);max-height:100%;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.form .full{grid-column:1/-1}
@media (max-width:520px){.form{grid-template-columns:minmax(0,1fr)}}
.quote{background:var(--sunk);border-radius:var(--r);padding:12px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:520px){.quote{grid-template-columns:repeat(2,minmax(0,1fr))}}
.quote .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.quote .v{font-weight:600;font-variant-numeric:tabular-nums}
.note{padding:8px 12px;border-radius:5px;font-size:12.5px}
.note.warn{background:var(--warn-soft);color:var(--warn)} .note.bad{background:var(--bad-soft);color:var(--bad)} .note.ok{background:var(--ok-soft);color:var(--ok)} .note.info{background:var(--info-soft);color:var(--info)}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.timeline li{display:grid;grid-template-columns:18px 1fr;gap:10px;position:relative;padding-bottom:12px;font-size:13px}
.timeline li::before{content:"";width:10px;height:10px;border-radius:50%;border:2px solid var(--line);background:var(--panel);margin-top:4px;margin-inline-start:2px}
.timeline li.done::before{background:var(--ok);border-color:var(--ok)}
.timeline li.now::before{background:var(--accent);border-color:var(--accent)}
.timeline li::after{content:"";position:absolute;inset-inline-start:7px;top:18px;bottom:0;width:2px;background:var(--line)}
.timeline li:last-child::after{display:none}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.matrix td,.matrix th{text-align:center} .matrix td:first-child,.matrix th:first-child{text-align:start}
.toast{position:fixed;inset-inline-end:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:6px;z-index:30;font-size:13px;max-width:min(380px,calc(100% - 32px))}
/* driver phone */
.phone-wrap{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}
.phone{width:340px;max-width:100%;border:10px solid #1d252c;border-radius:34px;background:#f7f8f9;color:#111;overflow:hidden;box-shadow:0 10px 30px #0003;flex:none}
.ph-status{display:flex;justify-content:space-between;align-items:center;padding:6px 16px;font-size:11.5px;background:#1d252c;color:#dfe6ec}
.ph-top{background:#123047;color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px}
.ph-top b{font-size:15px} .ph-top small{display:block;opacity:.75;font-size:11.5px}
.ph-sync{margin-inline-start:auto;font-size:11px;padding:3px 8px;border-radius:99px;font-weight:600}
.ph-body{padding:12px;display:flex;flex-direction:column;gap:10px;min-height:520px}
.ph-card{background:#fff;border:1px solid #dde3e8;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.ph-stop{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;font-size:13px}
.ph-stop i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;color:#fff;font-size:12px}
.big{display:flex;align-items:center;justify-content:center;gap:10px;min-height:64px;border-radius:14px;border:0;font-size:17px;font-weight:700;cursor:pointer;width:100%;color:#fff}
.big svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2.2}
.big.go{background:#1f8a5b} .big.amber{background:#d98a00;color:#1a1200} .big.amber svg{stroke:#1a1200} .big.red{background:#c23b31} .big.blue{background:#2a6db5}
.ph-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ph-grid .big{min-height:56px;font-size:14px}
.sig{width:100%;height:140px;background:#fff;border:2px dashed #b7c2cb;border-radius:10px;touch-action:none;display:block}
.ph-body input{background:#fff;border:1px solid #c9d2da;border-radius:10px;padding:12px;font-size:16px;color:#111;width:100%}
.ph-body label{font-size:12.5px;color:#4d5a66;display:flex;flex-direction:column;gap:4px}
.lnk{background:none;border:0;padding:0;color:var(--info);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.svc{font-family:var(--f-mono);font-size:11.5px;font-weight:600;border:1px solid var(--line);border-radius:4px;padding:0 6px;background:var(--sunk);white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:6px 12px;cursor:pointer;font-weight:500;color:var(--muted)}
.seg button[aria-checked="true"]{background:var(--accent);color:var(--accent-fg)}
.labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.label{background:#fff;color:#000;border:1px solid #000;border-radius:4px;padding:10px;display:flex;flex-direction:column;gap:6px;font-family:var(--f-sans);aspect-ratio:2/3;max-width:100%;overflow:hidden}
.label small{font-size:9.5px;letter-spacing:.08em;color:#333;display:block}
.lb-top{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #000;padding-bottom:6px}
.lb-top b{font-size:16px}
.lb-svc{background:#000;color:#fff;font-family:var(--f-mono);font-weight:700;font-size:22px;padding:2px 8px}
.lb-addr{display:flex;flex-direction:column;font-size:12px;line-height:1.25;border-bottom:1px solid #000;padding-bottom:6px}
.lb-route{display:flex;gap:10px;align-items:center;border-bottom:1px solid #000;padding-bottom:6px}
.lb-zone{font-family:var(--f-mono);font-weight:700;font-size:40px;line-height:1}
.lb-route b{font-size:13px;display:block}
.lb-bc svg{width:100%;height:auto;display:block}
.lb-fallback{font-family:var(--f-mono);font-size:12px;text-align:center;padding:16px 0;border:1px dashed #000}
.lb-foot{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;margin-top:auto}
.lb-piece{font-size:15px}
.lb-qr svg{width:84px;height:84px;display:block}
.lnk:disabled{color:var(--muted);text-decoration:none;cursor:default}
.code{font-family:var(--f-mono);font-size:11.5px;font-weight:600;border-radius:4px;padding:1px 6px;background:var(--sunk);color:var(--fg);white-space:nowrap}
.code.c-info{background:var(--info-soft);color:var(--info)}.code.c-acc{background:var(--accent-soft);color:var(--warn)}.code.c-ok{background:var(--ok-soft);color:var(--ok)}.code.c-bad{background:var(--bad-soft);color:var(--bad)}
.tchain{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.tchain i{font-style:normal;color:var(--muted)}
.tnode{border:1px solid var(--line);border-radius:6px;padding:4px 8px;display:flex;flex-direction:column;font-size:12.5px;min-width:0}
.tnode small{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.cfgnav{border:0;background:none;text-align:start;padding:6px 8px;border-radius:5px;cursor:pointer;color:var(--fg);font-size:13px}
.cfgnav:hover{background:var(--sunk)}
.cfgnav[aria-current="true"]{background:var(--accent-soft);font-weight:600}
.q-item{font-size:12px;font-family:var(--f-mono);padding:4px 0;border-bottom:1px dashed var(--line)}
/* public tracking */
.trk-head{border-radius:var(--r);padding:18px;color:#fff;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.trk-head h2{margin:0;font-size:20px}
.trk-status{font-size:26px;font-weight:700}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;height:auto;flex-direction:row;align-items:center;padding-block:8px;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));gap:12px;overflow-x:auto;z-index:6}
  .brand small,.nav-sep,.side-foot{display:none}
  .nav{flex-direction:row}
  .nav a span{white-space:nowrap}
  .top{position:static;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
  .content{padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

  if(id==="AG05"){const ft=X.cfg.fileTypes[0];const n=X.orders.filter(o=>o.status==="Closed"&&Date.now()-o.closedTs>ft.archive*DAY).length;res=`${n} files archived (closed more than ${ft.archive} days ago)`}
  if(id==="AG03"){let n=0;X.messages.filter(m=>m.status==="Failed"||m.status==="Queued").forEach(m=>{if(m.dir==="OUT"){m.status="Sent";m.retries++;n++}});res=`${n} messages sent or retried`}

  if(id==="AG01"){res=`${X.trips.filter(t=>t.ms<6).length} trip ETAs recalculated`}
  if(id==="AG06"){const today=new Date().toISOString().slice(0,10);[...X.curActive].forEach(c=>{if(c==="USD")return;const r0=perUSD(X,c);X.cur[c]={rate:+(r0*(1+(Math.random()-.5)*.004)).toPrecision(6),date:today}});X.cfg.fx=fxRows(X);res=`${X.curActive.size-1} currencies updated from ${X.p.fxSource}`}

  a.result=res;a.status=1;return res}

function mapSVG(opts={}){
  const cs=T().cities, lats=cs.map(c=>c.lat), lons=cs.map(c=>c.lon);
  const pad=.6, minLat=Math.min(...lats)-pad, maxLat=Math.max(...lats)+pad, minLon=Math.min(...lons)-pad, maxLon=Math.max(...lons)+pad;
  const k=Math.cos((minLat+maxLat)/2*Math.PI/180), W=900, H=Math.round(W*(maxLat-minLat)/((maxLon-minLon)*k));
  const P=(lat,lon)=>[((lon-minLon)/(maxLon-minLon))*W, ((maxLat-lat)/(maxLat-minLat))*H];
  let g=`<svg class="map" direction="ltr" style="direction:ltr" viewBox="0 0 ${W} ${H}" role="img" aria-label="Map of active trips">`;
  for(let x=Math.ceil(minLon);x<maxLon;x++){const [px]=P(minLat,x);g+=`<line x1="${px}" y1="0" x2="${px}" y2="${H}" stroke="var(--map-grid)"/>`}
  for(let y=Math.ceil(minLat);y<maxLat;y++){const [,py]=P(y,minLon);g+=`<line x1="0" y1="${py}" x2="${W}" y2="${py}" stroke="var(--map-grid)"/>`}
  const trips=(opts.trips||T().trips.filter(tr=>tr.ms<6));
  trips.forEach(tr=>{const a=city(tr.from),b=city(tr.to);const [x1,y1]=P(a.lat,a.lon),[x2,y2]=P(b.lat,b.lon);g+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--map-lane)" stroke-width="1.2" stroke-dasharray="4 4"/>`});
  cs.forEach(c=>{const [x,y]=P(c.lat,c.lon);g+=`<circle cx="${x}" cy="${y}" r="4" fill="var(--panel)" stroke="var(--fg)" stroke-width="1.5"/><text x="${x+7}" y="${y-6}"><title>${esc(c.name)}</title>${esc(c.code)}</text>`});
  trips.forEach(tr=>{const a=city(tr.from),b=city(tr.to);const lat=a.lat+(b.lat-a.lat)*tr.progress, lon=a.lon+(b.lon-a.lon)*tr.progress;const [x,y]=P(lat,lon);
    const r=riskOf(tr);const col=tr.ms<4?"var(--info)":r.score>=75?"var(--bad)":r.score>=50?"var(--warn)":"var(--ok)";const hl=opts.highlight===tr.id;
    g+=`<g><circle cx="${x}" cy="${y}" r="${hl?11:7}" fill="${col}" stroke="var(--panel)" stroke-width="2"/>${hl?`<text x="${x+13}" y="${y+4}" style="fill:var(--fg);font-weight:600">${esc(veh(tr.vehicleId).plate)}</text>`:""}<title>${esc(tr.id)} · ${esc(veh(tr.vehicleId).plate)}</title></g>`});
  return g+"</svg>";
}

function setupSig(){const c=$("#sig");if(!c)return;const r=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1;c.width=r.width*dpr;c.height=r.height*dpr;const g=c.getContext("2d");g.scale(dpr,dpr);g.lineWidth=2.4;g.lineCap="round";g.strokeStyle="#0d1b2a";drv.sigData=null;

  c.onpointerdown=e=>{down=true;c.setPointerCapture(e.pointerId);const[x,y]=pos(e);g.beginPath();g.moveTo(x,y)};
  c.onpointermove=e=>{if(!down)return;const[x,y]=pos(e);g.lineTo(x,y);g.stroke()};

function doAction(tr,type,data={}){
  const act={id:crypto.randomUUID?crypto.randomUUID():String(Math.random()),tenant:tenantKey,tripId:tr.id,type,data,deviceTs:Date.now(),gps:gpsFor(tr)};
  if(drv.offline){drv.queue.push(act);return}

function applyAction(act){
  const X=TENANTS[act.tenant], tr=X.trips.find(x=>x.id===act.tripId); if(!tr) return;
  const serverTs=Date.now(); const idx=["accept","arrived_pickup","loaded","departed","arrived_delivery","pod"].indexOf(act.type);
  const lag=Math.round((serverTs-act.deviceTs)/1000);
  drv.log.unshift(`${act.tripId} · ${ACTION_LABEL[act.type]} · device ${new Date(act.deviceTs).toISOString().slice(11,19)}Z · server +${lag}s`);
  if(act.type==="exception"){X.exceptions.push({id:"EX-"+(200+X.exceptions.length),tripId:tr.id,type:act.data.type+" (driver)",severity:"Medium",owner:X.users[2]?.[0]||X.users[0][0],openedTs:act.deviceTs,slaMin:60});

  if(idx<0||idx+1<=tr.ms) return; // idempotent: already applied
  tr.ms=idx+1; if(act.type==="accept"&&!tr.acceptedTs) tr.acceptedTs=act.deviceTs;
  if(act.type==="arrived_delivery") tr.progress=1;
  tr.orderIds.forEach(id=>{const o=X.orders.find(x=>x.id===id);o.ms=tr.ms;o.msTs=o.msTs||{};o.msTs[idx]=act.deviceTs;
    const newStatus=act.type==="departed"?"In transit":act.type==="pod"?"POD received":null;
    if(newStatus&&o.status!==newStatus){X.audit.unshift({ts:serverTs,entity:o.id,field:"status",old:o.status,new:newStatus,by:drvr(tr.driverId).name+" (driver app)"});o.status=newStatus}
    if(act.type==="pod"){o.pod={name:act.data.name,ts:act.deviceTs,photos:act.data.photos,sig:act.data.sig,qty:act.data.qty,gps:act.gps,onTime:act.deviceTs<=o.deliverBy};}
  });
  const evt={accept:"trip.accepted",arrived_pickup:"stop.arrived",loaded:"stop.loaded",departed:"shipment.in_transit",arrived_delivery:"stop.arrived",pod:"shipment.pod_captured"}[act.type];
  X.events.unshift({ts:serverTs,type:evt,agg:tr.id,info:`device ${new Date(act.deviceTs).toISOString().slice(11,19)}Z · ${act.gps}`});
  traceTrip(X,tr,TRIP_CODE[idx+1],"Driver app",{ts:act.deviceTs,loc:act.gps,by:drvr(tr.driverId).name,note:`${act.type==="pod"?`Received by ${act.data.name} · `:""}server +${lag}s${drv.offline||lag>5?" (synced from offline queue)":""}`});
}

  document.querySelectorAll("[data-ttn]").forEach(c=>c.onchange=()=>{const d=X.tt[+c.dataset.ttn];d.notify=c.checked;audit("tt-code:"+d.code,"notify customer",!c.checked,c.checked);emit("tracking.code_updated",d.code,`notify: ${c.checked}`)});

function openTTForm(i){
  const X=T(), d=i!=null?X.tt[i]:{code:"",name:"",cat:"In transit",x12:"",cust:false,notify:false,status:true,custLabel:"",src:"Manual"};
  $("#overlay").innerHTML=`<div class="modal-bg" id="tbg"><form class="modal" id="ttf" novalidate>
   <h2 style="margin:0;font-size:18px">${i!=null?"Edit "+esc(d.code):"Add status code"}</h2>
   <div class="form">
    <label>Code (e.g. WH-XDK)<input type="text" id="tC" value="${esc(d.code)}" ${i!=null?"disabled":""}></label>
    <label>Category<select id="tCat">${Object.keys(TT_CATS).map(c=>`<option ${c===d.cat?"selected":""}>${c}</option>`).join("")}</select></label>
    <label class="full">Event name<input type="text" id="tN" value="${esc(d.name)}" placeholder="e.g. Cross-docked at hub"></label>
    <label>X12 214 status code<input type="text" id="tX" value="${esc(d.x12)}" maxlength="2" placeholder="e.g. X6"></label>
    <label>Sources<input type="text" id="tS" value="${esc(d.src||"")}"></label>
    <label class="full">Customer label (tracking page)<input type="text" id="tL" value="${esc(d.custLabel||"")}" placeholder="Leave blank to use the event name"></label>
    <label style="flex-direction:row;align-items:center;gap:8px;color:var(--fg)"><input type="checkbox" id="tSt" ${d.status?"checked":""}> Sets the status code</label>
    <label style="flex-direction:row;align-items:center;gap:8px;color:var(--fg)"><input type="checkbox" id="tCu" ${d.cust?"checked":""}> Customer sees it</label>
    <label style="flex-direction:row;align-items:center;gap:8px;color:var(--fg)"><input type="checkbox" id="tNo" ${d.notify?"checked":""}> Notify customer</label>
   </div><div id="tErr"></div>
   <div class="row" style="justify-content:flex-end"><button type="button" class="btn" id="tX2">${t("cancel")}</button><button class="btn primary">${t("save")}</button></div></form></div>`;
  $("#tX2").onclick=closeOverlay; $("#tbg").onclick=e=>{if(e.target.id==="tbg")closeOverlay()};
  $("#ttf").onsubmit=e=>{e.preventDefault();const code=(i!=null?d.code:$("#tC").value.trim().toUpperCase()),err=[];
    if(!/^[A-Z]{2,4}-[A-Z]{2,4}$/.test(code))err.push("Use a code like WH-XDK: 2–4 letters, a hyphen, 2–4 letters.");
    if(i==null&&X.tt.some(x=>x.code===code))err.push(`${code} already exists.`);
    if(!$("#tN").value.trim())err.push("Enter an event name.");
    if($("#tX").value&&!/^[A-Z0-9]{2}$/i.test($("#tX").value))err.push("An X12 214 status code is 2 characters.");
    if(err.length){$("#tErr").innerHTML=err.map(x=>`<div class="note bad">${esc(x)}</div>`).join("");return}
    const v={code,name:$("#tN").value.trim(),cat:$("#tCat").value,x12:$("#tX").value.toUpperCase(),src:$("#tS").value,custLabel:$("#tL").value.trim(),status:$("#tSt").checked,cust:$("#tCu").checked,notify:$("#tCu").checked&&$("#tNo").checked};
    if(i!=null)Object.assign(X.tt[i],v);else X.tt.push(v);
    audit("tt-code:"+code,i!=null?"updated":"(created)","",v.name);emit(i!=null?"tracking.code_updated":"tracking.code_created",code,v.name);closeOverlay();toast(`${code} saved.`);rerender()};
}

function cfgEdit(X,cur,i){
  const r=i==null?{}:X.cfg[cur.key][i];
  const input=c=>{const [k,l,type]=c,v=r[k]??"";
    if(type==="bool")return `<label style="flex-direction:row;align-items:center;gap:8px;color:var(--fg)"><input type="checkbox" data-cf="${k}" ${v?"checked":""}> ${esc(l)}</label>`;
    if(type==="cust")return `<label>${esc(l)}<select data-cf="${k}"><option value="*">Any</option>${X.parties.filter(p=>p.type==="customer").map(p=>`<option value="${p.id}" ${v===p.id?"selected":""}>${esc(p.name)}</option>`).join("")}</select></label>`;
    if(type==="carr")return `<label>${esc(l)}<select data-cf="${k}"><option value="OWN">Own fleet</option>${X.parties.filter(p=>p.type==="carrier").map(p=>`<option value="${p.id}" ${v===p.id?"selected":""}>${esc(p.name)}</option>`).join("")}</select></label>`;
    if(type==="svc")return `<label>${esc(l)}<select data-cf="${k}"><option value="">–</option>${Object.entries(SERVICE).map(([sk,S])=>`<option value="${sk}" ${v===sk?"selected":""}>${esc(S.name)}</option>`).join("")}</select></label>`;
    if(type==="pct")return `<label>${esc(l)} (%)<input type="number" step="0.1" data-cf="${k}" value="${v===""?"":Math.round(v*1000)/10}"></label>`;
    return `<label>${esc(l)}<input type="${type==="num"?"number":"text"}" data-cf="${k}" value="${esc(v)}"></label>`};
  $("#overlay").innerHTML=`<div class="modal-bg" id="cbg"><form class="modal" id="cf" novalidate><h2 style="margin:0;font-size:18px">${i==null?"Add to":"Edit"} ${esc(cur.name)}</h2>
   <div class="form">${cur.cols.map(input).join("")}</div><div id="cfErr"></div>
   <div class="row" style="justify-content:flex-end"><button type="button" class="btn" id="cfX">${t("cancel")}</button><button class="btn primary">${t("save")}</button></div></form></div>`;
  $("#cfX").onclick=closeOverlay; $("#cbg").onclick=e=>{if(e.target.id==="cbg")closeOverlay()};
  $("#cf").onsubmit=e=>{e.preventDefault();const v={...r};
    cur.cols.forEach(([k,,type])=>{const el=document.querySelector(`[data-cf="${k}"]`);v[k]=type==="bool"?el.checked:type==="num"?(el.value===""?"":+el.value):type==="pct"?(+el.value||0)/100:el.value.trim()});
    const k0=cur.cols[0][0];
    if(v[k0]===""||v[k0]==null){$("#cfErr").innerHTML=`<div class="note bad">Enter ${esc(cur.cols[0][1])}.</div>`;return}
    if(X.cfg[cur.key].some((x,j)=>j!==i&&String(x[k0])===String(v[k0]))){$("#cfErr").innerHTML=`<div class="note bad">${esc(String(v[k0]))} already exists.</div>`;return}
    if(i==null)X.cfg[cur.key].push(v);else X.cfg[cur.key][i]=v;
    if(cur.id==="aag"){let n=0;X.orders.forEach(o=>{if(["Draft","Confirmed","On hold","Dispatched","In transit"].includes(o.status)){recalc(X,o);n++}});toast(`Rule saved. ${n} open orders re-rated.`)}else toast(`${cur.name} saved.`);
    audit("config:"+cur.id,String(v[k0]),i==null?"":"changed",i==null?"added":"updated");emit("config.updated",cur.name,String(v[k0]));closeOverlay();VIEWS.setup()};
}

/* ---------------- INTEGRATIONS (message monitor) ---------------- */
const intg={dir:"",st:"",sel:null};
VIEWS.integrations=function(){
  const X=T(), ms=X.messages.filter(m=>(!intg.dir||m.dir===intg.dir)&&(!intg.st||m.status===intg.st));
  const day=X.messages.filter(m=>m.ts>Date.now()-DAY), fail=X.messages.filter(m=>m.status==="Failed"||m.status==="Error");
  const sel=X.messages.find(m=>m.id===intg.sel);
  const stc={Sent:"p-ok",Processed:"p-ok",Queued:"p-info",Failed:"p-bad",Error:"p-bad"};
  const payload=m=>{if(m.dir==="OUT"&&/214/.test(m.format)&&m.orderId){const o=X.orders.find(x=>x.id===m.orderId);return o?edi214(X,o):""}
    if(m.dir==="OUT")return JSON.stringify({event:m.code,order:m.orderId,timestamp:new Date(m.ts).toISOString(),tenant:X.short},null,2);
    return m.format==="X12 204"?"ST*204*0001~\nB2**GHLX**PO-55120**PP~\nS5*1*LD~\nN1*SH*…~\nS5*2*UL~\nN1*CN*…~\nSE*8*0001~":"unit_id,order_ref,package,qty,weight_kg\n…"};
  $("#view").innerHTML=`<div class="grid g-kpi">${kpi("Messages (24 h)",nfmt(day.length),`${day.filter(m=>m.dir==="IN").length} in · ${day.filter(m=>m.dir==="OUT").length} out`)}${kpi("Failed or in error",nfmt(fail.length),"Retry or reprocess below")}${kpi("Success rate",day.length?Math.round(day.filter(m=>!["Failed","Error"].includes(m.status)).length/day.length*100)+"%":"–","Last 24 hours")}${kpi("Auto return rules",nfmt(X.cfg.autoReturn.filter(r=>r.active).length),"Configuration → Connectivity")}</div>
   ${sel?`<section class="panel"><div class="panel-h"><h2 class="mono">${sel.id}</h2>${pill(sel.status,stc[sel.status])}<button class="btn sm" id="imX">${t("close")}</button></div><div class="panel-b stack">
     <dl class="kv"><dt>Direction</dt><dd>${sel.dir==="IN"?"Inbound":"Outbound"}</dd><dt>Partner</dt><dd>${esc(sel.partner)}</dd><dt>Format</dt><dd>${esc(sel.format)}</dd><dt>Retries</dt><dd>${sel.retries}</dd>${sel.error?`<dt>Error</dt><dd style="color:var(--bad)">${esc(sel.error)}</dd>`:""}</dl>
     <textarea class="mono" readonly style="width:100%;height:150px">${esc(payload(sel))}</textarea></div></section>`:""}
   <section class="panel"><div class="panel-h"><h2>Message monitor</h2>
    <select id="imD" aria-label="Direction"><option value="">All directions</option><option value="IN" ${intg.dir==="IN"?"selected":""}>Inbound</option><option value="OUT" ${intg.dir==="OUT"?"selected":""}>Outbound</option></select>
    <select id="imS" aria-label="Status"><option value="">All statuses</option>${["Sent","Processed","Queued","Failed","Error"].map(s=>`<option ${intg.st===s?"selected":""}>${s}</option>`).join("")}</select>
    <button class="btn sm" id="imRetry" ${fail.filter(m=>m.dir==="OUT").length?"":"disabled"}>Retry all failed</button></div>
   <div class="tbl-wrap"><table><thead><tr><th>When</th><th>ID</th><th>Dir.</th><th>Partner</th><th>Format</th><th>Subject</th><th>Status</th><th class="r">Retries</th><th>Error</th><th></th></tr></thead><tbody>
   ${ms.slice(0,150).map(m=>`<tr class="click" data-msg="${m.id}"><td class="num">${dt(m.ts,X.tz)}</td><td class="mono">${m.id}</td><td>${m.dir==="IN"?"⇣ In":"⇡ Out"}</td><td>${esc(m.partner)}</td><td>${esc(m.format)}</td><td class="mono" style="font-size:12px">${esc(m.subject)}</td><td>${pill(m.status,stc[m.status])}</td><td class="r num">${m.retries}</td><td class="muted" style="white-space:normal;min-width:160px;font-size:12px">${esc(m.error)}</td>
    <td>${m.status==="Failed"?`<button class="btn sm" data-retry="${m.id}">Retry</button>`:m.status==="Error"?`<button class="btn sm" data-reproc="${m.id}">Reprocess</button>`:""}</td></tr>`).join("")||`<tr><td colspan="10" class="muted">No messages match.</td></tr>`}
   </tbody></table></div><p class="muted" style="font-size:12px;margin:8px 14px 14px">Outbound status messages are created by the auto return message rules when T&T codes are logged. Every message keeps its payload, status, retries and error, so a failed one can be resent.</p></section>`;
  $("#imD").onchange=e=>{intg.dir=e.target.value;VIEWS.integrations()};$("#imS").onchange=e=>{intg.st=e.target.value;VIEWS.integrations()};
  $("#imX")&&($("#imX").onclick=()=>{intg.sel=null;VIEWS.integrations()});
  document.querySelectorAll("[data-msg]").forEach(r=>r.onclick=()=>{intg.sel=r.dataset.msg;VIEWS.integrations()});
  const retry=m=>{m.retries++;m.status="Sent";m.error="";audit(m.id,"status","Failed","Sent (retry)");emit("integration.message_retried",m.id,m.subject)};
  document.querySelectorAll("[data-retry]").forEach(b=>b.onclick=e=>{e.stopPropagation();retry(X.messages.find(m=>m.id===b.dataset.retry));toast("Message resent.");VIEWS.integrations()});
  document.querySelectorAll("[data-reproc]").forEach(b=>b.onclick=e=>{e.stopPropagation();const m=X.messages.find(x=>x.id===b.dataset.reproc);m.retries++;m.status="Processed";m.error="";audit(m.id,"status","Error","Processed (reprocessed)");emit("integration.message_reprocessed",m.id,m.subject);toast("Message reprocessed after the mapping fix.");VIEWS.integrations()});
  $("#imRetry").onclick=()=>{let n=0;X.messages.filter(m=>m.status==="Failed"&&m.dir==="OUT").forEach(m=>{retry(m);n++});toast(`${n} message(s) resent.`);VIEWS.integrations()};
};

      <td><select data-dbs="${o.id}" aria-label="Debrief status ${o.id}">${DS.map(d=>`<option value="${d.code}" ${(q<o.pallets?"DS03":"DS01")===d.code?"selected":""}>${d.code} · ${esc(d.name)}</option>`).join("")}</select></td>
      <td><select data-dbq="${o.id}" aria-label="Qualification ${o.id}">${Q.map(c=>`<option value="${c.code}" ${(q<o.pallets?"Q20":"Q00")===c.code?"selected":""}>${c.code} · ${esc(c.name)}</option>`).join("")}</select></td>

    <div class="panel-b row"><button class="btn primary" data-dgo="${tr.id}">Complete debrief</button></div></section>`).join("")||`<div class="note ok">No trips waiting for debrief. Complete a trip in the Driver app and it appears here.</div>`}
   ${done.length?`<section class="panel"><div class="panel-h"><h2>Recently debriefed</h2></div><div class="tbl-wrap"><table><thead><tr><th>Trip</th><th>Order</th><th>Result</th><th>Related order</th></tr></thead><tbody>
    ${done.flatMap(tr=>tr.orderIds.map(id=>{const o=X.orders.find(x=>x.id===id);return `<tr><td class="mono">${tr.id}</td><td>${lnk(o.id,"data-open")}</td><td>${esc(o.debrief?.status||"")} · ${esc(o.debrief?.qual||"")}</td><td>${(o.related||[]).map(r=>lnk(r,"data-open")).join(" ")||"–"}</td></tr>`})).join("")}</tbody></table></div></section>`:""}</div>`;
  document.querySelectorAll("[data-dgo]").forEach(b=>b.onclick=()=>{const tr=X.trips.find(t=>t.id===b.dataset.dgo);const made=[];
    tr.orderIds.forEach(id=>{const o=X.orders.find(x=>x.id===id),st=document.querySelector(`[data-dbs="${id}"]`).value,q=document.querySelector(`[data-dbq="${id}"]`).value,rm=document.querySelector(`[data-dbr="${id}"]`).value.trim();
      const def=X.cfg.debriefStatus.find(d=>d.code===st);o.debrief={status:`${st} ${def.name}`,qual:`${q} ${X.cfg.quality.find(c=>c.code===q)?.name||""}`,remark:rm,ts:Date.now()};
      trace(X,o,"TRP-DBR","Debrief",{note:`${st} ${def.name} · ${q}${rm?" · "+rm:""}`});audit(o.id,"debrief","",`${st} · ${q}`);
      if(def.createsReturn){const delivered=o.pod?.qty??(st==="DS04"?0:o.pallets);const pal=Math.max(1,st==="DS04"?o.pallets:o.pallets-delivered);const share=Math.min(1,pal/Math.max(1,o.pallets));
        const pickupTs=Date.now()+DAY;const ret={id:nextOrderId(X,pickupTs),customerId:o.customerId,ref:"RET-"+o.ref,origin:o.dest,dest:o.origin,equip:o.equip,weight:Math.round(o.weight*share/10)*10,pallets:pal,pickupTs,svc:"D2",status:"Confirmed",km:o.km,tripId:null,pod:null,createdTs:Date.now(),ms:0,carrierId:null,acc:[],relatedTo:o.id};
        ret.deliverBy=slaDeadline(X,"D2",pickupTs,ret.km,X.cityByCode[ret.dest].cc);autoAcc(X,ret);recalc(X,ret);X.orders.unshift(ret);o.related=(o.related||[]).concat(ret.id);
        trace(X,ret,"ORD-CRT","Debrief",{note:`Return order for ${o.id} (${def.name})`});trace(X,ret,"ORD-CNF","System");audit(ret.id,"(created)","",`return order for ${o.id}`);emit("order.return_created",ret.id,`related to ${o.id}`);made.push(ret.id)}});
    tr.debriefed=true;emit("trip.debriefed",tr.id,`${tr.orderIds.length} order(s)`);toast(made.length?`${tr.id} debriefed. Return order ${made.join(", ")} created and ready to plan.`:`${tr.id} debriefed.`);VIEWS.planning()});
}
/* ---------------- live tick ---------------- */
setInterval(()=>{
  Object.values(TENANTS).forEach(X=>X.trips.forEach(tr=>{
    if(tr.ms!==4) return;
    {tr.progress=Math.min(1,tr.progress+0.0015+(tr.orderIds.length%3)*0.0004);
      if(!tr.lastPos||Date.now()-tr.lastPos>60e3){tr.lastPos=Date.now();const a=X.cityByCode[tr.from],b=X.cityByCode[tr.to];traceTrip(X,tr,"INT-POS","Telematics",{by:"Telematics",loc:`${(a.lat+(b.lat-a.lat)*tr.progress).toFixed(4)},${(a.lon+(b.lon-a.lon)*tr.progress).toFixed(4)}`})}
      if(tr.progress>=1&&!tr.geofenced){tr.geofenced=true;tr.ms=5;traceTrip(X,tr,"DL-ARR","Geofence",{by:"Geofence",loc:gpsOf(X.cityByCode[tr.to]),note:"Auto by geofence; driver confirmation pending"});tr.orderIds.forEach(id=>{const o=X.orders.find(x=>x.id===id);o.ms=5;o.msTs=o.msTs||{};o.msTs[4]=Date.now()});X.events.unshift({ts:Date.now(),type:"stop.arrived",agg:tr.id,info:"Auto by geofence (driver confirmation pending)"})}}
  }));
  const v=route();
  if(document.hidden) return;
  if(v==="tracking") updateTracking();
  else if(v==="trace"&&$("#trMap")){const o=T().orders.find(x=>x.id===trc.id),tr=o&&tripOf(o);if(tr&&tr.ms<6)$("#trMap").innerHTML=mapSVG({trips:[tr],highlight:tr.id})}
  else if(v==="dashboard"&&$("#dashMap")) $("#dashMap").innerHTML=mapSVG();
  else if(v==="track"&&$("#trkMap")){const o=T().orders.find(x=>x.id===trk.id),tr=o&&tripOf(o);if(tr&&tr.ms<6)$("#trkMap").innerHTML=mapSVG({trips:[tr],highlight:tr.id})}
},1000);

render();
</script>
