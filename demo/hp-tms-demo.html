<style>
/* Layout: ops console — fixed sidebar + dense work area; collapses to a top tab strip on phones. Palette: night-shift slate with a hi-vis amber signal. */
:root{
  --bg:#f3f5f7; --panel:#ffffff; --sunk:#e9edf1; --line:#d6dde4; --fg:#16212c; --muted:#5c6b79;
  --nav:#14202b; --nav-fg:#c9d4de; --nav-active:#f2a516;
  --accent:#d98a00; --accent-fg:#1a1200; --accent-soft:#fdf0d5;
  --ok:#1f8a5b; --ok-soft:#dcf2e7; --warn:#b86e00; --warn-soft:#fdebc8; --bad:#c23b31; --bad-soft:#f9dedb; --info:#2a6db5; --info-soft:#dde9f7;
  --map-bg:#e4ebf0; --map-grid:#d2dce4; --map-lane:#8fa3b4;
  --f-sans:"IBM Plex Sans","IBM Plex Sans Arabic","Noto Sans Devanagari",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e151c; --panel:#152029; --sunk:#1b2833; --line:#2a3a47; --fg:#e3eaf0; --muted:#8fa0ae;
  --nav:#0a1016; --nav-fg:#a9b7c3; --nav-active:#f5b335;
  --accent:#f5b335; --accent-fg:#1a1200; --accent-soft:#3a2c0e;
  --ok:#43c08a; --ok-soft:#163528; --warn:#f0a43a; --warn-soft:#3a2a10; --bad:#f0776d; --bad-soft:#3d1c1a; --info:#6aa8ec; --info-soft:#162a40;
  --map-bg:#111c25; --map-grid:#1c2a36; --map-lane:#4c6273; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e151c; --panel:#152029; --sunk:#1b2833; --line:#2a3a47; --fg:#e3eaf0; --muted:#8fa0ae;
  --nav:#0a1016; --nav-fg:#a9b7c3; --nav-active:#f5b335;
  --accent:#f5b335; --accent-fg:#1a1200; --accent-soft:#3a2c0e;
  --ok:#43c08a; --ok-soft:#163528; --warn:#f0a43a; --warn-soft:#3a2a10; --bad:#f0776d; --bad-soft:#3d1c1a; --info:#6aa8ec; --info-soft:#162a40;
  --map-bg:#111c25; --map-grid:#1c2a36; --map-lane:#4c6273; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-sans);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--nav)}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100%}
.side{background:var(--nav);color:var(--nav-fg);padding-block:18px;padding-inline:14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;padding-left:max(14px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;letter-spacing:.02em}
.brand-mark{width:30px;height:30px;border-radius:5px;background:var(--nav-active);color:#1a1200;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:600}
.brand small{display:block;font-weight:400;color:var(--nav-fg);font-size:11px;letter-spacing:.04em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:5px;color:var(--nav-fg);text-decoration:none;font-weight:500}
.nav a:hover{background:#ffffff12;color:#fff}
.nav a[aria-current="page"]{background:#ffffff14;color:#fff;box-shadow:inset 3px 0 0 var(--nav-active)}
[dir="rtl"] .nav a[aria-current="page"]{box-shadow:inset -3px 0 0 var(--nav-active)}
.nav svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8}
.nav-sep{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:#7f909e;padding:10px 10px 4px}
.side-foot{margin-top:auto;font-size:11.5px;color:#7f909e}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px;padding-inline:20px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding-right:max(20px,env(safe-area-inset-right,0px))}
.top h1{font-size:17px;margin:0;font-weight:600;margin-inline-end:auto;text-wrap:balance}
.ctl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
select,input[type=text],input[type=number],input[type=date],input[type=search],textarea{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:6px 8px;min-width:0}
select:focus,input:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.content{padding-block:18px 40px;padding-inline:20px;padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px;min-width:0}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:6px 12px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.05)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:3px 8px;font-size:12.5px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line)}
.panel-h h2{font-size:14px;margin:0;font-weight:600;margin-inline-end:auto}
.panel-b{padding:14px}
.grid{display:grid;gap:16px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.g-2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g-2e{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:1100px){.g-2,.g-2e{grid-template-columns:minmax(0,1fr)}}
.kpi{padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi .l{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.kpi .v{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--sunk);position:sticky;top:0}
th.sort{cursor:pointer;user-select:none}
th.sort:hover{color:var(--fg)}
tbody tr:hover{background:var(--sunk)}
tbody tr.click{cursor:pointer}
td.r,th.r{text-align:end}
.pill{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:500;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-info{background:var(--info-soft);color:var(--info)} .p-acc{background:var(--accent-soft);color:var(--warn)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar input[type=search]{width:240px;max-width:100%}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:10px 14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.bar{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--info)}
.bar.over > i{background:var(--bad)}
.hbar{display:grid;grid-template-columns:110px 1fr 48px;gap:8px;align-items:center;font-size:12.5px}
.hbar .bar{height:14px;border-radius:3px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.map{width:100%;height:auto;display:block;background:var(--map-bg);border-radius:var(--r)}
.map text{font-family:var(--f-mono);font-size:12px;fill:var(--muted);font-weight:500}
.drawer-bg{position:fixed;inset:0;background:#0008;z-index:20;display:flex;justify-content:flex-end}
.drawer{background:var(--panel);width:min(560px,100%);height:100%;overflow:auto;padding:18px;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
[dir="rtl"] .drawer{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:18px}
.drawer h2{margin:0;font-size:18px}
.modal-bg{position:fixed;inset:0;background:#0008;z-index:20;display:grid;place-items:center;padding:16px}
.modal{background:var(--panel);border-radius:8px;width:min(640px,100%);max-height:100%;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.form .full{grid-column:1/-1}
@media (max-width:520px){.form{grid-template-columns:minmax(0,1fr)}}
.quote{background:var(--sunk);border-radius:var(--r);padding:12px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:520px){.quote{grid-template-columns:repeat(2,minmax(0,1fr))}}
.quote .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.quote .v{font-weight:600;font-variant-numeric:tabular-nums}
.note{padding:8px 12px;border-radius:5px;font-size:12.5px}
.note.warn{background:var(--warn-soft);color:var(--warn)} .note.bad{background:var(--bad-soft);color:var(--bad)} .note.ok{background:var(--ok-soft);color:var(--ok)} .note.info{background:var(--info-soft);color:var(--info)}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.timeline li{display:grid;grid-template-columns:18px 1fr;gap:10px;position:relative;padding-bottom:12px;font-size:13px}
.timeline li::before{content:"";width:10px;height:10px;border-radius:50%;border:2px solid var(--line);background:var(--panel);margin-top:4px;margin-inline-start:2px}
.timeline li.done::before{background:var(--ok);border-color:var(--ok)}
.timeline li.now::before{background:var(--accent);border-color:var(--accent)}
.timeline li::after{content:"";position:absolute;inset-inline-start:7px;top:18px;bottom:0;width:2px;background:var(--line)}
.timeline li:last-child::after{display:none}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.matrix td,.matrix th{text-align:center} .matrix td:first-child,.matrix th:first-child{text-align:start}
.toast{position:fixed;inset-inline-end:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:6px;z-index:30;font-size:13px;max-width:min(380px,calc(100% - 32px))}
/* driver phone */
.phone-wrap{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}
.phone{width:340px;max-width:100%;border:10px solid #1d252c;border-radius:34px;background:#f7f8f9;color:#111;overflow:hidden;box-shadow:0 10px 30px #0003;flex:none}
.ph-status{display:flex;justify-content:space-between;align-items:center;padding:6px 16px;font-size:11.5px;background:#1d252c;color:#dfe6ec}
.ph-top{background:#123047;color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px}
.ph-top b{font-size:15px} .ph-top small{display:block;opacity:.75;font-size:11.5px}
.ph-sync{margin-inline-start:auto;font-size:11px;padding:3px 8px;border-radius:99px;font-weight:600}
.ph-body{padding:12px;display:flex;flex-direction:column;gap:10px;min-height:520px}
.ph-card{background:#fff;border:1px solid #dde3e8;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.ph-stop{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;font-size:13px}
.ph-stop i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;color:#fff;font-size:12px}
.big{display:flex;align-items:center;justify-content:center;gap:10px;min-height:64px;border-radius:14px;border:0;font-size:17px;font-weight:700;cursor:pointer;width:100%;color:#fff}
.big svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2.2}
.big.go{background:#1f8a5b} .big.amber{background:#d98a00;color:#1a1200} .big.amber svg{stroke:#1a1200} .big.red{background:#c23b31} .big.blue{background:#2a6db5}
.ph-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ph-grid .big{min-height:56px;font-size:14px}
.sig{width:100%;height:140px;background:#fff;border:2px dashed #b7c2cb;border-radius:10px;touch-action:none;display:block}
.ph-body input{background:#fff;border:1px solid #c9d2da;border-radius:10px;padding:12px;font-size:16px;color:#111;width:100%}
.ph-body label{font-size:12.5px;color:#4d5a66;display:flex;flex-direction:column;gap:4px}
.q-item{font-size:12px;font-family:var(--f-mono);padding:4px 0;border-bottom:1px dashed var(--line)}
/* public tracking */
.trk-head{border-radius:var(--r);padding:18px;color:#fff;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.trk-head h2{margin:0;font-size:20px}
.trk-status{font-size:26px;font-weight:700}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;height:auto;flex-direction:row;align-items:center;padding-block:8px;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));gap:12px;overflow-x:auto;z-index:6}
  .brand small,.nav-sep,.side-foot{display:none}
  .nav{flex-direction:row}
  .nav a span{white-space:nowrap}
  .top{position:static;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
  .content{padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <aside class="side">
    <div class="brand"><div class="brand-mark">HP</div><div>HP TMS<small id="tenantName"></small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>
  <div class="main">
    <header class="top">
      <h1 id="pageTitle"></h1>
      <label class="ctl"><span id="lblTenant"></span>

        <select id="langSel"><option value="en">English</option><option value="ar">العربية</option><option value="hi">हिन्दी</option></select></label>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>
<div id="overlay"></div>
<div id="toast" class="toast" hidden></div>

   case "Dispatcher / control tower": ["Execution","Control tower"].forEach(m=>["view","create","edit","approve"].forEach(a=>p[m].add(a))); ["Orders","Planning","Documents"].forEach(v); break;
   case "Carrier manager": ["Carriers & tendering","Rating"].forEach(all); ["Master data","Orders"].forEach(v); break;
   case "Fleet manager": ["Master data"].forEach(m=>["view","create","edit"].forEach(a=>p[m].add(a))); ["Execution"].forEach(v); break;
   case "Finance / billing": ["Finance"].forEach(all); ["Orders","Rating","Documents"].forEach(v); p["Rating"].add("export"); break;
   case "Management": MODULES.forEach(m=>{p[m].add("view");p[m].add("export")}); break;

function buildTenant(key){
  const D = TENANT_DEF[key], r = rng(D.seed), id = crypto.randomUUID ? crypto.randomUUID() : String(Math.random());
  const T = {key, id, ...D, orders:[], trips:[], vehicles:[], drivers:[], parties:[], events:[], audit:[], exceptions:[], seq:0, tripSeq:0};
  T.cityByCode = Object.fromEntries(D.cities.map(c=>[c.code,c]));
  D.customers.forEach((n,i)=>{const home=D.cities[i % D.cities.length];
    const tax = D.taxScheme==="GSTIN" ? `27AAB${String.fromCharCode(65+i)}${2000+i}${String.fromCharCode(70+i)}1Z${i}` : (home.cc==="SA" ? `3${String(100000000000+Math.floor(r()*899999999999))}03` : `100${String(Math.floor(r()*1e11)).padStart(11,"0")}3`);
    T.parties.push({id:"C"+(i+1),type:"customer",name:n,taxId:tax,home:home.code,credit:Math.round((50+r()*450))*1000*(D.ccy==="INR"?20:1)})});
  D.carriers.forEach((n,i)=>T.parties.push({id:"K"+(i+1),type:"carrier",name:n,licExpiry:NOW0+(i===0?20:200+i*60)*DAY,score:Math.round(82+r()*15)}));
  const equipKeys=Object.keys(EQUIP), eqWeights=["Curtain-sider","Curtain-sider","Curtain-sider","Flatbed","Flatbed","Reefer","Reefer","Lowbed (ODC)","Tipper"];
  let di=0;
  const addVeh=(owner,i)=>{const eq=pick(r,eqWeights);const v={id:"V"+(T.vehicles.length+1),plate:D.plate(r,T.vehicles.length),equip:eq,kg:EQUIP[eq].kg,pal:EQUIP[eq].pal,owner};T.vehicles.push(v);
    const d={id:"D"+(T.drivers.length+1),name:D.drivers[di++ % D.drivers.length],phone:(D.ccy==="INR"?"+91 9":"+971 5")+(10000000+Math.floor(r()*89999999)),vehicleId:v.id,owner};T.drivers.push(d);v.driverId=d.id};
  for(let i=0;i<D.ownTrucks;i++) addVeh(null,i);
  D.carriers.forEach((_,ci)=>{for(let i=0;i<D.carrierTrucks;i++) addVeh("K"+(ci+1),i)});
  // order mix
  const n=D.nOrders, mix=[["Invoiced",.27],["POD received",.2],["Delivered",.06],["In transit",.09],["Dispatched",.05],["Confirmed",.16],["Draft",.04],["On hold",.03],["Cancelled",.05]];
  const statuses=[]; mix.forEach(([s,f])=>{for(let i=0;i<Math.round(f*n);i++)statuses.push(s)}); while(statuses.length<n)statuses.push("Confirmed"); statuses.length=n;
  const custs=T.parties.filter(p=>p.type==="customer");
  statuses.forEach((s,i)=>{
    let o=pick(r,D.cities), d=pick(r,D.cities); let guard=0;
    if(key==="gulf"){ // keep most lanes inside UAE
      const uae=D.cities.filter(c=>c.cc==="AE"); o=pick(r,uae); d=r()<.15?pick(r,D.cities.filter(c=>c.cc==="SA")):pick(r,uae);
    }
    while(d.code===o.code&&guard++<10) d=pick(r,D.cities);
    const eq=pick(r,eqWeights), cap=EQUIP[eq];
    const wt=Math.round((cap.kg*(.25+r()*.6))/10)*10, pal=cap.pal?Math.max(1,Math.round(cap.pal*(.2+r()*.7))):0;
    const past = ["Invoiced","POD received","Delivered","Cancelled"].includes(s);
    const pickupTs = past ? NOW0-(2+r()*28)*DAY : ["In transit","Dispatched"].includes(s) ? NOW0-(r()*10)*HOUR : NOW0+(r()*5+.5)*DAY;
    const q=quote(T,o.code,d.code,eq);
    const cust=pick(r,custs);
    const ord={id:nextOrderId(T,pickupTs),customerId:cust.id,ref:"PO-"+(40000+Math.floor(r()*59999)),origin:o.code,dest:d.code,equip:eq,weight:wt,pallets:pal,
      pickupTs,deliverBy:pickupTs+(q.km/55+6)*HOUR,status:s,sell:q.sell,buy:round2(q.sell*(.7+r()*.17)),km:q.km,tripId:null,pod:null,createdTs:pickupTs-(1+r()*3)*DAY,
      ms:past&&s!=="Cancelled"?6:0};
    if(ord.ms===6){ord.pod={name:pick(r,["Store keeper","Warehouse supervisor","Receiving clerk"]),ts:ord.deliverBy-r()*3*HOUR,photos:2,onTime:r()<.9}}
    T.orders.push(ord);
  });
  // trips for active orders
  const free=[...T.vehicles];
  T.orders.filter(o=>["In transit","Dispatched"].includes(o.status)).forEach(o=>{
    const vi=free.findIndex(v=>v.kg>=o.weight); if(vi<0){o.status="Confirmed";return}
    const v=free.splice(vi,1)[0];
    const trip={id:`${D.prefix}-TRP-${String(++T.tripSeq).padStart(4,"0")}`,vehicleId:v.id,driverId:v.driverId,orderIds:[o.id],from:o.origin,to:o.dest,
      ms:o.status==="In transit"?3:0,progress:o.status==="In transit"?.08+r()*.8:0,startTs:o.pickupTs};
    // make a few late: deadline already tight
    if(o.status==="In transit" && r()<.3) o.deliverBy=NOW0+(1-trip.progress)*o.km/80*HOUR-1.5*HOUR;
    o.tripId=trip.id; T.trips.push(trip);
  });
  // exceptions
  T.trips.filter(tr=>tr.ms===3).slice(0,3).forEach((tr,i)=>T.exceptions.push({id:"EX-"+(101+i),tripId:tr.id,type:["Delay: traffic","Breakdown: tyre","Delay: border queue"][i],severity:["Medium","High","Medium"][i],owner:D.users[2]?.[0]||D.users[0][0],openedTs:NOW0-(i+1)*55*60e3,slaMin:[60,30,120][i]}));
  // roles
  T.roles=ROLE_NAMES.map((n,i)=>({id:"R"+(i+1),name:n,system:true,perms:defaultPerms(n)}));
  T.users=D.users.map(([n,role],i)=>({id:"U"+(i+1),name:n,email:n.toLowerCase().replace(/[^a-z]+/g,".")+"@"+(key==="gulf"?"gulfhaul.ae":"indusfreight.in"),role,scope:i===1?(key==="gulf"?"Branch: Jebel Ali":"Branch: Bhiwandi"):"Tenant",mfa:i<3||role==="Tenant admin",status:"Active"}));
  // seed a few historical events
  T.events.push({ts:NOW0-2*HOUR,type:"tenant.seeded",agg:T.short,info:`${n} orders, ${T.vehicles.length} vehicles, ${custs.length} customers`});
  return T;
}
function nextOrderId(T,ts){const d=new Date(ts);return `${T.prefix}-${String(d.getUTCFullYear()).slice(2)}${String(d.getUTCMonth()+1).padStart(2,"0")}-${String(++T.seq).padStart(4,"0")}`}
function quote(T,oc,dc,eq){
  const o=T.cityByCode[oc], d=T.cityByCode[dc], dist=km(o,d), R=T.rates, f=EQUIP[eq].rate;
  let sell=Math.max(R.min,R.base+R.perKm*dist)*f; const cross=o.cc!==d.cc; if(cross) sell+=R.cross;
  sell=Math.round(sell/5)*5;
  return {km:dist,sell,cross};
}
function taxFor(T,o){const a=T.cityByCode[o.origin], b=T.cityByCode[o.dest];
  if(a.cc!==b.cc) return {name:"Zero-rated (international transport)",rate:0};
  return T.countryTax[a.cc]||{name:"Tax",rate:0}}

  const cs=T().cities, lats=cs.map(c=>c.lat), lons=cs.map(c=>c.lon);
  const pad=.6, minLat=Math.min(...lats)-pad, maxLat=Math.max(...lats)+pad, minLon=Math.min(...lons)-pad, maxLon=Math.max(...lons)+pad;
  const k=Math.cos((minLat+maxLat)/2*Math.PI/180), W=900, H=Math.round(W*(maxLat-minLat)/((maxLon-minLon)*k));
  const P=(lat,lon)=>[((lon-minLon)/(maxLon-minLon))*W, ((maxLat-lat)/(maxLat-minLat))*H];
  let g=`<svg class="map" direction="ltr" style="direction:ltr" viewBox="0 0 ${W} ${H}" role="img" aria-label="Map of active trips">`;
  for(let x=Math.ceil(minLon);x<maxLon;x++){const [px]=P(minLat,x);g+=`<line x1="${px}" y1="0" x2="${px}" y2="${H}" stroke="var(--map-grid)"/>`}
  for(let y=Math.ceil(minLat);y<maxLat;y++){const [,py]=P(y,minLon);g+=`<line x1="0" y1="${py}" x2="${W}" y2="${py}" stroke="var(--map-grid)"/>`}
  const trips=(opts.trips||T().trips.filter(tr=>tr.ms<6));
  trips.forEach(tr=>{const a=city(tr.from),b=city(tr.to);const [x1,y1]=P(a.lat,a.lon),[x2,y2]=P(b.lat,b.lon);g+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--map-lane)" stroke-width="1.2" stroke-dasharray="4 4"/>`});
  cs.forEach(c=>{const [x,y]=P(c.lat,c.lon);g+=`<circle cx="${x}" cy="${y}" r="4" fill="var(--panel)" stroke="var(--fg)" stroke-width="1.5"/><text x="${x+7}" y="${y-6}"><title>${esc(c.name)}</title>${esc(c.code)}</text>`});
  trips.forEach(tr=>{const a=city(tr.from),b=city(tr.to);const lat=a.lat+(b.lat-a.lat)*tr.progress, lon=a.lon+(b.lon-a.lon)*tr.progress;const [x,y]=P(lat,lon);
    const r=riskOf(tr);const col=tr.ms<3?"var(--info)":r.score>=75?"var(--bad)":r.score>=50?"var(--warn)":"var(--ok)";const hl=opts.highlight===tr.id;
    g+=`<g><circle cx="${x}" cy="${y}" r="${hl?11:7}" fill="${col}" stroke="var(--panel)" stroke-width="2"/>${hl?`<text x="${x+13}" y="${y+4}" style="fill:var(--fg);font-weight:600">${esc(veh(tr.vehicleId).plate)}</text>`:""}<title>${esc(tr.id)} · ${esc(veh(tr.vehicleId).plate)}</title></g>`});
  return g+"</svg>";
}

   <section class="panel"><div class="panel-h"><h2>${t("liveMap")}</h2><a class="btn sm" href="#tracking">${t("tracking")} →</a></div><div class="panel-b" id="dashMap">${mapSVG()}</div></section>

    <div class="tbl-wrap"><table><thead><tr><th>${t("order")}</th><th>${t("eta")}</th><th>${t("risk")}</th></tr></thead><tbody>
    ${risk.map(({tr,r})=>`<tr class="click" data-order="${tr.orderIds[0]}"><td class="mono">${tr.orderIds[0]}<div class="muted" style="font-family:var(--f-sans)">${esc(city(tr.from).code)} → ${esc(city(tr.to).code)}${r.ex?` · ${esc(r.ex.type)}`:""}</div></td><td class="num">${dt(etaOf(tr),X.tz)}</td><td>${riskPill(r)}</td></tr>`).join("")}
    </tbody></table></div></section>
  </div>

   <section class="panel"><div class="panel-h"><h2>${t("byStatus")}</h2></div><div class="panel-b stack">
    ${counts.map(([s,c])=>`<div class="hbar"><span>${esc(tst(s))}</span><div class="bar"><i style="width:${c/maxC*100}%;background:${["Cancelled"].includes(s)?"var(--bad)":["On hold"].includes(s)?"var(--warn)":["Invoiced","POD received","Delivered"].includes(s)?"var(--ok)":"var(--info)"}"></i></div><span class="num r" style="text-align:end">${nfmt(c)}</span></div>`).join("")}
   </div></section>

   </tbody></table></div></section>
  </div>`;

function openNewOrder(){

  const calc=()=>{const o=$("#no-o").value,d=$("#no-d").value,e=$("#no-e").value,w=+$("#no-w").value,pal=+$("#no-pal").value;

    if(w>EQUIP[e].kg){msg.push(["bad",`${nfmt(w)} kg is over the ${e} limit of ${nfmt(EQUIP[e].kg)} kg. Choose a larger vehicle or split the order.`]);ok=false}

     <dl class="kv"><dt>Received by</dt><dd>${esc(o.pod.name)}</dd><dt>Captured</dt><dd class="num">${dt(o.pod.ts,X.tz)}</dd><dt>Photos</dt><dd>${o.pod.photos}</dd>${o.pod.qty!=null?`<dt>Qty delivered</dt><dd>${o.pod.qty} / ${o.pallets}</dd>`:""}${o.pod.gps?`<dt>GPS</dt><dd class="mono">${o.pod.gps}</dd>`:""}</dl>
     ${o.pod.sig?`<img src="${o.pod.sig}" alt="Recipient signature" style="background:#fff;border:1px solid var(--line);border-radius:6px;max-height:120px">`:""}</div></section>`:""}
   <div class="row">

   </div>
   <section><h3 style="font-size:14px;margin:0 0 8px">History (audit)</h3>${hist.length?`<div class="tbl-wrap"><table><thead><tr><th>When</th><th>Field</th><th>Old</th><th>New</th><th>By</th></tr></thead><tbody>${hist.map(a=>`<tr><td class="num">${dt(a.ts,X.tz)}</td><td>${esc(a.field)}</td><td>${esc(a.old)}</td><td>${esc(a.new)}</td><td>${esc(a.by)}</td></tr>`).join("")}</tbody></table></div>`:`<p class="muted" style="margin:0">No changes in this session. Seeded history is not shown.</p>`}</section>
  </aside></div>`;
  $("#dx").onclick=closeOverlay; $("#dbg").onclick=e=>{if(e.target.id==="dbg")closeOverlay()};
  document.querySelectorAll("[data-trackset]").forEach(a=>a.addEventListener("click",()=>{trk.id=a.dataset.trackset}));
  document.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{const a=b.dataset.act;
    const set=(s,ev)=>{audit(o.id,"status",o.status,s);o.status=s;emit(ev,o.id,"")};

    if(a==="release") set("Confirmed","order.released");
    if(a==="invoice"){set("Invoiced","invoice.created");toast(`Invoice raised for ${o.id}: ${money(o.sell+taxAmt,X.ccy)} incl. ${tax.name}.`)}
    openOrder(o.id); if(route()!=="driver") VIEWS[route()]();});
}

/* ---------------- PLANNING ---------------- */
const plan={vehicleId:""};
VIEWS.planning=function(){
  const X=T(); const busy=new Set(X.trips.filter(tr=>tr.ms<6).map(tr=>tr.vehicleId));
  const open=X.orders.filter(o=>o.status==="Confirmed").sort((a,b)=>a.pickupTs-b.pickupTs);
  const freeV=X.vehicles.filter(v=>!busy.has(v.id));
  if(!freeV.find(v=>v.id===plan.vehicleId)) plan.vehicleId=freeV[0]?.id||"";
  const sel=open.filter(o=>ui.sel.has(o.id)); const v=veh(plan.vehicleId);
  const wt=sel.reduce((s,o)=>s+o.weight,0), pal=sel.reduce((s,o)=>s+o.pallets,0);
  const wPct=v?wt/v.kg*100:0, pPct=v&&v.pal?pal/v.pal*100:0;
  const equipMismatch=v&&sel.some(o=>o.equip!==v.equip);
  const over=wPct>100||pPct>100; const lanes=new Set(sel.map(o=>o.origin+"-"+o.dest));
  $("#view").innerHTML=`
  <div class="grid g-2">
   <section class="panel"><div class="panel-h"><h2>${t("unplanned")} (${open.length})</h2><span class="muted" style="font-size:12.5px">Tick orders to build a load</span></div>
    <div class="tbl-wrap" style="max-height:560px;overflow:auto"><table><thead><tr><th></th><th>${t("order")}</th><th>${t("customer")}</th><th>Lane</th><th>${t("pickup")}</th><th class="r">${t("weight")}</th><th class="r">Pal</th><th>Equipment</th></tr></thead><tbody>
    ${open.map(o=>`<tr><td><input type="checkbox" data-psel="${o.id}" ${ui.sel.has(o.id)?"checked":""} aria-label="Select ${o.id}"></td><td class="mono">${o.id}</td><td>${esc(cust(o.customerId).name)}</td><td class="mono">${o.origin} → ${o.dest}</td><td class="num">${dt(o.pickupTs,X.tz)}</td><td class="r num">${nfmt(o.weight)}</td><td class="r num">${o.pallets}</td><td>${esc(o.equip)}</td></tr>`).join("")||`<tr><td colspan="8" class="muted">All confirmed orders are planned. Create one under Orders.</td></tr>`}
    </tbody></table></div></section>
   <section class="panel"><div class="panel-h"><h2>Load builder</h2></div><div class="panel-b stack">
    <label class="ctl" style="flex-direction:column;align-items:stretch">${t("selectVehicle")} (${freeV.length} available)
     <select id="pv">${freeV.map(x=>`<option value="${x.id}" ${x.id===plan.vehicleId?"selected":""}>${esc(x.plate)} · ${esc(x.equip)} · ${nfmt(x.kg)} kg${x.owner?" · "+esc(X.parties.find(p=>p.id===x.owner).name):" · own fleet"}</option>`).join("")}</select></label>
    ${v?`<dl class="kv"><dt>${t("driverL")}</dt><dd>${esc(drvr(v.driverId).name)} <span class="muted mono">${esc(drvr(v.driverId).phone)}</span></dd></dl>`:""}
    <div><div class="row" style="justify-content:space-between;font-size:12.5px"><span>${t("weight")}</span><span class="num">${nfmt(wt)} / ${nfmt(v?.kg||0)} kg · ${Math.round(wPct)}%</span></div><div class="bar ${wPct>100?"over":""}"><i style="width:${Math.min(100,wPct)}%"></i></div></div>
    <div><div class="row" style="justify-content:space-between;font-size:12.5px"><span>Pallets</span><span class="num">${pal} / ${v?.pal||"–"} · ${v?.pal?Math.round(pPct)+"%":"n/a"}</span></div><div class="bar ${pPct>100?"over":""}"><i style="width:${Math.min(100,pPct)}%"></i></div></div>
    <div class="muted" style="font-size:12.5px">${t("selectedOrders")}: ${sel.length}${sel.length?` · ${[...lanes].length} lane(s)`:""}</div>
    ${over?`<div class="note bad">Load is over capacity. Remove an order or pick a larger vehicle.</div>`:""}
    ${equipMismatch?`<div class="note warn">Some orders asked for different equipment than ${esc(v.equip)}. The planner can override.</div>`:""}
    ${lanes.size>1?`<div class="note info">Multi-lane loads become multi-stop trips. This demo routes the trip on the first order's lane.</div>`:""}
    <button class="btn primary" id="mkTrip" ${!sel.length||over||!v?"disabled":""}>${t("createTrip")}</button>
    <p class="muted" style="font-size:12px;margin:0">Route optimisation (OR-Tools) is Phase 3. This demo shows manual load building with live utilisation.</p>
   </div></section>
  </div>`;
  document.querySelectorAll("[data-psel]").forEach(el=>el.onchange=()=>{el.checked?ui.sel.add(el.dataset.psel):ui.sel.delete(el.dataset.psel);VIEWS.planning()});
  $("#pv")&&($("#pv").onchange=e=>{plan.vehicleId=e.target.value;VIEWS.planning()});
  $("#mkTrip").onclick=()=>{
    const first=sel[0]; const trip={id:`${X.prefix}-TRP-${String(++X.tripSeq).padStart(4,"0")}`,vehicleId:v.id,driverId:v.driverId,orderIds:sel.map(o=>o.id),from:first.origin,to:first.dest,ms:0,progress:0,startTs:Date.now()};
    X.trips.push(trip); sel.forEach(o=>{audit(o.id,"status",o.status,"Dispatched");o.status="Dispatched";o.tripId=trip.id;o.ms=0;ui.sel.delete(o.id)});
    emit("trip.created",trip.id,`${sel.length} order(s), ${v.plate}`); emit("trip.dispatched",trip.id,`Pushed to driver app: ${drvr(v.driverId).name}`);
    drv.tripId=trip.id; toast(`${trip.id} dispatched to ${drvr(v.driverId).name}. Open the Driver app to run it.`); VIEWS.planning();};
};

/* ---------------- CONTROL TOWER ---------------- */
let ctSel=null;
VIEWS.tracking=function(){
  const X=T(); const active=X.trips.filter(tr=>tr.ms<6).map(tr=>({tr,r:riskOf(tr)})).sort((a,b)=>b.r.score-a.r.score);
  $("#view").innerHTML=`
  <div class="grid g-2">
   <section class="panel"><div class="panel-h"><h2>${t("liveMap")} · ${active.length} trips</h2><span class="row" style="font-size:12px;gap:12px">${pill(t("onTrack"),"p-ok")}${pill("Watch","p-warn")}${pill(t("late"),"p-bad")}${pill("Not departed","p-info")}</span></div><div class="panel-b" id="ctMap">${mapSVG({highlight:ctSel})}</div>
    <p class="muted" style="font-size:12px;margin:0 14px 14px">Positions update every second in this demo (production: GPS every 30–60 s). Geofences raise "Arrived" automatically.</p></section>
   <section class="panel"><div class="panel-h"><h2>Open exceptions</h2></div><div class="panel-b stack" id="ctEx"></div></section>
  </div>
  <section class="panel"><div class="panel-h"><h2>${t("atRisk")}</h2><span class="muted" style="font-size:12px">Ranked by risk score: ETA vs delivery window, plus open exceptions</span></div>
   <div class="tbl-wrap"><table><thead><tr><th>Trip</th><th>${t("order")}</th><th>${t("vehicle")}</th><th>${t("driverL")}</th><th>Milestone</th><th>${t("progress")}</th><th>${t("eta")}</th><th>Deliver by</th><th>${t("risk")}</th><th></th></tr></thead><tbody id="ctRows"></tbody></table></div></section>`;
  updateTracking();
};
function updateTracking(){
  const X=T(); if(!$("#ctRows")) return;
  const active=X.trips.filter(tr=>tr.ms<6).map(tr=>({tr,r:riskOf(tr)})).sort((a,b)=>b.r.score-a.r.score);
  $("#ctMap").innerHTML=mapSVG({highlight:ctSel});
  $("#ctRows").innerHTML=active.map(({tr,r})=>{const o=X.orders.find(x=>x.id===tr.orderIds[0]);return `<tr class="click" data-trip="${tr.id}" style="${ctSel===tr.id?"background:var(--accent-soft)":""}">
    <td class="mono">${tr.id}</td><td class="mono">${tr.orderIds.join(", ")}</td><td class="mono">${esc(veh(tr.vehicleId).plate)}</td><td>${esc(drvr(tr.driverId).name)}</td>
    <td>${tr.ms===0?'Dispatched <span class="muted">(awaiting accept)</span>':esc(MILESTONES[tr.ms-1])}</td>
    <td style="min-width:110px"><div class="bar"><i style="width:${Math.round(tr.progress*100)}%"></i></div></td>
    <td class="num">${dt(etaOf(tr),X.tz)}</td><td class="num">${dt(o.deliverBy,X.tz)}</td><td>${riskPill(r)}</td>
    <td><button class="btn sm" data-notify="${tr.id}">Notify customer</button></td></tr>`}).join("");
  const ex=X.exceptions.filter(e=>!e.closed);
  $("#ctEx").innerHTML=ex.length?ex.map(e=>{const age=Math.round((Date.now()-e.openedTs)/60e3);const breach=age>e.slaMin;return `<div class="panel" style="padding:10px 12px;display:flex;flex-direction:column;gap:4px">
    <div class="row"><b style="margin-inline-end:auto">${esc(e.type)}</b>${pill(e.severity,e.severity==="High"?"p-bad":"p-warn")}</div>
    <div class="muted" style="font-size:12.5px"><span class="mono">${e.id} · ${e.tripId}</span> · Owner ${esc(e.owner)}</div>
    <div style="font-size:12.5px">${breach?`<span style="color:var(--bad)">SLA breached: open ${age} min, SLA ${e.slaMin} min</span>`:`Open ${age} min of ${e.slaMin} min SLA`}</div>
    <div class="row"><button class="btn sm" data-resolve="${e.id}">Resolve</button></div></div>`}).join(""):`<p class="muted" style="margin:0">No open exceptions.</p>`;
  document.querySelectorAll("[data-trip]").forEach(el=>el.onclick=()=>{ctSel=ctSel===el.dataset.trip?null:el.dataset.trip;updateTracking()});
  document.querySelectorAll("[data-notify]").forEach(b=>b.onclick=e=>{e.stopPropagation();const tr=X.trips.find(x=>x.id===b.dataset.notify);emit("notification.sent",tr.orderIds[0],"Customer ETA update (email + WhatsApp)");toast(`ETA update queued to the customer for ${tr.orderIds[0]}. Delivery runs through the notification service, not this demo.`)});
  document.querySelectorAll("[data-resolve]").forEach(b=>b.onclick=()=>{const e=X.exceptions.find(x=>x.id===b.dataset.resolve);e.closed=Date.now();audit(e.id,"status","Open","Resolved");emit("exception.resolved",e.tripId,e.type);updateTracking()});
}

/* ---------------- DRIVER APP ---------------- */
const drv={tripId:null,offline:false,queue:[],screen:"trip",photos:0,sigData:null,log:[]};
const ACTION_LABEL={accept:"Accept trip",arrived_pickup:"Arrived at pickup",loaded:"Loaded",departed:"Departed",arrived_delivery:"Arrived at delivery",pod:"POD captured",exception:"Exception reported"};
VIEWS.driver=function(){
  const X=T(); const trips=X.trips.filter(tr=>tr.ms<6);
  if(!trips.find(tr=>tr.id===drv.tripId)) drv.tripId=(trips.find(tr=>tr.ms===0)||trips[0])?.id||null;
  const tr=X.trips.find(x=>x.id===drv.tripId);
  $("#view").innerHTML=`
  <div class="phone-wrap">
   <div class="phone" ${lang==="ar"?'dir="rtl"':""}>
    <div class="ph-status"><span>${new Intl.DateTimeFormat(LOCALE[lang],{hour:"2-digit",minute:"2-digit",timeZone:X.tz}).format(new Date())}</span><span>${drv.offline?"✈ "+t("airplane"):"4G ▂▄▆"}</span></div>
    <div id="phone"></div>
   </div>
   <div class="stack" style="flex:1;min-width:260px">
    <section class="panel"><div class="panel-h"><h2>Simulator</h2></div><div class="panel-b stack">
     <label class="ctl" style="flex-direction:column;align-items:stretch">Signed in as driver
      <select id="dTrip">${trips.map(x=>`<option value="${x.id}" ${x.id===drv.tripId?"selected":""}>${esc(drvr(x.driverId).name)} · ${x.id} · ${x.ms===0?"new job":esc(MILESTONES[x.ms-1])}</option>`).join("")}</select></label>
     <label class="row" style="gap:8px;font-weight:600"><input type="checkbox" id="dOff" ${drv.offline?"checked":""}> ${t("airplane")} (phone offline)</label>
     <p class="muted" style="margin:0;font-size:12.5px">Turn on airplane mode, then run the whole trip: milestones, POD signature and photos. Everything is queued on the phone. The office side doesn't change until you go back online and the queue syncs.</p>
    </div></section>
    <section class="panel"><div class="panel-h"><h2>Offline queue · ${drv.queue.length} ${t("queued")}</h2></div><div class="panel-b">
     ${drv.queue.length?drv.queue.map(q=>`<div class="q-item">${new Date(q.deviceTs).toISOString().slice(11,19)}Z · ${esc(q.tripId)} · ${esc(ACTION_LABEL[q.type])} · ${q.gps}</div>`).join(""):`<p class="muted" style="margin:0">Empty. Actions go straight to the server while the phone is online.</p>`}
    </div></section>
    <section class="panel"><div class="panel-h"><h2>Server received</h2></div><div class="panel-b">
     ${drv.log.length?drv.log.slice(0,8).map(l=>`<div class="q-item">${esc(l)}</div>`).join(""):`<p class="muted" style="margin:0">No driver events yet in this session.</p>`}
    </div></section>
   </div>
  </div>`;
  $("#dTrip").onchange=e=>{drv.tripId=e.target.value;drv.screen="trip";VIEWS.driver()};
  $("#dOff").onchange=e=>{drv.offline=e.target.checked;if(!drv.offline)syncQueue();VIEWS.driver()};
  renderPhone(tr);
};
function localMs(tr){ // milestone index as the phone sees it (server state + queued actions)
  let ms=tr.ms; drv.queue.filter(q=>q.tripId===tr.id).forEach(q=>{const i=["accept","arrived_pickup","loaded","departed","arrived_delivery","pod"].indexOf(q.type);if(i>=0)ms=Math.max(ms,i+1)});return ms}
function renderPhone(tr){
  const X=T(); const P=$("#phone");
  const sync=drv.offline?`<span class="ph-sync" style="background:#fdebc8;color:#7a4800">${t("offline")} · ${drv.queue.length}</span>`:`<span class="ph-sync" style="background:#dcf2e7;color:#16653f">✓ ${t("synced")}</span>`;
  if(!tr){P.innerHTML=`<div class="ph-top"><div><b>My jobs</b></div>${sync}</div><div class="ph-body"><div class="ph-card">No trips assigned. Dispatch one from Planning.</div></div>`;return}
  const d=drvr(tr.driverId), o=X.orders.find(x=>x.id===tr.orderIds[0]), a=city(tr.from), b=city(tr.to), ms=localMs(tr);
  const head=`<div class="ph-top"><div><b>${esc(d.name)}</b><small>${esc(veh(tr.vehicleId).plate)} · ${tr.id}</small></div>${sync}</div>`;
  if(drv.screen==="pod"){
    P.innerHTML=head+`<div class="ph-body">
     <div class="ph-card"><b style="font-size:16px">Proof of delivery</b><span style="font-size:13px">${esc(b.name)} · ${tr.orderIds.length} order(s) · ${o.pallets} pallets expected</span></div>
     <label>Recipient name<input id="podName" placeholder="Name of person receiving" autocomplete="off"></label>
     <label>Pallets delivered<input id="podQty" type="number" inputmode="numeric" value="${o.pallets}"></label>
     <label>Signature<canvas id="sig" class="sig"></canvas></label>
     <div class="ph-grid"><button class="big blue" id="podPhoto" type="button"><svg viewBox="0 0 24 24"><path d="M4 7h3l2-3h6l2 3h3v13H4z"/><circle cx="12" cy="13" r="4"/></svg>Photo (${drv.photos})</button><button class="big" style="background:#5c6b79" id="sigClear" type="button">Clear sign</button></div>
     <input type="file" id="podFile" accept="image/*" multiple hidden>
     <div id="podErr" style="color:#c23b31;font-size:13px"></div>
     <button class="big go" id="podDone"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-11"/></svg>Complete delivery</button>
     <button class="big" style="background:#e4e8ec;color:#222" id="podBack">Back</button></div>`;
    setupSig();
    $("#podPhoto").onclick=()=>$("#podFile").click();
    $("#podFile").onchange=e=>{drv.photos+=e.target.files.length;$("#podPhoto").lastChild.textContent=`Photo (${drv.photos})`};
    $("#sigClear").onclick=setupSig;
    $("#podBack").onclick=()=>{drv.screen="trip";renderPhone(tr)};
    $("#podDone").onclick=()=>{const name=$("#podName").value.trim();if(!name){$("#podErr").textContent="Enter the recipient's name.";return}
      if(!drv.sigData){$("#podErr").textContent="Ask the recipient to sign.";return}

    return;
  }
  const steps=[["accept","Accept trip","go",'<path d="M5 12l5 5 9-11"/>'],["arrived_pickup","Arrived at pickup","blue",'<circle cx="12" cy="10" r="3"/><path d="M12 21s-7-6-7-11a7 7 0 0 1 14 0c0 5-7 11-7 11z"/>'],["loaded","Loaded","blue",'<rect x="3" y="7" width="18" height="12"/><path d="M3 11h18"/>'],["departed","Departed","go",'<path d="M3 12h14M13 6l6 6-6 6"/>'],["arrived_delivery","Arrived at delivery","blue",'<circle cx="12" cy="10" r="3"/><path d="M12 21s-7-6-7-11a7 7 0 0 1 14 0c0 5-7 11-7 11z"/>'],["pod","Capture POD","amber",'<path d="M4 20h16M6 16l10-10 3 3-10 10H6z"/>']];
  const next=steps[ms];
  P.innerHTML=head+`<div class="ph-body">
   <div class="ph-card">
    <div class="ph-stop"><i style="background:#2a6db5">P</i><div><b>${esc(a.name)}</b><div style="color:#5c6b79">${dt(o.pickupTs,X.tz)}</div></div></div>
    <div class="ph-stop"><i style="background:#1f8a5b">D</i><div><b>${esc(b.name)}</b><div style="color:#5c6b79">by ${dt(o.deliverBy,X.tz)}</div></div></div>
    <div style="font-size:13px;color:#33414d">${nfmt(tr.orderIds.reduce((s,id)=>s+X.orders.find(x=>x.id===id).weight,0))} kg · ${esc(veh(tr.vehicleId).equip)} · ${nfmt(o.km)} km</div>
    <div class="row" style="gap:6px"><span style="font-size:12px;background:#eef1f4;border-radius:99px;padding:3px 10px">📞 ${esc(cust(o.customerId).name)}</span><a href="https://www.google.com/maps/dir/?api=1&destination=${b.lat},${b.lon}" target="_blank" rel="noopener" style="font-size:12px;background:#eef1f4;border-radius:99px;padding:3px 10px;color:#123047;text-decoration:none">Navigate ↗</a></div>
   </div>

   ${next?`<button class="big ${next[2]}" id="nextBtn"><svg viewBox="0 0 24 24">${next[3]}</svg>${next[1]}</button>`:`<div class="ph-card" style="background:#dcf2e7;border-color:#b5e2cb;color:#16653f;font-weight:600">Trip complete. ${drv.queue.length?"Waiting to sync.":"Synced to the office."}</div>`}
   ${ms===0?`<button class="big" style="background:#e4e8ec;color:#222" id="rejBtn">Reject…</button>`:""}
   ${ms>0&&ms<6?`<div class="ph-grid"><button class="big red" id="exBtn"><svg viewBox="0 0 24 24"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/></svg>Problem</button><button class="big" style="background:#5c6b79" id="expBtn"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>Expense</button></div>`:""}
   <div style="font-size:11.5px;color:#5c6b79;text-align:center">Every action stores device time, GPS and later server time.</div>
  </div>`;
  if(next) $("#nextBtn").onclick=()=>{if(next[0]==="pod"){drv.screen="pod";renderPhone(tr)}else{doAction(tr,next[0]);VIEWS.driver()}};
  $("#rejBtn")&&($("#rejBtn").onclick=()=>toast("Reject asks for a reason code: vehicle issue, hours limit, personal. Not wired in the demo."));
  $("#exBtn")&&($("#exBtn").onclick=()=>{doAction(tr,"exception",{type:"Delay: traffic"});VIEWS.driver()});
  $("#expBtn")&&($("#expBtn").onclick=()=>toast("Expense capture: amount, type (fuel, Salik, parking) and receipt photo. Coming in Phase 1."));
}
function setupSig(){const c=$("#sig");if(!c)return;const r=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1;c.width=r.width*dpr;c.height=r.height*dpr;const g=c.getContext("2d");g.scale(dpr,dpr);g.lineWidth=2.4;g.lineCap="round";g.strokeStyle="#0d1b2a";drv.sigData=null;
  let down=false;const pos=e=>{const b=c.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
  c.onpointerdown=e=>{down=true;c.setPointerCapture(e.pointerId);const[x,y]=pos(e);g.beginPath();g.moveTo(x,y)};
  c.onpointermove=e=>{if(!down)return;const[x,y]=pos(e);g.lineTo(x,y);g.stroke()};
  c.onpointerup=()=>{down=false;drv.sigData=c.toDataURL("image/png")}}
function gpsFor(tr){const a=city(tr.from),b=city(tr.to),p=tr.progress;return `${(a.lat+(b.lat-a.lat)*p).toFixed(4)},${(a.lon+(b.lon-a.lon)*p).toFixed(4)}`}
function doAction(tr,type,data={}){
  const act={id:crypto.randomUUID?crypto.randomUUID():String(Math.random()),tenant:tenantKey,tripId:tr.id,type,data,deviceTs:Date.now(),gps:gpsFor(tr)};
  if(drv.offline){drv.queue.push(act);return}
  applyAction(act);
}
function applyAction(act){
  const X=TENANTS[act.tenant], tr=X.trips.find(x=>x.id===act.tripId); if(!tr) return;
  const serverTs=Date.now(); const idx=["accept","arrived_pickup","loaded","departed","arrived_delivery","pod"].indexOf(act.type);
  const lag=Math.round((serverTs-act.deviceTs)/1000);
  drv.log.unshift(`${act.tripId} · ${ACTION_LABEL[act.type]} · device ${new Date(act.deviceTs).toISOString().slice(11,19)}Z · server +${lag}s`);
  if(act.type==="exception"){X.exceptions.push({id:"EX-"+(200+X.exceptions.length),tripId:tr.id,type:act.data.type+" (driver)",severity:"Medium",owner:X.users[2]?.[0]||X.users[0][0],openedTs:act.deviceTs,slaMin:60});
    X.events.unshift({ts:serverTs,type:"exception.raised",agg:tr.id,info:act.data.type});return}
  if(idx<0||idx+1<=tr.ms) return; // idempotent: already applied
  tr.ms=idx+1; if(act.type==="accept"&&!tr.acceptedTs) tr.acceptedTs=act.deviceTs;
  if(act.type==="arrived_delivery") tr.progress=1;
  tr.orderIds.forEach(id=>{const o=X.orders.find(x=>x.id===id);o.ms=tr.ms;o.msTs=o.msTs||{};o.msTs[idx]=act.deviceTs;
    const newStatus=act.type==="departed"?"In transit":act.type==="pod"?"POD received":null;
    if(newStatus&&o.status!==newStatus){X.audit.unshift({ts:serverTs,entity:o.id,field:"status",old:o.status,new:newStatus,by:drvr(tr.driverId).name+" (driver app)"});o.status=newStatus}
    if(act.type==="pod"){o.pod={name:act.data.name,ts:act.deviceTs,photos:act.data.photos,sig:act.data.sig,qty:act.data.qty,gps:act.gps,onTime:act.deviceTs<=o.deliverBy};}
  });
  const evt={accept:"trip.accepted",arrived_pickup:"stop.arrived",loaded:"stop.loaded",departed:"shipment.in_transit",arrived_delivery:"stop.arrived",pod:"shipment.pod_captured"}[act.type];
  X.events.unshift({ts:serverTs,type:evt,agg:tr.id,info:`device ${new Date(act.deviceTs).toISOString().slice(11,19)}Z · ${act.gps}`});
}
function syncQueue(){const n=drv.queue.length;if(!n)return;const q=drv.queue.splice(0);q.sort((a,b)=>a.deviceTs-b.deviceTs).forEach(applyAction);toast(`Back online. ${n} queued action(s) synced in order with no data loss.`)}

/* ---------------- CUSTOMER TRACKING ---------------- */
const trk={id:null};
VIEWS.track=function(){
  const X=T(); const cands=X.orders.filter(o=>o.tripId||o.pod).sort((a,b)=>(b.status==="In transit")-(a.status==="In transit"));
  if(!trk.id||!X.orders.find(o=>o.id===trk.id)) trk.id=cands[0]?.id;
  const o=X.orders.find(x=>x.id===trk.id); const tr=o&&tripOf(o);
  $("#view").innerHTML=`
  <div class="note info">This is the public tracking page a customer opens from a link in an email or WhatsApp message. It needs no login and carries the tenant's branding. Its URL pattern is <span class="mono">track.${X.key==="gulf"?"gulfhaul.ae":"indusfreight.in"}/t/&lt;token&gt;</span>.</div>
  <div class="row"><label class="ctl">Shipment <input type="search" id="tq" value="${esc(trk.id||"")}" list="tlist" style="width:200px"></label><datalist id="tlist">${cands.slice(0,40).map(c=>`<option value="${c.id}">`).join("")}</datalist><button class="btn sm" id="tgo">Track</button></div>
  ${o?`<div class="trk-head" style="background:${X.brand}"><div class="brand-mark" style="background:#fff;color:${X.brand}">${X.prefix}</div><div style="margin-inline-end:auto"><h2>${esc(X.name)}</h2><div style="opacity:.8" class="mono">${o.id} · ${esc(o.ref)}</div></div>
    <div><div style="opacity:.8;font-size:12px">${o.pod?"Delivered":t("eta")}</div><div class="trk-status num">${o.pod?dt(o.pod.ts,X.tz):tr?dt(etaOf(tr),X.tz):"—"}</div></div></div>
   <div class="grid g-2">
    <section class="panel"><div class="panel-b" id="trkMap">${tr&&tr.ms<6?mapSVG({trips:[tr],highlight:tr.id}):`<p class="muted" style="margin:0">Trip complete. The live map is hidden after delivery for driver privacy.</p>`}</div></section>
    <section class="panel"><div class="panel-h"><h2>${esc(tst(o.status))}</h2></div><div class="panel-b stack">
      <div class="muted">${esc(city(o.origin).name)} → ${esc(city(o.dest).name)}</div>
      <ul class="timeline">${MILESTONES.map((m,i)=>`<li class="${i<o.ms?"done":i===o.ms?"now":""}"><span></span><div>${esc(m)}${o.msTs?.[i]?` <span class="muted num">· ${dt(o.msTs[i],X.tz)}</span>`:""}</div></li>`).join("")}</ul>
      ${o.pod?`<div class="note ok">Received by ${esc(o.pod.name)}. POD document available to download.</div>${o.pod.sig?`<img src="${o.pod.sig}" alt="Signature" style="background:#fff;border:1px solid var(--line);border-radius:6px;max-height:100px">`:""}`:""}
    </div></section>
   </div>`:`<p class="muted">No trackable shipments.</p>`}`;
  $("#tgo").onclick=()=>{trk.id=$("#tq").value.trim();VIEWS.track()};
  $("#tq").onkeydown=e=>{if(e.key==="Enter"){trk.id=e.target.value.trim();VIEWS.track()}};
};

/* ---------------- ADMIN ---------------- */
const adm={tab:"roles",roleId:"R3"};
VIEWS.admin=function(){
  const X=T(); const tabs=[["roles",t("roles")],["users",t("users")],["audit",t("audit")],["events",t("events")],["master","Master data"],["isolation",t("isolation")]];

  if(adm.tab==="roles"){
    if(!X.roles.find(r=>r.id===adm.roleId)) adm.roleId=X.roles[0].id; const role=X.roles.find(r=>r.id===adm.roleId);

     <div class="stack">${X.roles.map(r=>`<button class="btn" style="justify-content:space-between;${r.id===adm.roleId?"border-color:var(--accent);background:var(--accent-soft)":""}" data-role="${r.id}"><span>${esc(r.name)}</span><span class="muted" style="font-size:11px">${r.system?"default":"custom"}</span></button>`).join("")}</div>
     <div class="stack" style="min-width:0">

       ${MODULES.map(m=>`<tr><td>${m}</td>${ACTIONS.map(a=>`<td><input type="checkbox" aria-label="${m} ${a}" data-perm="${m}|${a}" ${role.perms[m].has(a)?"checked":""}></td>`).join("")}</tr>`).join("")}
      </tbody></table></div>
      <p class="muted" style="font-size:12px;margin:0">Changes apply at once: the role's permission version goes up and cached permissions are dropped. Each change is written to the audit log.</p>
     </div></div>`;
  } else if(adm.tab==="users"){
    body=`<div class="tbl-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Scope</th><th>MFA</th><th>Status</th></tr></thead><tbody>
     ${X.users.map(u=>`<tr><td>${esc(u.name)}</td><td class="mono">${esc(u.email)}</td><td><select data-urole="${u.id}" aria-label="Role for ${esc(u.name)}">${X.roles.map(r=>`<option ${r.name===u.role?"selected":""}>${esc(r.name)}</option>`).join("")}</select></td><td>${esc(u.scope)}</td><td>${u.mfa?pill("Enrolled","p-ok"):pill("Not enrolled","p-warn")}</td><td>${pill(u.status,"p-ok")}</td></tr>`).join("")}
     </tbody></table></div>
     <form class="row" id="invite" style="margin-top:12px"><input type="text" id="invName" placeholder="Full name" aria-label="Full name"><select id="invRole" aria-label="Role">${X.roles.map(r=>`<option>${esc(r.name)}</option>`).join("")}</select><button class="btn primary">Invite user</button></form>`;
  } else if(adm.tab==="audit"){
    body=X.audit.length?`<div class="tbl-wrap"><table><thead><tr><th>When</th><th>Entity</th><th>Field</th><th>Old</th><th>New</th><th>By</th></tr></thead><tbody>${X.audit.slice(0,200).map(a=>`<tr><td class="num">${dt(a.ts,X.tz)}</td><td class="mono">${esc(a.entity)}</td><td>${esc(a.field)}</td><td>${esc(a.old)}</td><td>${esc(a.new)}</td><td>${esc(a.by)}</td></tr>`).join("")}</tbody></table></div>`:`<p class="muted">Nothing changed yet in this session. Create an order, dispatch a trip or edit a role, and every change shows up here.</p>`;
  } else if(adm.tab==="events"){
    body=`<p class="muted" style="margin:0 0 10px;font-size:12.5px">Each event is written to the outbox table in the same transaction as the change, then published to the event bus. Webhooks and integrations consume this stream.</p><div class="tbl-wrap"><table><thead><tr><th>When</th><th>Event</th><th>Aggregate</th><th>Detail</th></tr></thead><tbody>${X.events.slice(0,200).map(e=>`<tr><td class="num">${dt(e.ts,X.tz)}</td><td class="mono">${esc(e.type)}</td><td class="mono">${esc(e.agg)}</td><td>${esc(e.info)}</td></tr>`).join("")}</tbody></table></div>`;
  } else if(adm.tab==="master"){
    const cs=X.parties.filter(p=>p.type==="customer"), ks=X.parties.filter(p=>p.type==="carrier");
    body=`<div class="grid g-2e">
     <section class="panel"><div class="panel-h"><h2>Customers (${cs.length})</h2></div><div class="tbl-wrap"><table><thead><tr><th>Name</th><th>${X.taxScheme}</th><th class="r">Credit limit</th></tr></thead><tbody>${cs.map(c=>`<tr><td>${esc(c.name)}</td><td class="mono">${esc(c.taxId)}</td><td class="r num">${money(c.credit,X.ccy)}</td></tr>`).join("")}</tbody></table></div></section>
     <section class="panel"><div class="panel-h"><h2>Subcontractors (${ks.length})</h2></div><div class="tbl-wrap"><table><thead><tr><th>Name</th><th>Trade licence expiry</th><th class="r">Score</th></tr></thead><tbody>${ks.map(k=>{const days=Math.round((k.licExpiry-Date.now())/DAY);return `<tr><td>${esc(k.name)}</td><td>${dt(k.licExpiry,X.tz,false)} ${days<=30?pill(`Expires in ${days} days`,"p-warn"):""}</td><td class="r num">${k.score}</td></tr>`}).join("")}</tbody></table></div></section>
     <section class="panel"><div class="panel-h"><h2>Fleet (${X.vehicles.length})</h2></div><div class="tbl-wrap" style="max-height:340px;overflow:auto"><table><thead><tr><th>Plate</th><th>Equipment</th><th class="r">kg</th><th class="r">Pal</th><th>Owner</th></tr></thead><tbody>${X.vehicles.map(v=>`<tr><td class="mono">${esc(v.plate)}</td><td>${esc(v.equip)}</td><td class="r num">${nfmt(v.kg)}</td><td class="r num">${v.pal||"–"}</td><td>${v.owner?esc(X.parties.find(p=>p.id===v.owner).name):"Own fleet"}</td></tr>`).join("")}</tbody></table></div></section>
     <section class="panel"><div class="panel-h"><h2>Locations (${X.cities.length})</h2></div><div class="tbl-wrap"><table><thead><tr><th>Code</th><th>Name</th><th>Country</th><th>Tax rule</th></tr></thead><tbody>${X.cities.map(c=>`<tr><td class="mono">${c.code}</td><td>${esc(c.name)}</td><td>${c.cc}</td><td>${esc(X.countryTax[c.cc]?.name||"")} ${Math.round((X.countryTax[c.cc]?.rate||0)*100)}%</td></tr>`).join("")}</tbody></table></div></section>
    </div>`;
  } else if(adm.tab==="isolation"){
    const other=TENANTS[tenantKey==="gulf"?"indus":"gulf"]; const probe=other.orders[0];
    body=`<div class="stack" style="max-width:760px">
     <p style="margin:0">Signed in as <b>${esc(ME().name)}</b> of tenant <b>${esc(X.name)}</b> (<span class="mono">${X.id.slice(0,8)}…</span>). Each tenant has its own currency, tax rules, numbering and data. No tenant, currency or tax rate is hard-coded.</p>
     <div class="row"><button class="btn primary" id="probe">Try to open another tenant's order ${esc(probe.id)}</button></div>

SET LOCAL app.tenant_id = '${X.id}';
-- every tenant table carries:
CREATE POLICY tenant_isolation ON orders.order
  USING (tenant_id = current_setting('app.tenant_id')::uuid);</pre>
    </div>`;
  }
  $("#view").innerHTML=`<section class="panel"><div class="tabs" role="tablist" style="padding:0 10px">${tabs.map(([k,l])=>`<button role="tab" aria-selected="${adm.tab===k}" data-tab="${k}">${esc(l)}${k==="audit"?` (${X.audit.length})`:k==="events"?` (${X.events.length})`:""}</button>`).join("")}</div><div class="panel-b">${body}</div></section>`;
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{adm.tab=b.dataset.tab;VIEWS.admin()});
  document.querySelectorAll("[data-role]").forEach(b=>b.onclick=()=>{adm.roleId=b.dataset.role;VIEWS.admin()});
  document.querySelectorAll("[data-perm]").forEach(c=>c.onchange=()=>{const role=X.roles.find(r=>r.id===adm.roleId);const [m,a]=c.dataset.perm.split("|");
    if(role.name==="Tenant admin"&&!c.checked&&m==="Admin"){c.checked=true;toast("You can't remove Admin rights from the last admin role, or everyone would be locked out.");return}
    c.checked?role.perms[m].add(a):role.perms[m].delete(a);audit("role:"+role.name,`${m}.${a}`,c.checked?"denied":"granted",c.checked?"granted":"denied");emit("role.permissions_changed",role.name,`${m}:${a} ${c.checked?"granted":"revoked"}`)});
  $("#cloneRole")&&($("#cloneRole").onclick=()=>{const role=X.roles.find(r=>r.id===adm.roleId);const copy={id:"R"+(X.roles.length+1)+"x"+Date.now()%1000,name:`${role.name} (copy)`,system:false,perms:Object.fromEntries(MODULES.map(m=>[m,new Set(role.perms[m])]))};X.roles.push(copy);adm.roleId=copy.id;audit("role:"+copy.name,"(created)","",`cloned from ${role.name}`);emit("role.created",copy.name,"Cloned");VIEWS.admin()});
  document.querySelectorAll("[data-urole]").forEach(s=>s.onchange=()=>{const u=X.users.find(x=>x.id===s.dataset.urole);audit("user:"+u.email,"role",u.role,s.value);emit("user.role_assigned",u.email,s.value);u.role=s.value;toast(`${u.name} is now ${s.value}.`)});

};

/* ---------------- live tick ---------------- */
setInterval(()=>{
  Object.values(TENANTS).forEach(X=>X.trips.forEach(tr=>{
    if(tr.ms===4||tr.ms===5||tr.ms>=6) return;
    if(tr.ms===3){tr.progress=Math.min(1,tr.progress+0.0015+(tr.orderIds.length%3)*0.0004);
      if(tr.progress>=1&&!tr.geofenced){tr.geofenced=true;tr.ms=4;tr.orderIds.forEach(id=>{const o=X.orders.find(x=>x.id===id);o.ms=4;o.msTs=o.msTs||{};o.msTs[4]=Date.now()});X.events.unshift({ts:Date.now(),type:"stop.arrived",agg:tr.id,info:"Auto by geofence (driver confirmation pending)"})}}
  }));
  const v=route();
  if(document.hidden) return;
  if(v==="tracking") updateTracking();
  else if(v==="dashboard"&&$("#dashMap")) $("#dashMap").innerHTML=mapSVG();
  else if(v==="track"&&$("#trkMap")){const o=T().orders.find(x=>x.id===trk.id),tr=o&&tripOf(o);if(tr&&tr.ms<6)$("#trkMap").innerHTML=mapSVG({trips:[tr],highlight:tr.id})}
},1000);

render();
</script>
