<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap">
<style>
/* Layout: ops console — fixed sidebar + dense work area; collapses to a top tab strip on phones. Palette: night-shift slate with a hi-vis amber signal. */
:root{
  --bg:#f3f5f7; --panel:#ffffff; --sunk:#e9edf1; --line:#d6dde4; --fg:#16212c; --muted:#5c6b79;
  --nav:#14202b; --nav-fg:#c9d4de; --nav-active:#f2a516;
  --accent:#d98a00; --accent-fg:#1a1200; --accent-soft:#fdf0d5;
  --ok:#1f8a5b; --ok-soft:#dcf2e7; --warn:#b86e00; --warn-soft:#fdebc8; --bad:#c23b31; --bad-soft:#f9dedb; --info:#2a6db5; --info-soft:#dde9f7;
  --map-bg:#e4ebf0; --map-grid:#d2dce4; --map-lane:#8fa3b4;
  --f-sans:"IBM Plex Sans","IBM Plex Sans Arabic","Noto Sans Devanagari",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e151c; --panel:#152029; --sunk:#1b2833; --line:#2a3a47; --fg:#e3eaf0; --muted:#8fa0ae;
  --nav:#0a1016; --nav-fg:#a9b7c3; --nav-active:#f5b335;
  --accent:#f5b335; --accent-fg:#1a1200; --accent-soft:#3a2c0e;
  --ok:#43c08a; --ok-soft:#163528; --warn:#f0a43a; --warn-soft:#3a2a10; --bad:#f0776d; --bad-soft:#3d1c1a; --info:#6aa8ec; --info-soft:#162a40;
  --map-bg:#111c25; --map-grid:#1c2a36; --map-lane:#4c6273; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e151c; --panel:#152029; --sunk:#1b2833; --line:#2a3a47; --fg:#e3eaf0; --muted:#8fa0ae;
  --nav:#0a1016; --nav-fg:#a9b7c3; --nav-active:#f5b335;
  --accent:#f5b335; --accent-fg:#1a1200; --accent-soft:#3a2c0e;
  --ok:#43c08a; --ok-soft:#163528; --warn:#f0a43a; --warn-soft:#3a2a10; --bad:#f0776d; --bad-soft:#3d1c1a; --info:#6aa8ec; --info-soft:#162a40;
  --map-bg:#111c25; --map-grid:#1c2a36; --map-lane:#4c6273; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-sans);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--nav)}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100%}
.side{background:var(--nav);color:var(--nav-fg);padding-block:18px;padding-inline:14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;padding-left:max(14px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;letter-spacing:.02em}
.brand-mark{width:30px;height:30px;border-radius:5px;background:var(--nav-active);color:#1a1200;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:600}
.brand small{display:block;font-weight:400;color:var(--nav-fg);font-size:11px;letter-spacing:.04em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:5px;color:var(--nav-fg);text-decoration:none;font-weight:500}
.nav a:hover{background:#ffffff12;color:#fff}
.nav a[aria-current="page"]{background:#ffffff14;color:#fff;box-shadow:inset 3px 0 0 var(--nav-active)}
[dir="rtl"] .nav a[aria-current="page"]{box-shadow:inset -3px 0 0 var(--nav-active)}
.nav svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8}
.nav-sep{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:#7f909e;padding:10px 10px 4px}
.side-foot{margin-top:auto;font-size:11.5px;color:#7f909e}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px;padding-inline:20px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding-right:max(20px,env(safe-area-inset-right,0px))}
.top h1{font-size:17px;margin:0;font-weight:600;margin-inline-end:auto;text-wrap:balance}
.ctl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
select,input[type=text],input[type=number],input[type=date],input[type=search],textarea{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:6px 8px;min-width:0}
select:focus,input:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.content{padding-block:18px 40px;padding-inline:20px;padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px;min-width:0}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:6px 12px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.05)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:3px 8px;font-size:12.5px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line)}
.panel-h h2{font-size:14px;margin:0;font-weight:600;margin-inline-end:auto}
.panel-b{padding:14px}
.grid{display:grid;gap:16px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.g-2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g-2e{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:1100px){.g-2,.g-2e{grid-template-columns:minmax(0,1fr)}}
.kpi{padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi .l{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.kpi .v{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--sunk);position:sticky;top:0}
th.sort{cursor:pointer;user-select:none}
th.sort:hover{color:var(--fg)}
tbody tr:hover{background:var(--sunk)}
tbody tr.click{cursor:pointer}
td.r,th.r{text-align:end}
.pill{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:500;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-info{background:var(--info-soft);color:var(--info)} .p-acc{background:var(--accent-soft);color:var(--warn)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar input[type=search]{width:240px;max-width:100%}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:10px 14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.bar{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--info)}
.bar.over > i{background:var(--bad)}
.hbar{display:grid;grid-template-columns:110px 1fr 48px;gap:8px;align-items:center;font-size:12.5px}
.hbar .bar{height:14px;border-radius:3px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.map{width:100%;height:auto;display:block;background:var(--map-bg);border-radius:var(--r)}
.map text{font-family:var(--f-mono);font-size:12px;fill:var(--muted);font-weight:500}
.drawer-bg{position:fixed;inset:0;background:#0008;z-index:20;display:flex;justify-content:flex-end}
.drawer{background:var(--panel);width:min(560px,100%);height:100%;overflow:auto;padding:18px;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
[dir="rtl"] .drawer{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:18px}
.drawer h2{margin:0;font-size:18px}
.modal-bg{position:fixed;inset:0;background:#0008;z-index:20;display:grid;place-items:center;padding:16px}
.modal{background:var(--panel);border-radius:8px;width:min(640px,100%);max-height:100%;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.form .full{grid-column:1/-1}
@media (max-width:520px){.form{grid-template-columns:minmax(0,1fr)}}
.quote{background:var(--sunk);border-radius:var(--r);padding:12px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:520px){.quote{grid-template-columns:repeat(2,minmax(0,1fr))}}
.quote .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.quote .v{font-weight:600;font-variant-numeric:tabular-nums}
.note{padding:8px 12px;border-radius:5px;font-size:12.5px}
.note.warn{background:var(--warn-soft);color:var(--warn)} .note.bad{background:var(--bad-soft);color:var(--bad)} .note.ok{background:var(--ok-soft);color:var(--ok)} .note.info{background:var(--info-soft);color:var(--info)}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.timeline li{display:grid;grid-template-columns:18px 1fr;gap:10px;position:relative;padding-bottom:12px;font-size:13px}
.timeline li::before{content:"";width:10px;height:10px;border-radius:50%;border:2px solid var(--line);background:var(--panel);margin-top:4px;margin-inline-start:2px}
.timeline li.done::before{background:var(--ok);border-color:var(--ok)}
.timeline li.now::before{background:var(--accent);border-color:var(--accent)}
.timeline li::after{content:"";position:absolute;inset-inline-start:7px;top:18px;bottom:0;width:2px;background:var(--line)}
.timeline li:last-child::after{display:none}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.matrix td,.matrix th{text-align:center} .matrix td:first-child,.matrix th:first-child{text-align:start}
.toast{position:fixed;inset-inline-end:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:6px;z-index:30;font-size:13px;max-width:min(380px,calc(100% - 32px))}
/* driver phone */
.phone-wrap{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}
.phone{width:340px;max-width:100%;border:10px solid #1d252c;border-radius:34px;background:#f7f8f9;color:#111;overflow:hidden;box-shadow:0 10px 30px #0003;flex:none}
.ph-status{display:flex;justify-content:space-between;align-items:center;padding:6px 16px;font-size:11.5px;background:#1d252c;color:#dfe6ec}
.ph-top{background:#123047;color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px}
.ph-top b{font-size:15px} .ph-top small{display:block;opacity:.75;font-size:11.5px}
.ph-sync{margin-inline-start:auto;font-size:11px;padding:3px 8px;border-radius:99px;font-weight:600}
.ph-body{padding:12px;display:flex;flex-direction:column;gap:10px;min-height:520px}
.ph-card{background:#fff;border:1px solid #dde3e8;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.ph-stop{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;font-size:13px}
.ph-stop i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;color:#fff;font-size:12px}
.big{display:flex;align-items:center;justify-content:center;gap:10px;min-height:64px;border-radius:14px;border:0;font-size:17px;font-weight:700;cursor:pointer;width:100%;color:#fff}
.big svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2.2}
.big.go{background:#1f8a5b} .big.amber{background:#d98a00;color:#1a1200} .big.amber svg{stroke:#1a1200} .big.red{background:#c23b31} .big.blue{background:#2a6db5}
.ph-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ph-grid .big{min-height:56px;font-size:14px}
.sig{width:100%;height:140px;background:#fff;border:2px dashed #b7c2cb;border-radius:10px;touch-action:none;display:block}
.ph-body input{background:#fff;border:1px solid #c9d2da;border-radius:10px;padding:12px;font-size:16px;color:#111;width:100%}
.ph-body label{font-size:12.5px;color:#4d5a66;display:flex;flex-direction:column;gap:4px}
.lnk{background:none;border:0;padding:0;color:var(--info);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.svc{font-family:var(--f-mono);font-size:11.5px;font-weight:600;border:1px solid var(--line);border-radius:4px;padding:0 6px;background:var(--sunk);white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:6px 12px;cursor:pointer;font-weight:500;color:var(--muted)}
.seg button[aria-checked="true"]{background:var(--accent);color:var(--accent-fg)}
.labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.label{background:#fff;color:#000;border:1px solid #000;border-radius:4px;padding:10px;display:flex;flex-direction:column;gap:6px;font-family:var(--f-sans);aspect-ratio:2/3;max-width:100%;overflow:hidden}
.label small{font-size:9.5px;letter-spacing:.08em;color:#333;display:block}
.lb-top{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #000;padding-bottom:6px}
.lb-top b{font-size:16px}
.lb-svc{background:#000;color:#fff;font-family:var(--f-mono);font-weight:700;font-size:22px;padding:2px 8px}
.lb-addr{display:flex;flex-direction:column;font-size:12px;line-height:1.25;border-bottom:1px solid #000;padding-bottom:6px}
.lb-route{display:flex;gap:10px;align-items:center;border-bottom:1px solid #000;padding-bottom:6px}
.lb-zone{font-family:var(--f-mono);font-weight:700;font-size:40px;line-height:1}
.lb-route b{font-size:13px;display:block}
.lb-bc svg{width:100%;height:auto;display:block}
.lb-fallback{font-family:var(--f-mono);font-size:12px;text-align:center;padding:16px 0;border:1px dashed #000}
.lb-foot{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;margin-top:auto}
.lb-piece{font-size:15px}
.lb-qr svg{width:84px;height:84px;display:block}
.lnk:disabled{color:var(--muted);text-decoration:none;cursor:default}
.q-item{font-size:12px;font-family:var(--f-mono);padding:4px 0;border-bottom:1px dashed var(--line)}
/* public tracking */
.trk-head{border-radius:var(--r);padding:18px;color:#fff;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.trk-head h2{margin:0;font-size:20px}
.trk-status{font-size:26px;font-weight:700}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;height:auto;flex-direction:row;align-items:center;padding-block:8px;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));gap:12px;overflow-x:auto;z-index:6}
  .brand small,.nav-sep,.side-foot{display:none}
  .nav{flex-direction:row}
  .nav a span{white-space:nowrap}
  .top{position:static;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
  .content{padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">

    <div class="brand"><div class="brand-mark">HP</div><div>HP TMS<small id="tenantName"></small></div></div>

    <div class="side-foot" id="sideFoot"></div>

  <div class="main">

    </header>
    <main class="content" id="view"></main>
  </div>
</div>
<div id="overlay"></div>
<div id="toast" class="toast" hidden></div>

  const lines=orders.map(o=>({orderId:o.id,lane:`${o.origin} → ${o.dest}`,ref:o.ref,svc:o.svc,sell:o.lines.sell.map(l=>({...l})),net:o.sell,tax:taxFor(X,o)}));
  const g={}; lines.forEach(l=>{const k=l.tax.name+"|"+l.tax.rate;g[k]=g[k]||{name:l.tax.name,rate:l.tax.rate,base:0,tax:0};g[k].base=round2(g[k].base+l.net);g[k].tax=round2(g[k].tax+l.net*l.tax.rate)});
  const net=round2(lines.reduce((s,l)=>s+l.net,0)), tax=round2(Object.values(g).reduce((s,x)=>s+x.tax,0)), d=new Date(issueTs);
  const inv={id:`${X.prefix}-INV-${String(d.getUTCFullYear()).slice(2)}${String(d.getUTCMonth()+1).padStart(2,"0")}-${pad4(++X.invSeq)}`,customerId:custId,lines,taxGroups:Object.values(g),net,tax,total:round2(net+tax),
    issueTs,dueTs:issueTs+c.terms*DAY,paid:0,payments:[],credits:[],disputes:[]};

}
const invBalance = inv => {const b=round2(inv.total-inv.paid-inv.credits.reduce((s,c)=>s+c.total,0));return Math.abs(b)<0.005?0:b};
function invStatus(inv){const b=invBalance(inv);if(b<=0.005)return "Paid";if(inv.disputes.some(d=>!d.closed))return "Disputed";if(Date.now()>inv.dueTs)return "Overdue";if(inv.paid>0||inv.credits.length)return "Part paid";return "Issued"}

/* ---------------- purchase invoices (AP): matching ---------------- */
const hintText=h=>h?[h.lane,h.date,h.kg?nfmt(h.kg)+" kg":""].filter(Boolean).join(" · "):"";
function apCandidates(X,ci,l){
  const taken=new Set(X.carrierInvoices.flatMap(c=>c.lines.filter(x=>x!==l&&x.orderId&&!x.rejected).map(x=>x.orderId)));
  const h=l.hint||{};

    if(h.lane===`${o.origin}-${o.dest}`){s+=40;why.push("lane")}
    if(h.date){const dd=Math.abs(new Date(h.date+"T12:00:00Z").getTime()-(o.pickupTs+X.tzOff*HOUR))/DAY;if(dd<=1){s+=30;why.push("date")}else if(dd<=3){s+=15;why.push("date ±3 days")}}
    if(h.kg&&Math.abs(h.kg-o.weight)<=o.weight*.02){s+=10;why.push("weight")}
    const v=Math.abs(l.amount-o.buy);if(v<=Math.max(X.tol.pct*o.buy,X.tol.abs)){s+=20;why.push("amount")}else if(v<=o.buy*.1){s+=10;why.push("amount ±10%")}
    return {o,score:Math.min(100,s),why}}).filter(c=>c.score>=30).sort((a,b)=>b.score-a.score);}
function autoMatch(X,ci){let n=0;ci.lines.forEach(l=>{if(l.orderId||l.rejected)return;const c=apCandidates(X,ci,l);
  if(c[0]&&c[0].score>=80&&(!c[1]||c[1].score<=c[0].score-15)){l.orderId=c[0].o.id;l.matchedBy="auto";l.confidence=c[0].score;l.why=c[0].why;n++}});return n}
function ciLineMatch(X,ci,l){
  if(l.rejected) return {res:"Rejected",cls:"",ok:true,pay:0,v:0};
  if(!l.orderId) return {res:"Unmatched",cls:"p-warn",ok:false,pay:0,v:0,unmatched:true};
  const o=X.orders.find(x=>x.id===l.orderId);
  const dupOf=X.carrierInvoices.find(c2=>c2!==ci&&c2.receivedTs<ci.receivedTs&&c2.lines.some(l2=>l2.orderId===l.orderId&&!l2.rejected));
  if(dupOf) return {res:`Duplicate of ${dupOf.no}`,cls:"p-bad",ok:false,pay:0,dup:true,v:l.amount};
  if(!o.pod) return {res:"No POD yet",cls:"p-warn",ok:false,pay:0,hold:true,v:round2(l.amount-o.buy)};
  const v=round2(l.amount-o.buy), tol=Math.max(X.tol.pct*o.buy,X.tol.abs);
  if(l.override) return {res:"Approved by Finance",cls:"p-ok",ok:true,pay:l.amount,v};
  if(l.dispute) return {res:"Disputed · paying accrual",cls:"p-warn",ok:true,pay:o.buy,v};
  const within=Math.abs(v)<0.01?"Matched":Math.abs(v)<=tol?"Within tolerance":null;
  if(!within) return {res:"Over tolerance",cls:"p-bad",ok:false,pay:0,v};
  if(X.apMode==="manual"&&!l.approved) return {res:`${within} · needs approval`,cls:"p-info",ok:false,pay:0,v,needsApproval:true};
  return {res:within,cls:"p-ok",ok:true,pay:l.amount,v};
}
function ciState(X,ci){const ms=ci.lines.map(l=>ciLineMatch(X,ci,l));const pay=round2(ms.reduce((s,m)=>s+m.pay,0));
  const inv=round2(ci.lines.reduce((s,l)=>s+l.amount,0)), acc=round2(ci.lines.reduce((s,l)=>s+(l.orderId?X.orders.find(o=>o.id===l.orderId)?.buy||0:0),0));
  const base={ms,pay,inv,acc,matched:ci.lines.filter(l=>l.orderId||l.rejected).length};
  if(ci.paidTs) return {...base,st:"Paid",cls:"p-ok"};
  if(ci.batchId) return {...base,st:"In payment batch",cls:"p-ok"};
  if(ms.every(m=>m.ok)) return {...base,st:ci.touched||X.apMode==="manual"?"Approved":"Auto-approved",cls:"p-ok",approvable:true};
  if(ms.some(m=>!m.ok&&!m.hold&&!m.needsApproval&&!m.unmatched)) return {...base,st:"Needs review",cls:"p-bad"};
  if(ms.some(m=>m.unmatched)) return {...base,st:"Matching needed",cls:"p-warn"};
  if(ms.some(m=>m.needsApproval)) return {...base,st:"Awaiting approval",cls:"p-info"};
  return {...base,st:"On hold: POD missing",cls:"p-warn"};}
function selfBill(X,kid){const billed=new Set(X.carrierInvoices.flatMap(c=>c.lines.filter(l=>!l.rejected&&l.orderId).map(l=>l.orderId)));
  const k=X.parties.find(p=>p.id===kid); const ords=X.orders.filter(o=>o.carrierId===kid&&o.pod&&!billed.has(o.id)); if(!ords.length) return null;
  const now=Date.now();

  ci.lines.forEach(l=>l.approved=true);

function carrierCompliance(k){const docs=[["Trade licence",k.licNo,k.licExpiry],["Goods-in-transit insurance",k.insurer,k.insExpiry],["Third-party liability insurance",k.insurer,k.tplExpiry],[k.taxDocName,k.taxNo,null]];
  return docs.map(([n,ref,exp],i)=>{const d=exp?Math.round((exp-Date.now())/DAY):null;return {i,n,ref,exp,days:d,st:!ref?"Missing":d===null?"Valid":d<0?"Expired":d<=30?"Expiring":"Valid"}})}

  return {n:os.length,delivered:del.length,ot:del.length?del.filter(o=>o.pod.ts<=o.deliverBy).length/del.length:null,acc,

    open:X.carrierInvoices.filter(c=>c.carrierId===k.id&&!c.paidTs).reduce((s,c)=>s+ciState(X,c).inv,0),fleet:X.vehicles.filter(v=>v.owner===k.id).length}}

  const ex=T().exceptions.find(e=>e.tripId===trip.id&&!e.closed);let score=slack<0?80+Math.min(19,-slack*5):slack<2?55:15; if(ex) score=Math.max(score,ex.severity==="High"?90:65);

function mapSVG(opts={}){
  const cs=T().cities, lats=cs.map(c=>c.lat), lons=cs.map(c=>c.lon);
  const pad=.6, minLat=Math.min(...lats)-pad, maxLat=Math.max(...lats)+pad, minLon=Math.min(...lons)-pad, maxLon=Math.max(...lons)+pad;
  const k=Math.cos((minLat+maxLat)/2*Math.PI/180), W=900, H=Math.round(W*(maxLat-minLat)/((maxLon-minLon)*k));
  const P=(lat,lon)=>[((lon-minLon)/(maxLon-minLon))*W, ((maxLat-lat)/(maxLat-minLat))*H];
  let g=`<svg class="map" direction="ltr" style="direction:ltr" viewBox="0 0 ${W} ${H}" role="img" aria-label="Map of active trips">`;
  for(let x=Math.ceil(minLon);x<maxLon;x++){const [px]=P(minLat,x);g+=`<line x1="${px}" y1="0" x2="${px}" y2="${H}" stroke="var(--map-grid)"/>`}
  for(let y=Math.ceil(minLat);y<maxLat;y++){const [,py]=P(y,minLon);g+=`<line x1="0" y1="${py}" x2="${W}" y2="${py}" stroke="var(--map-grid)"/>`}
  const trips=(opts.trips||T().trips.filter(tr=>tr.ms<6));
  trips.forEach(tr=>{const a=city(tr.from),b=city(tr.to);const [x1,y1]=P(a.lat,a.lon),[x2,y2]=P(b.lat,b.lon);g+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--map-lane)" stroke-width="1.2" stroke-dasharray="4 4"/>`});
  cs.forEach(c=>{const [x,y]=P(c.lat,c.lon);g+=`<circle cx="${x}" cy="${y}" r="4" fill="var(--panel)" stroke="var(--fg)" stroke-width="1.5"/><text x="${x+7}" y="${y-6}"><title>${esc(c.name)}</title>${esc(c.code)}</text>`});
  trips.forEach(tr=>{const a=city(tr.from),b=city(tr.to);const lat=a.lat+(b.lat-a.lat)*tr.progress, lon=a.lon+(b.lon-a.lon)*tr.progress;const [x,y]=P(lat,lon);
    const r=riskOf(tr);const col=tr.ms<3?"var(--info)":r.score>=75?"var(--bad)":r.score>=50?"var(--warn)":"var(--ok)";const hl=opts.highlight===tr.id;
    g+=`<g><circle cx="${x}" cy="${y}" r="${hl?11:7}" fill="${col}" stroke="var(--panel)" stroke-width="2"/>${hl?`<text x="${x+13}" y="${y+4}" style="fill:var(--fg);font-weight:600">${esc(veh(tr.vehicleId).plate)}</text>`:""}<title>${esc(tr.id)} · ${esc(veh(tr.vehicleId).plate)}</title></g>`});
  return g+"</svg>";
}

  </aside></div>`;
  $("#dx").onclick=closeOverlay; $("#dbg").onclick=e=>{if(e.target.id==="dbg")closeOverlay()};

    if(d.unit==="%"&&o.acc.some(a=>a.code===code)){toast(`${d.label} is already on this order.`);return}
    const before=o.sell,beforeBuy=o.buy;o.acc.push({code,qty});recalc(X,o);
    audit(o.id,"sell (excl. tax)",money2(before,X.ccy),money2(o.sell,X.ccy));if(o.buy!==beforeBuy)audit(o.id,"cost accrual",money2(beforeBuy,X.ccy),money2(o.buy,X.ccy));
    emit("charge.added",o.id,`${d.label} × ${qty}`);openOrder(o.id);refreshBehind()});
  document.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{const a=b.dataset.act;
    const set=(s,ev,info="")=>{audit(o.id,"status",o.status,s);o.status=s;emit(ev,o.id,info)};
    if(a==="confirm") set("Confirmed","order.confirmed");
    if(a==="release"){if(o.holdReason){audit(o.id,"margin approval","pending",`approved by ${ME().name}`);o.holdReason=null;set("Confirmed","order.margin_approved",`${Math.round(m*100)}%`)}else set("Confirmed","order.released")}
    if(a==="invoice"){const inv=makeInvoice(X,o.customerId,[o],Date.now());audit(o.id,"status","POD received","Invoiced");audit(inv.id,"(created)","",money2(inv.total,X.ccy));emit("invoice.issued",inv.id,`${c.name} · ${money2(inv.total,X.ccy)}`);refreshBehind();openInvoice(inv.id);return}
    if(a==="viewinv"){openInvoice(o.invoiceId);return}
    if(a==="labels"){openLabels([o.id]);return}
    openOrder(o.id); refreshBehind();});
}

   <div class="grid g-2e" style="gap:12px">

     ${l.sell.map(s=>`<tr><td class="muted" style="padding-inline-start:28px;white-space:normal">${esc(s.label)}</td><td></td><td class="r num muted">${n2(s.amount)}</td></tr>`).join("")}`}).join("")}
   </tbody><tbody>
    <tr><td colspan="2"><b>Net total</b></td><td class="r num"><b>${n2(inv.net)}</b></td></tr>

  document.querySelectorAll("[data-cancel]").forEach(b=>b.onclick=()=>openInvoice(id));

  document.querySelectorAll("[data-dres]").forEach(b=>b.onclick=()=>{const [did,how]=b.dataset.dres.split("|");const d=inv.disputes.find(x=>x.id===did);d.closed=Date.now();

/* ---------------- PLANNING ---------------- */
const plan={vehicleId:"",tab:"builder",cv:{}};
const freeVehicles=X=>{const busy=new Set(X.trips.filter(tr=>tr.ms<6).map(tr=>tr.vehicleId));return X.vehicles.filter(v=>{if(busy.has(v.id))return false;if(!v.owner)return true;const k=X.parties.find(p=>p.id===v.owner);return k.status==="Approved"&&carrierHealth(k).c!=="p-bad"})};
VIEWS.planning=function(){
  const X=T(), n=consolSuggestions(X).length;
  $("#view").innerHTML=`<section class="panel"><div class="tabs" role="tablist" style="padding:0 10px">
    <button role="tab" aria-selected="${plan.tab==="builder"}" data-ptab="builder">Load builder</button>
    <button role="tab" aria-selected="${plan.tab==="consol"}" data-ptab="consol">Order consolidation${n?` (${n})`:""}</button></div><div class="panel-b" id="planBody"></div></section>`;
  document.querySelectorAll("[data-ptab]").forEach(b=>b.onclick=()=>{plan.tab=b.dataset.ptab;VIEWS.planning()});
  (plan.tab==="builder"?planBuilder:planConsol)(X);
  document.querySelectorAll("#planBody [data-open]").forEach(b=>b.onclick=e=>{e.stopPropagation();openOrder(b.dataset.open)});
};
function planBuilder(X){
  const open=X.orders.filter(o=>o.status==="Confirmed").sort((a,b)=>a.pickupTs-b.pickupTs);
  const freeV=freeVehicles(X);

  const wt=sel.reduce((s,o)=>s+o.weight,0), pal=sel.reduce((s,o)=>s+o.pallets,0);
  const wPct=v?wt/v.kg*100:0, pPct=v&&v.pal?pal/v.pal*100:0;
  const equipMismatch=v&&sel.some(o=>o.equip!==v.equip), over=wPct>100||pPct>100;
  const prev=sel.length&&v?tripCostPreview(X,sel,v.owner||null):null;
  const tight=sel.filter(o=>["EXP","SBD"].includes(o.svc));
  $("#planBody").innerHTML=`<div class="grid g-2">
   <section class="panel"><div class="panel-h"><h2>${t("unplanned")} (${open.length})</h2><span class="muted" style="font-size:12.5px">Tick orders to build a load</span></div>
    <div class="tbl-wrap" style="max-height:560px;overflow:auto"><table><thead><tr><th></th><th>${t("order")}</th><th>Service</th><th>${t("customer")}</th><th>Lane</th><th>${t("pickup")}</th><th>Promised by</th><th class="r">${t("weight")}</th><th class="r">Pal</th><th>Equipment</th></tr></thead><tbody>
    ${open.map(o=>`<tr><td><input type="checkbox" data-psel="${o.id}" ${ui.sel.has(o.id)?"checked":""} aria-label="Select ${o.id}"></td><td>${lnk(o.id,"data-open")}</td><td>${svcTag(o)}</td><td>${esc(cust(o.customerId).name)}</td><td class="mono">${o.origin} → ${o.dest}</td><td class="num">${dt(o.pickupTs,X.tz)}</td><td class="num">${dt(o.deliverBy,X.tz)}</td><td class="r num">${nfmt(o.weight)}</td><td class="r num">${o.pallets}</td><td>${esc(o.equip)}</td></tr>`).join("")||`<tr><td colspan="10" class="muted">All confirmed orders are planned. Create one under Orders.</td></tr>`}
    </tbody></table></div></section>
   <section class="panel"><div class="panel-h"><h2>Load builder</h2></div><div class="panel-b stack">
    <label class="ctl" style="flex-direction:column;align-items:stretch">${t("selectVehicle")} (${freeV.length} available)
     <select id="pv">${freeV.map(x=>`<option value="${x.id}" ${x.id===plan.vehicleId?"selected":""}>${esc(x.plate)} · ${esc(x.equip)} · ${nfmt(x.kg)} kg${x.owner?" · "+esc(X.parties.find(p=>p.id===x.owner).name):" · own fleet"}</option>`).join("")}</select></label>
    ${v?`<dl class="kv"><dt>${t("driverL")}</dt><dd>${esc(drvr(v.driverId).name)} <span class="muted mono">${esc(drvr(v.driverId).phone)}</span></dd></dl>`:""}
    <div><div class="row" style="justify-content:space-between;font-size:12.5px"><span>${t("weight")}</span><span class="num">${nfmt(wt)} / ${nfmt(v?.kg||0)} kg · ${Math.round(wPct)}%</span></div><div class="bar ${wPct>100?"over":""}"><i style="width:${Math.min(100,wPct)}%"></i></div></div>
    <div><div class="row" style="justify-content:space-between;font-size:12.5px"><span>Pallets</span><span class="num">${pal} / ${v?.pal||"–"} · ${v?.pal?Math.round(pPct)+"%":"n/a"}</span></div><div class="bar ${pPct>100?"over":""}"><i style="width:${Math.min(100,pPct)}%"></i></div></div>

    <p class="muted" style="font-size:12px;margin:0">Route optimisation (OR-Tools) is Phase 3. This demo shows manual load building with live utilisation.</p>
   </div></section></div>`;
  document.querySelectorAll("[data-psel]").forEach(el=>el.onchange=()=>{el.checked?ui.sel.add(el.dataset.psel):ui.sel.delete(el.dataset.psel);VIEWS.planning()});

  $("#mkTrip").onclick=()=>{const trip=createTrip(X,sel,v);sel.forEach(o=>ui.sel.delete(o.id));drv.tripId=trip.id;
    toast(`${trip.id} dispatched to ${drvr(v.driverId).name}. Open the Driver app to run it.`);VIEWS.planning()};
}
function planConsol(X){

function setupSig(){const c=$("#sig");if(!c)return;const r=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1;c.width=r.width*dpr;c.height=r.height*dpr;const g=c.getContext("2d");g.scale(dpr,dpr);g.lineWidth=2.4;g.lineCap="round";g.strokeStyle="#0d1b2a";drv.sigData=null;

function applyAction(act){

    if(newStatus&&o.status!==newStatus){X.audit.unshift({ts:serverTs,entity:o.id,field:"status",old:o.status,new:newStatus,by:drvr(tr.driverId).name+" (driver app)"});o.status=newStatus}

}

function openPurchaseInvoice(state={}){

  const today=new Date().toISOString().slice(0,10);

    ${avail.map((o,i)=>`<tr><td><input type="checkbox" data-pil="${o.id}" checked aria-label="Include ${o.id}"></td><td class="mono">${o.id}</td><td class="mono">${o.origin} → ${o.dest}</td><td class="num">${localDay(X,o.pickupTs)}</td><td class="r num">${money2(o.buy,X.ccy)}</td><td class="r"><input type="number" step="0.01" data-pia="${o.id}" value="${(i===1?round2(o.buy*1.08):o.buy).toFixed(2)}" style="width:120px;text-align:end"></td></tr>`).join("")||`<tr><td colspan="6" class="muted">This carrier has no delivered trips waiting for an invoice. Pick another carrier, or complete a subcontracted trip first.</td></tr>`}
   </tbody></table></div>

    if(!no){$("#piErr").innerHTML=`<div class="note bad">Enter the carrier's invoice number.</div>`;return}

    return {cols:[["Order","mono"],["Customer","text"],["Status","text"],["Promised by","date"],["Waiting for","text"],["Value","money"]],rows:os.map(o=>[o.id,cust(o.customerId).name,o.status,o.deliverBy,o.status==="Delivered"?"POD from driver":"Invoice",o.sell]),sum:[["Without POD",nfmt(os.filter(o=>o.status==="Delivered").length)],["Unbilled value",money(os.filter(o=>o.status==="POD received").reduce((s,o)=>s+o.sell,0),X.ccy)]]}}
  if(id==="consol"){const tr=X.trips.filter(t=>t.consolidated);return {cols:[["Trip","mono"],["Orders","text"],["Stops","int"],["Vehicle","mono"],["Separate cost","money"],["Consolidated cost","money"],["Saving","money"]],rows:tr.map(t=>[t.id,t.orderIds.join(", "),t.stops,veh(t.vehicleId).plate,t.sep,t.con,t.sep-t.con]),
    sum:[["Trips",nfmt(tr.length)],["Total saving",money(tr.reduce((s,t)=>s+t.sep-t.con,0),X.ccy)]],empty:"No consolidated trips yet. Use Planning → Order consolidation."}}
}
function cellHTML(X,v,type){if(v==null)return "–";if(type==="money")return money2(v,X.ccy);if(type==="pct")return pct(v);if(type==="int")return nfmt(v);if(type==="date")return dt(v,X.tz);if(type==="pill")return pill(v.t,v.c);if(type==="mono")return `<span class="mono">${esc(v)}</span>`;return esc(v)}
function cellCSV(X,v,type){if(v==null)return "";if(type==="date")return new Date(v).toISOString();if(type==="pill")return v.t;if(type==="pct")return (v*100).toFixed(1);if(type==="money")return v.toFixed(2);return String(v)}
VIEWS.reports=function(){
  const X=T(), R=REPORTS.find(r=>r.id===rep.id), out=runReport(X,rep.id,rep), shown=out.rows.slice(0,200);
  const num=c=>["money","pct","int"].includes(c[1]);
  const chart=out.chart&&out.rows.length?(()=>{const mx=Math.max(...out.rows.map(r=>r[out.chart.value]||0),.0001);const isPct=out.cols[out.chart.value][1]==="pct";
    return `<div class="stack" style="gap:6px">${out.rows.slice(0,12).map(r=>`<div class="hbar" style="grid-template-columns:minmax(90px,200px) 1fr 70px"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r[out.chart.label])}</span><div class="bar"><i style="width:${(r[out.chart.value]||0)/mx*100}%;background:${isPct&&(r[out.chart.value]||0)<.9?"var(--warn)":"var(--info)"}"></i></div><span class="num" style="text-align:end">${cellHTML(X,r[out.chart.value],out.cols[out.chart.value][1])}</span></div>`).join("")}</div>`})():"";
  $("#view").innerHTML=`<div class="grid" style="grid-template-columns:minmax(0,260px) minmax(0,1fr)" id="repGrid">
   <aside class="stack" style="gap:6px">${REPORTS.map(r=>`<button class="btn" style="justify-content:flex-start;text-align:start;white-space:normal;flex-direction:column;align-items:flex-start;gap:2px;${r.id===rep.id?"border-color:var(--accent);background:var(--accent-soft)":""}" data-rep="${r.id}"><b>${esc(r.name)}</b><span class="muted" style="font-size:12px;font-weight:400">${esc(r.desc)}</span></button>`).join("")}
    <section class="panel" style="margin-top:8px"><div class="panel-h"><h2>Scheduled</h2></div><div class="panel-b stack" style="gap:8px">${(X.schedules||[]).map(s=>`<div style="font-size:12.5px"><b>${esc(REPORTS.find(r=>r.id===s.report).name)}</b><br><span class="muted">${esc(s.freq)} · ${esc(s.format)} → ${esc(s.to)}</span> <button class="lnk" data-unsched="${s.id}">Remove</button></div>`).join("")||`<span class="muted" style="font-size:12.5px">None.</span>`}</div></section></aside>
   <section class="panel" style="min-width:0"><div class="panel-h"><h2>${esc(R.name)}</h2>
     ${R.f.includes("range")?`<select id="rR" aria-label="Date range">${[[30,"Last 30 days"],[90,"Last 90 days"],[365,"Last 12 months"],[0,"All time"]].map(([v,l])=>`<option value="${v}" ${rep.range===v?"selected":""}>${l}</option>`).join("")}</select>`:""}
     ${R.f.includes("cust")?`<select id="rC" aria-label="Customer"><option value="">All customers</option>${X.parties.filter(p=>p.type==="customer").map(c=>`<option value="${c.id}" ${rep.cust===c.id?"selected":""}>${esc(c.name)}</option>`).join("")}</select>`:""}
     ${R.f.includes("carrier")?`<select id="rK" aria-label="Carrier"><option value="">All carriers</option>${X.parties.filter(p=>p.type==="carrier").map(c=>`<option value="${c.id}" ${rep.carrier===c.id?"selected":""}>${esc(c.name)}</option>`).join("")}</select>`:""}
     ${R.f.includes("svc")?`<select id="rS" aria-label="Service level"><option value="">All service levels</option>${Object.entries(SERVICE).map(([k,S])=>`<option value="${k}" ${rep.svc===k?"selected":""}>${esc(S.name)}</option>`).join("")}</select>`:""}
     <button class="btn sm" id="rCopy">Copy as CSV</button><button class="btn sm" id="rSched">Schedule…</button></div>
    <div class="panel-b stack">
     ${rep.schedOpen?`<form class="panel panel-b stack" id="schF" style="gap:8px"><b>Email this report on a schedule</b><div class="form">
       <label>Frequency<select id="sF"><option>Daily · 07:00</option><option selected>Weekly · Monday 07:00</option><option>Monthly · 1st 07:00</option></select></label><label>Format<select id="sX"><option>Excel</option><option>PDF</option></select></label>
       <label class="full">Recipients<input type="text" id="sT" value="${esc(ME().email)}"></label></div><div id="sErr"></div><div class="row"><button class="btn primary">Save schedule</button><button type="button" class="btn" id="sX2">${t("cancel")}</button></div></form>`:""}
     ${out.sum?`<div class="row" style="gap:20px">${out.sum.map(([l,v])=>`<div><div class="muted" style="font-size:11.5px;text-transform:uppercase;letter-spacing:.06em">${esc(l)}</div><div style="font-size:20px;font-weight:600" class="num">${v}</div></div>`).join("")}</div>`:""}
     ${chart}
     <div class="tbl-wrap" style="max-height:560px;overflow:auto"><table><thead><tr>${out.cols.map(c=>`<th class="${num(c)?"r":""}">${esc(c[0])}</th>`).join("")}</tr></thead><tbody>
      ${shown.map(r=>`<tr>${r.map((v,i)=>`<td class="${num(out.cols[i])?"r num":""}">${cellHTML(X,v,out.cols[i][1])}</td>`).join("")}</tr>`).join("")||`<tr><td colspan="${out.cols.length}" class="muted">${esc(out.empty||"No rows for these filters.")}</td></tr>`}
     </tbody></table></div>
     <p class="muted" style="font-size:12px;margin:0">${out.rows.length>200?`Showing 200 of ${out.rows.length} rows. Copy as CSV includes all rows. `:""}Excel and PDF files are produced by the report service and emailed on schedule. In this demo, copy the CSV into Excel.</p>
     <textarea id="rCsv" class="mono" readonly hidden style="width:100%;height:120px"></textarea>
    </div></section></div>`;
  if(window.innerWidth<900) $("#repGrid").style.gridTemplateColumns="minmax(0,1fr)";
  document.querySelectorAll("[data-rep]").forEach(b=>b.onclick=()=>{rep.id=b.dataset.rep;rep.schedOpen=false;VIEWS.reports()});
  $("#rR")&&($("#rR").onchange=e=>{rep.range=+e.target.value;VIEWS.reports()}); $("#rC")&&($("#rC").onchange=e=>{rep.cust=e.target.value;VIEWS.reports()});
  $("#rK")&&($("#rK").onchange=e=>{rep.carrier=e.target.value;VIEWS.reports()}); $("#rS")&&($("#rS").onchange=e=>{rep.svc=e.target.value;VIEWS.reports()});
  $("#rCopy").onclick=()=>{const q=s=>/[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s;const csv=[out.cols.map(c=>q(c[0])).join(","),...out.rows.map(r=>r.map((v,i)=>q(cellCSV(X,v,out.cols[i][1]))).join(","))].join("\n");
    const fb=()=>{const ta=$("#rCsv");ta.hidden=false;ta.value=csv;ta.select();toast("CSV is selected below. Press Ctrl+C or ⌘C to copy.")};
    try{navigator.clipboard.writeText(csv).then(()=>toast(`${out.rows.length} rows copied as CSV. Paste into Excel.`)).catch(fb)}catch(e){fb()}
    emit("report.exported",R.name,`${out.rows.length} rows · CSV`)};
  $("#rSched").onclick=()=>{rep.schedOpen=!rep.schedOpen;VIEWS.reports()};
  $("#sX2")&&($("#sX2").onclick=()=>{rep.schedOpen=false;VIEWS.reports()});
  $("#schF")&&($("#schF").onsubmit=e=>{e.preventDefault();const to=$("#sT").value.trim();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+(\s*,\s*[^@\s]+@[^@\s]+\.[^@\s]+)*$/.test(to)){$("#sErr").innerHTML=`<div class="note bad">Enter one or more email addresses, separated by commas.</div>`;return}
    X.schedules=X.schedules||[];X.schedules.push({id:"SCH-"+(X.schedules.length+1)+Date.now()%1000,report:rep.id,freq:$("#sF").value,format:$("#sX").value,to});rep.schedOpen=false;
    audit("report:"+R.name,"schedule","",`${$("#sF").value} → ${to}`);emit("report.scheduled",R.name,`${$("#sF").value} · ${$("#sX").value}`);toast(`${R.name} scheduled.`);VIEWS.reports()});
  document.querySelectorAll("[data-unsched]").forEach(b=>b.onclick=()=>{X.schedules=X.schedules.filter(s=>s.id!==b.dataset.unsched);emit("report.unscheduled",b.dataset.unsched,"");VIEWS.reports()});
};

/* ---------------- live tick ---------------- */
setInterval(()=>{
  Object.values(TENANTS).forEach(X=>X.trips.forEach(tr=>{
    if(tr.ms===4||tr.ms===5||tr.ms>=6) return;
    if(tr.ms===3){tr.progress=Math.min(1,tr.progress+0.0015+(tr.orderIds.length%3)*0.0004);
      if(tr.progress>=1&&!tr.geofenced){tr.geofenced=true;tr.ms=4;tr.orderIds.forEach(id=>{const o=X.orders.find(x=>x.id===id);o.ms=4;o.msTs=o.msTs||{};o.msTs[4]=Date.now()});X.events.unshift({ts:Date.now(),type:"stop.arrived",agg:tr.id,info:"Auto by geofence (driver confirmation pending)"})}}
  }));
  const v=route();
  if(document.hidden) return;
  if(v==="tracking") updateTracking();
  else if(v==="dashboard"&&$("#dashMap")) $("#dashMap").innerHTML=mapSVG();
  else if(v==="track"&&$("#trkMap")){const o=T().orders.find(x=>x.id===trk.id),tr=o&&tripOf(o);if(tr&&tr.ms<6)$("#trkMap").innerHTML=mapSVG({trips:[tr],highlight:tr.id})}
},1000);

render();
</script>
