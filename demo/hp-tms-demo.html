<style>
/* Layout: ops console — fixed sidebar + dense work area; collapses to a top tab strip on phones. Palette: night-shift slate with a hi-vis amber signal. */
:root{
  --bg:#f3f5f7; --panel:#ffffff; --sunk:#e9edf1; --line:#d6dde4; --fg:#16212c; --muted:#5c6b79;
  --nav:#14202b; --nav-fg:#c9d4de; --nav-active:#f2a516;
  --accent:#d98a00; --accent-fg:#1a1200; --accent-soft:#fdf0d5;
  --ok:#1f8a5b; --ok-soft:#dcf2e7; --warn:#b86e00; --warn-soft:#fdebc8; --bad:#c23b31; --bad-soft:#f9dedb; --info:#2a6db5; --info-soft:#dde9f7;
  --map-bg:#e4ebf0; --map-grid:#d2dce4; --map-lane:#8fa3b4;
  --f-sans:"IBM Plex Sans","IBM Plex Sans Arabic","Noto Sans Devanagari",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e151c; --panel:#152029; --sunk:#1b2833; --line:#2a3a47; --fg:#e3eaf0; --muted:#8fa0ae;
  --nav:#0a1016; --nav-fg:#a9b7c3; --nav-active:#f5b335;
  --accent:#f5b335; --accent-fg:#1a1200; --accent-soft:#3a2c0e;
  --ok:#43c08a; --ok-soft:#163528; --warn:#f0a43a; --warn-soft:#3a2a10; --bad:#f0776d; --bad-soft:#3d1c1a; --info:#6aa8ec; --info-soft:#162a40;
  --map-bg:#111c25; --map-grid:#1c2a36; --map-lane:#4c6273; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e151c; --panel:#152029; --sunk:#1b2833; --line:#2a3a47; --fg:#e3eaf0; --muted:#8fa0ae;
  --nav:#0a1016; --nav-fg:#a9b7c3; --nav-active:#f5b335;
  --accent:#f5b335; --accent-fg:#1a1200; --accent-soft:#3a2c0e;
  --ok:#43c08a; --ok-soft:#163528; --warn:#f0a43a; --warn-soft:#3a2a10; --bad:#f0776d; --bad-soft:#3d1c1a; --info:#6aa8ec; --info-soft:#162a40;
  --map-bg:#111c25; --map-grid:#1c2a36; --map-lane:#4c6273; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-sans);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--nav)}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100%}
.side{background:var(--nav);color:var(--nav-fg);padding-block:18px;padding-inline:14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;padding-left:max(14px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;letter-spacing:.02em}
.brand-mark{width:30px;height:30px;border-radius:5px;background:var(--nav-active);color:#1a1200;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:600}
.brand small{display:block;font-weight:400;color:var(--nav-fg);font-size:11px;letter-spacing:.04em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:5px;color:var(--nav-fg);text-decoration:none;font-weight:500}
.nav a:hover{background:#ffffff12;color:#fff}
.nav a[aria-current="page"]{background:#ffffff14;color:#fff;box-shadow:inset 3px 0 0 var(--nav-active)}
[dir="rtl"] .nav a[aria-current="page"]{box-shadow:inset -3px 0 0 var(--nav-active)}
.nav svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8}
.nav-sep{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:#7f909e;padding:10px 10px 4px}
.side-foot{margin-top:auto;font-size:11.5px;color:#7f909e}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px;padding-inline:20px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding-right:max(20px,env(safe-area-inset-right,0px))}
.top h1{font-size:17px;margin:0;font-weight:600;margin-inline-end:auto;text-wrap:balance}
.ctl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
select,input[type=text],input[type=number],input[type=date],input[type=search],textarea{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:6px 8px;min-width:0}
select:focus,input:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.content{padding-block:18px 40px;padding-inline:20px;padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px;min-width:0}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:6px 12px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.05)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:3px 8px;font-size:12.5px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line)}
.panel-h h2{font-size:14px;margin:0;font-weight:600;margin-inline-end:auto}
.panel-b{padding:14px}
.grid{display:grid;gap:16px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.g-2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g-2e{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:1100px){.g-2,.g-2e{grid-template-columns:minmax(0,1fr)}}
.kpi{padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi .l{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.kpi .v{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--sunk);position:sticky;top:0}
th.sort{cursor:pointer;user-select:none}
th.sort:hover{color:var(--fg)}
tbody tr:hover{background:var(--sunk)}
tbody tr.click{cursor:pointer}
td.r,th.r{text-align:end}
.pill{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:500;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-info{background:var(--info-soft);color:var(--info)} .p-acc{background:var(--accent-soft);color:var(--warn)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar input[type=search]{width:240px;max-width:100%}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:10px 14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.bar{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--info)}
.bar.over > i{background:var(--bad)}
.hbar{display:grid;grid-template-columns:110px 1fr 48px;gap:8px;align-items:center;font-size:12.5px}
.hbar .bar{height:14px;border-radius:3px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.map{width:100%;height:auto;display:block;background:var(--map-bg);border-radius:var(--r)}
.map text{font-family:var(--f-mono);font-size:12px;fill:var(--muted);font-weight:500}
.drawer-bg{position:fixed;inset:0;background:#0008;z-index:20;display:flex;justify-content:flex-end}
.drawer{background:var(--panel);width:min(560px,100%);height:100%;overflow:auto;padding:18px;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
[dir="rtl"] .drawer{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:18px}
.drawer h2{margin:0;font-size:18px}
.modal-bg{position:fixed;inset:0;background:#0008;z-index:20;display:grid;place-items:center;padding:16px}
.modal{background:var(--panel);border-radius:8px;width:min(640px,100%);max-height:100%;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.form .full{grid-column:1/-1}
@media (max-width:520px){.form{grid-template-columns:minmax(0,1fr)}}
.quote{background:var(--sunk);border-radius:var(--r);padding:12px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:520px){.quote{grid-template-columns:repeat(2,minmax(0,1fr))}}
.quote .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.quote .v{font-weight:600;font-variant-numeric:tabular-nums}
.note{padding:8px 12px;border-radius:5px;font-size:12.5px}
.note.warn{background:var(--warn-soft);color:var(--warn)} .note.bad{background:var(--bad-soft);color:var(--bad)} .note.ok{background:var(--ok-soft);color:var(--ok)} .note.info{background:var(--info-soft);color:var(--info)}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.timeline li{display:grid;grid-template-columns:18px 1fr;gap:10px;position:relative;padding-bottom:12px;font-size:13px}
.timeline li::before{content:"";width:10px;height:10px;border-radius:50%;border:2px solid var(--line);background:var(--panel);margin-top:4px;margin-inline-start:2px}
.timeline li.done::before{background:var(--ok);border-color:var(--ok)}
.timeline li.now::before{background:var(--accent);border-color:var(--accent)}
.timeline li::after{content:"";position:absolute;inset-inline-start:7px;top:18px;bottom:0;width:2px;background:var(--line)}
.timeline li:last-child::after{display:none}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.matrix td,.matrix th{text-align:center} .matrix td:first-child,.matrix th:first-child{text-align:start}
.toast{position:fixed;inset-inline-end:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:6px;z-index:30;font-size:13px;max-width:min(380px,calc(100% - 32px))}
/* driver phone */
.phone-wrap{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}
.phone{width:340px;max-width:100%;border:10px solid #1d252c;border-radius:34px;background:#f7f8f9;color:#111;overflow:hidden;box-shadow:0 10px 30px #0003;flex:none}
.ph-status{display:flex;justify-content:space-between;align-items:center;padding:6px 16px;font-size:11.5px;background:#1d252c;color:#dfe6ec}
.ph-top{background:#123047;color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px}
.ph-top b{font-size:15px} .ph-top small{display:block;opacity:.75;font-size:11.5px}
.ph-sync{margin-inline-start:auto;font-size:11px;padding:3px 8px;border-radius:99px;font-weight:600}
.ph-body{padding:12px;display:flex;flex-direction:column;gap:10px;min-height:520px}
.ph-card{background:#fff;border:1px solid #dde3e8;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.ph-stop{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;font-size:13px}
.ph-stop i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;color:#fff;font-size:12px}
.big{display:flex;align-items:center;justify-content:center;gap:10px;min-height:64px;border-radius:14px;border:0;font-size:17px;font-weight:700;cursor:pointer;width:100%;color:#fff}
.big svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2.2}
.big.go{background:#1f8a5b} .big.amber{background:#d98a00;color:#1a1200} .big.amber svg{stroke:#1a1200} .big.red{background:#c23b31} .big.blue{background:#2a6db5}
.ph-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ph-grid .big{min-height:56px;font-size:14px}
.sig{width:100%;height:140px;background:#fff;border:2px dashed #b7c2cb;border-radius:10px;touch-action:none;display:block}
.ph-body input{background:#fff;border:1px solid #c9d2da;border-radius:10px;padding:12px;font-size:16px;color:#111;width:100%}
.ph-body label{font-size:12.5px;color:#4d5a66;display:flex;flex-direction:column;gap:4px}
.lnk{background:none;border:0;padding:0;color:var(--info);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.q-item{font-size:12px;font-family:var(--f-mono);padding:4px 0;border-bottom:1px dashed var(--line)}
/* public tracking */
.trk-head{border-radius:var(--r);padding:18px;color:#fff;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.trk-head h2{margin:0;font-size:20px}
.trk-status{font-size:26px;font-weight:700}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;height:auto;flex-direction:row;align-items:center;padding-block:8px;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));gap:12px;overflow-x:auto;z-index:6}
  .brand small,.nav-sep,.side-foot{display:none}
  .nav{flex-direction:row}
  .nav a span{white-space:nowrap}
  .top{position:static;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
  .content{padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <aside class="side">
    <div class="brand"><div class="brand-mark">HP</div><div>HP TMS<small id="tenantName"></small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>
  <div class="main">
    <header class="top">
      <h1 id="pageTitle"></h1>

        <select id="langSel"><option value="en">English</option><option value="ar">العربية</option><option value="hi">हिन्दी</option></select></label>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>
<div id="overlay"></div>
<div id="toast" class="toast" hidden></div>

/* ---------------- rating & charges engine ---------------- */
const r5 = n => Math.round(n/5)*5;
const accDef = (X,code) => X.acc.find(a=>a.code===code);
function fscPct(X){const p=X.fsc.price;const b=X.fsc.bands.find(([lo,hi])=>p>=lo&&p<hi);return b?b[2]:0}
function tariff(X,kmv,eq){const R=X.rates;return Math.max(R.min,R.base+R.perKm*kmv)*EQUIP[eq].rate}

  if(X.acc.some(a=>a.code==="TOLL")&&!o.acc.some(a=>a.code==="TOLL")) o.acc.push({code:"TOLL",qty:o.km});
  if(o.equip==="Lowbed (ODC)"&&!o.acc.some(a=>a.code==="ESC")) o.acc.push({code:"ESC",qty:1});}
function recalc(X,o){
  const c=X.parties.find(p=>p.id===o.customerId), a=X.cityByCode[o.origin], b=X.cityByCode[o.dest];
  const cross=a.cc!==b.cc, f=fscPct(X), sell=[], buy=[];
  const disc=(c.discount||0)+(o.discountPct||0)/100, full=tariff(X,o.km,o.equip), base=r5(full*(1-disc));

  if(f) sell.push({code:"FSC",label:`Fuel surcharge ${(f*100).toFixed(1)}% (diesel index ${X.fsc.price} ${X.fsc.unit})`,amount:round2(base*f)});

  (o.acc||[]).forEach(x=>{const d=accDef(X,x.code);if(!d)return;const amt=d.unit==="%"?round2(base*d.rate):round2(d.rate*x.qty);
    sell.push({code:d.code,label:d.unit==="%"?`${d.label} ${Math.round(d.rate*100)}%`:`${d.label} · ${x.qty} ${d.unit} × ${d.rate} ${X.ccy}`,amount:amt,acc:true})});

    if(f) buy.push({code:"CFSC",label:`Carrier fuel surcharge ${(f*100).toFixed(1)}%`,amount:round2(cf*f)});

    buy.push({code:"DSL",label:`Diesel · ${run} km incl. return × ${O.lPerKm} L/km × ${X.fsc.price}`,amount:round2(run*O.lPerKm*X.fsc.price)});
    buy.push({code:"DRV",label:"Driver trip allowance",amount:round2(O.drvTrip+O.drvPer100*o.km/100)});
    buy.push({code:"VEH",label:`Vehicle cost (lease, insurance, tyres, service) · ${O.fixedKm}/km`,amount:round2(run*O.fixedKm)});
  }
  sell.filter(s=>["SALIK","TOLL","ESC","BORD"].includes(s.code)).forEach(s=>buy.push({code:s.code,label:accDef(X,s.code).label+(s.code==="BORD"?" (agent cost)":" (pass-through)"),amount:s.code==="BORD"?round2(s.amount*.75):s.amount}));
  sell.filter(s=>s.code==="WAIT").forEach(s=>buy.push({code:"WAIT",label:o.carrierId?"Waiting paid to carrier":"Driver overtime (waiting)",amount:round2(s.amount*(o.carrierId?.7:.2))}));
  o.lines={sell,buy}; o.sell=round2(sell.reduce((s,l)=>s+l.amount,0)); o.buy=round2(buy.reduce((s,l)=>s+l.amount,0));

const pad4 = n => String(n).padStart(4,"0");
function makeInvoice(X,custId,orders,issueTs){
  const c=X.parties.find(p=>p.id===custId);
  const lines=orders.map(o=>({orderId:o.id,lane:`${o.origin} → ${o.dest}`,ref:o.ref,sell:o.lines.sell.map(l=>({...l})),net:o.sell,tax:taxFor(X,o)}));

  const net=round2(lines.reduce((s,l)=>s+l.net,0)), tax=round2(Object.values(g).reduce((s,x)=>s+x.tax,0)), d=new Date(issueTs);
  const inv={id:`${X.prefix}-INV-${String(d.getUTCFullYear()).slice(2)}${String(d.getUTCMonth()+1).padStart(2,"0")}-${pad4(++X.invSeq)}`,customerId:custId,lines,taxGroups:Object.values(g),net,tax,total:round2(net+tax),
    issueTs,dueTs:issueTs+c.terms*DAY,paid:0,payments:[],credits:[],disputes:[]};

function ciLineMatch(X,ci,l){
  if(l.rejected) return {res:"Rejected",cls:"",ok:true,pay:0,v:0};
  const o=X.orders.find(x=>x.id===l.orderId);
  const dupOf=X.carrierInvoices.find(c2=>c2!==ci&&c2.receivedTs<ci.receivedTs&&c2.lines.some(l2=>l2.orderId===l.orderId&&!l2.rejected));
  if(dupOf) return {res:`Duplicate of ${dupOf.no}`,cls:"p-bad",ok:false,pay:0,dup:true,v:l.amount};
  if(!o.pod) return {res:"No POD yet",cls:"p-warn",ok:false,pay:0,hold:true,v:round2(l.amount-o.buy)};
  const v=round2(l.amount-o.buy), tol=Math.max(X.tol.pct*o.buy,X.tol.abs);
  if(l.override) return {res:"Approved by Finance",cls:"p-ok",ok:true,pay:l.amount,v};
  if(l.dispute) return {res:"Disputed · paying accrual",cls:"p-warn",ok:true,pay:o.buy,v};
  if(Math.abs(v)<0.01) return {res:"Matched",cls:"p-ok",ok:true,pay:l.amount,v};
  if(Math.abs(v)<=tol) return {res:"Within tolerance",cls:"p-ok",ok:true,pay:l.amount,v};
  return {res:"Over tolerance",cls:"p-bad",ok:false,pay:0,v};
}

  if(ci.batchId) return {...base,st:"Exported to ERP",cls:"p-ok"};
  if(ms.every(m=>m.ok)) return {...base,st:ci.touched?"Approved":"Auto-approved",cls:"p-ok",approvable:true};
  if(ms.some(m=>!m.ok&&!m.hold)) return {...base,st:"Needs review",cls:"p-bad"};
  return {...base,st:"On hold: POD missing",cls:"p-warn"};}
function selfBill(X,kid){const billed=new Set(X.carrierInvoices.flatMap(c=>c.lines.filter(l=>!l.rejected).map(l=>l.orderId)));

function mapSVG(opts={}){
  const cs=T().cities, lats=cs.map(c=>c.lat), lons=cs.map(c=>c.lon);
  const pad=.6, minLat=Math.min(...lats)-pad, maxLat=Math.max(...lats)+pad, minLon=Math.min(...lons)-pad, maxLon=Math.max(...lons)+pad;
  const k=Math.cos((minLat+maxLat)/2*Math.PI/180), W=900, H=Math.round(W*(maxLat-minLat)/((maxLon-minLon)*k));
  const P=(lat,lon)=>[((lon-minLon)/(maxLon-minLon))*W, ((maxLat-lat)/(maxLat-minLat))*H];
  let g=`<svg class="map" direction="ltr" style="direction:ltr" viewBox="0 0 ${W} ${H}" role="img" aria-label="Map of active trips">`;
  for(let x=Math.ceil(minLon);x<maxLon;x++){const [px]=P(minLat,x);g+=`<line x1="${px}" y1="0" x2="${px}" y2="${H}" stroke="var(--map-grid)"/>`}
  for(let y=Math.ceil(minLat);y<maxLat;y++){const [,py]=P(y,minLon);g+=`<line x1="0" y1="${py}" x2="${W}" y2="${py}" stroke="var(--map-grid)"/>`}
  const trips=(opts.trips||T().trips.filter(tr=>tr.ms<6));
  trips.forEach(tr=>{const a=city(tr.from),b=city(tr.to);const [x1,y1]=P(a.lat,a.lon),[x2,y2]=P(b.lat,b.lon);g+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--map-lane)" stroke-width="1.2" stroke-dasharray="4 4"/>`});
  cs.forEach(c=>{const [x,y]=P(c.lat,c.lon);g+=`<circle cx="${x}" cy="${y}" r="4" fill="var(--panel)" stroke="var(--fg)" stroke-width="1.5"/><text x="${x+7}" y="${y-6}"><title>${esc(c.name)}</title>${esc(c.code)}</text>`});
  trips.forEach(tr=>{const a=city(tr.from),b=city(tr.to);const lat=a.lat+(b.lat-a.lat)*tr.progress, lon=a.lon+(b.lon-a.lon)*tr.progress;const [x,y]=P(lat,lon);
    const r=riskOf(tr);const col=tr.ms<3?"var(--info)":r.score>=75?"var(--bad)":r.score>=50?"var(--warn)":"var(--ok)";const hl=opts.highlight===tr.id;
    g+=`<g><circle cx="${x}" cy="${y}" r="${hl?11:7}" fill="${col}" stroke="var(--panel)" stroke-width="2"/>${hl?`<text x="${x+13}" y="${y+4}" style="fill:var(--fg);font-weight:600">${esc(veh(tr.vehicleId).plate)}</text>`:""}<title>${esc(tr.id)} · ${esc(veh(tr.vehicleId).plate)}</title></g>`});
  return g+"</svg>";
}

    audit(o.id,"sell (excl. tax)",money2(before,X.ccy),money2(o.sell,X.ccy));if(o.buy!==beforeBuy)audit(o.id,"cost accrual",money2(beforeBuy,X.ccy),money2(o.buy,X.ccy));

    if(a==="viewinv"){openInvoice(o.invoiceId);return}
    openOrder(o.id); refreshBehind();});
}

   </div>

const plan={vehicleId:""};
VIEWS.planning=function(){
  const X=T(); const busy=new Set(X.trips.filter(tr=>tr.ms<6).map(tr=>tr.vehicleId));
  const open=X.orders.filter(o=>o.status==="Confirmed").sort((a,b)=>a.pickupTs-b.pickupTs);
  const freeV=X.vehicles.filter(v=>!busy.has(v.id));
  if(!freeV.find(v=>v.id===plan.vehicleId)) plan.vehicleId=freeV[0]?.id||"";
  const sel=open.filter(o=>ui.sel.has(o.id)); const v=veh(plan.vehicleId);
  const wt=sel.reduce((s,o)=>s+o.weight,0), pal=sel.reduce((s,o)=>s+o.pallets,0);
  const wPct=v?wt/v.kg*100:0, pPct=v&&v.pal?pal/v.pal*100:0;
  const equipMismatch=v&&sel.some(o=>o.equip!==v.equip);
  const over=wPct>100||pPct>100; const lanes=new Set(sel.map(o=>o.origin+"-"+o.dest));
  $("#view").innerHTML=`
  <div class="grid g-2">
   <section class="panel"><div class="panel-h"><h2>${t("unplanned")} (${open.length})</h2><span class="muted" style="font-size:12.5px">Tick orders to build a load</span></div>
    <div class="tbl-wrap" style="max-height:560px;overflow:auto"><table><thead><tr><th></th><th>${t("order")}</th><th>${t("customer")}</th><th>Lane</th><th>${t("pickup")}</th><th class="r">${t("weight")}</th><th class="r">Pal</th><th>Equipment</th></tr></thead><tbody>
    ${open.map(o=>`<tr><td><input type="checkbox" data-psel="${o.id}" ${ui.sel.has(o.id)?"checked":""} aria-label="Select ${o.id}"></td><td class="mono">${o.id}</td><td>${esc(cust(o.customerId).name)}</td><td class="mono">${o.origin} → ${o.dest}</td><td class="num">${dt(o.pickupTs,X.tz)}</td><td class="r num">${nfmt(o.weight)}</td><td class="r num">${o.pallets}</td><td>${esc(o.equip)}</td></tr>`).join("")||`<tr><td colspan="8" class="muted">All confirmed orders are planned. Create one under Orders.</td></tr>`}
    </tbody></table></div></section>
   <section class="panel"><div class="panel-h"><h2>Load builder</h2></div><div class="panel-b stack">
    <label class="ctl" style="flex-direction:column;align-items:stretch">${t("selectVehicle")} (${freeV.length} available)
     <select id="pv">${freeV.map(x=>`<option value="${x.id}" ${x.id===plan.vehicleId?"selected":""}>${esc(x.plate)} · ${esc(x.equip)} · ${nfmt(x.kg)} kg${x.owner?" · "+esc(X.parties.find(p=>p.id===x.owner).name):" · own fleet"}</option>`).join("")}</select></label>
    ${v?`<dl class="kv"><dt>${t("driverL")}</dt><dd>${esc(drvr(v.driverId).name)} <span class="muted mono">${esc(drvr(v.driverId).phone)}</span></dd></dl>`:""}
    <div><div class="row" style="justify-content:space-between;font-size:12.5px"><span>${t("weight")}</span><span class="num">${nfmt(wt)} / ${nfmt(v?.kg||0)} kg · ${Math.round(wPct)}%</span></div><div class="bar ${wPct>100?"over":""}"><i style="width:${Math.min(100,wPct)}%"></i></div></div>
    <div><div class="row" style="justify-content:space-between;font-size:12.5px"><span>Pallets</span><span class="num">${pal} / ${v?.pal||"–"} · ${v?.pal?Math.round(pPct)+"%":"n/a"}</span></div><div class="bar ${pPct>100?"over":""}"><i style="width:${Math.min(100,pPct)}%"></i></div></div>
    <div class="muted" style="font-size:12.5px">${t("selectedOrders")}: ${sel.length}${sel.length?` · ${[...lanes].length} lane(s)`:""}</div>
    ${over?`<div class="note bad">Load is over capacity. Remove an order or pick a larger vehicle.</div>`:""}
    ${equipMismatch?`<div class="note warn">Some orders asked for different equipment than ${esc(v.equip)}. The planner can override.</div>`:""}
    ${lanes.size>1?`<div class="note info">Multi-lane loads become multi-stop trips. This demo routes the trip on the first order's lane.</div>`:""}
    <button class="btn primary" id="mkTrip" ${!sel.length||over||!v?"disabled":""}>${t("createTrip")}</button>
    <p class="muted" style="font-size:12px;margin:0">Route optimisation (OR-Tools) is Phase 3. This demo shows manual load building with live utilisation.</p>
   </div></section>
  </div>`;
  document.querySelectorAll("[data-psel]").forEach(el=>el.onchange=()=>{el.checked?ui.sel.add(el.dataset.psel):ui.sel.delete(el.dataset.psel);VIEWS.planning()});
  $("#pv")&&($("#pv").onchange=e=>{plan.vehicleId=e.target.value;VIEWS.planning()});
  $("#mkTrip").onclick=()=>{
    const first=sel[0]; const trip={id:`${X.prefix}-TRP-${String(++X.tripSeq).padStart(4,"0")}`,vehicleId:v.id,driverId:v.driverId,orderIds:sel.map(o=>o.id),from:first.origin,to:first.dest,ms:0,progress:0,startTs:Date.now()};
    X.trips.push(trip); sel.forEach(o=>{audit(o.id,"status",o.status,"Dispatched");o.status="Dispatched";o.tripId=trip.id;o.ms=0;o.carrierId=v.owner||null;recalc(X,o);ui.sel.delete(o.id)});
    emit("cost.accrued",trip.id,`${v.owner?X.parties.find(p=>p.id===v.owner).name:"Own fleet"} · ${money2(sel.reduce((s,o)=>s+o.buy,0),X.ccy)}`);
    emit("trip.created",trip.id,`${sel.length} order(s), ${v.plate}`); emit("trip.dispatched",trip.id,`Pushed to driver app: ${drvr(v.driverId).name}`);
    drv.tripId=trip.id; toast(`${trip.id} dispatched to ${drvr(v.driverId).name}. Open the Driver app to run it.`); VIEWS.planning();};
};

let ctSel=null;
VIEWS.tracking=function(){
  const X=T(); const active=X.trips.filter(tr=>tr.ms<6).map(tr=>({tr,r:riskOf(tr)})).sort((a,b)=>b.r.score-a.r.score);
  $("#view").innerHTML=`
  <div class="grid g-2">
   <section class="panel"><div class="panel-h"><h2>${t("liveMap")} · ${active.length} trips</h2><span class="row" style="font-size:12px;gap:12px">${pill(t("onTrack"),"p-ok")}${pill("Watch","p-warn")}${pill(t("late"),"p-bad")}${pill("Not departed","p-info")}</span></div><div class="panel-b" id="ctMap">${mapSVG({highlight:ctSel})}</div>
    <p class="muted" style="font-size:12px;margin:0 14px 14px">Positions update every second in this demo (production: GPS every 30–60 s). Geofences raise "Arrived" automatically.</p></section>
   <section class="panel"><div class="panel-h"><h2>Open exceptions</h2></div><div class="panel-b stack" id="ctEx"></div></section>
  </div>
  <section class="panel"><div class="panel-h"><h2>${t("atRisk")}</h2><span class="muted" style="font-size:12px">Ranked by risk score: ETA vs delivery window, plus open exceptions</span></div>
   <div class="tbl-wrap"><table><thead><tr><th>Trip</th><th>${t("order")}</th><th>${t("vehicle")}</th><th>${t("driverL")}</th><th>Milestone</th><th>${t("progress")}</th><th>${t("eta")}</th><th>Deliver by</th><th>${t("risk")}</th><th></th></tr></thead><tbody id="ctRows"></tbody></table></div></section>`;
  updateTracking();
};
function updateTracking(){
  const X=T(); if(!$("#ctRows")) return;
  const active=X.trips.filter(tr=>tr.ms<6).map(tr=>({tr,r:riskOf(tr)})).sort((a,b)=>b.r.score-a.r.score);
  $("#ctMap").innerHTML=mapSVG({highlight:ctSel});
  $("#ctRows").innerHTML=active.map(({tr,r})=>{const o=X.orders.find(x=>x.id===tr.orderIds[0]);return `<tr class="click" data-trip="${tr.id}" style="${ctSel===tr.id?"background:var(--accent-soft)":""}">
    <td class="mono">${tr.id}</td><td class="mono">${tr.orderIds.join(", ")}</td><td class="mono">${esc(veh(tr.vehicleId).plate)}</td><td>${esc(drvr(tr.driverId).name)}</td>
    <td>${tr.ms===0?'Dispatched <span class="muted">(awaiting accept)</span>':esc(MILESTONES[tr.ms-1])}</td>
    <td style="min-width:110px"><div class="bar"><i style="width:${Math.round(tr.progress*100)}%"></i></div></td>
    <td class="num">${dt(etaOf(tr),X.tz)}</td><td class="num">${dt(o.deliverBy,X.tz)}</td><td>${riskPill(r)}</td>
    <td><button class="btn sm" data-notify="${tr.id}">Notify customer</button></td></tr>`}).join("");
  const ex=X.exceptions.filter(e=>!e.closed);
  $("#ctEx").innerHTML=ex.length?ex.map(e=>{const age=Math.round((Date.now()-e.openedTs)/60e3);const breach=age>e.slaMin;return `<div class="panel" style="padding:10px 12px;display:flex;flex-direction:column;gap:4px">
    <div class="row"><b style="margin-inline-end:auto">${esc(e.type)}</b>${pill(e.severity,e.severity==="High"?"p-bad":"p-warn")}</div>
    <div class="muted" style="font-size:12.5px"><span class="mono">${e.id} · ${e.tripId}</span> · Owner ${esc(e.owner)}</div>
    <div style="font-size:12.5px">${breach?`<span style="color:var(--bad)">SLA breached: open ${age} min, SLA ${e.slaMin} min</span>`:`Open ${age} min of ${e.slaMin} min SLA`}</div>
    <div class="row"><button class="btn sm" data-resolve="${e.id}">Resolve</button></div></div>`}).join(""):`<p class="muted" style="margin:0">No open exceptions.</p>`;
  document.querySelectorAll("[data-trip]").forEach(el=>el.onclick=()=>{ctSel=ctSel===el.dataset.trip?null:el.dataset.trip;updateTracking()});
  document.querySelectorAll("[data-notify]").forEach(b=>b.onclick=e=>{e.stopPropagation();const tr=X.trips.find(x=>x.id===b.dataset.notify);emit("notification.sent",tr.orderIds[0],"Customer ETA update (email + WhatsApp)");toast(`ETA update queued to the customer for ${tr.orderIds[0]}. Delivery runs through the notification service, not this demo.`)});
  document.querySelectorAll("[data-resolve]").forEach(b=>b.onclick=()=>{const e=X.exceptions.find(x=>x.id===b.dataset.resolve);e.closed=Date.now();audit(e.id,"status","Open","Resolved");emit("exception.resolved",e.tripId,e.type);updateTracking()});
}

function setupSig(){const c=$("#sig");if(!c)return;const r=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1;c.width=r.width*dpr;c.height=r.height*dpr;const g=c.getContext("2d");g.scale(dpr,dpr);g.lineWidth=2.4;g.lineCap="round";g.strokeStyle="#0d1b2a";drv.sigData=null;

/* ---------------- FINANCE & BILLING ---------------- */
const fin={tab:"unbilled",sel:new Set(),ci:null,batch:new Set(),q:"",st:""};
const FIN={};
VIEWS.finance=function(){
  const X=T();
  const ub=X.orders.filter(o=>o.status==="POD received"), ubVal=ub.reduce((s,o)=>s+o.sell,0);
  const open=X.invoices.filter(i=>invBalance(i)>0.005), openVal=open.reduce((s,i)=>s+invBalance(i),0);
  const od=open.filter(i=>Date.now()>i.dueTs), odVal=od.reduce((s,i)=>s+invBalance(i),0);
  const review=X.carrierInvoices.filter(ci=>ciState(X,ci).st==="Needs review").length;
  const billed=new Set(X.carrierInvoices.flatMap(c=>c.lines.filter(l=>!l.rejected).map(l=>l.orderId)));
  const accr=X.orders.filter(o=>o.carrierId&&["Dispatched","In transit","Delivered","POD received","Invoiced"].includes(o.status)&&!billed.has(o.id)).reduce((s,o)=>s+o.buy,0);
  const tabs=[["unbilled",t("unbilled")],["invoices",t("invoices")],["aging",t("aging")],["audit",t("freightAudit")],["profit",t("profitability")],["rates",t("rateCards")]];
  $("#view").innerHTML=`<div class="grid g-kpi">
    ${kpi(t("unbilled"),money(ubVal,X.ccy),`${ub.length} shipments with POD`)}
    ${kpi("Open receivables",money(openVal,X.ccy),`${open.length} invoices`)}
    ${kpi("Overdue",money(odVal,X.ccy),`${od.length} invoices past due`)}
    ${kpi("Carrier invoices to review",nfmt(review),`Outside ±${X.tol.pct*100}% / ${X.tol.abs} ${X.ccy} tolerance`)}
    ${kpi("Accrued carrier cost",money(accr,X.ccy),"Not yet billed by carriers")}
   </div>
   <section class="panel"><div class="tabs" role="tablist" style="padding:0 10px">${tabs.map(([k,l])=>`<button role="tab" aria-selected="${fin.tab===k}" data-ftab="${k}">${esc(l)}</button>`).join("")}</div><div class="panel-b" id="finBody"></div></section>`;
  document.querySelectorAll("[data-ftab]").forEach(b=>b.onclick=()=>{fin.tab=b.dataset.ftab;VIEWS.finance()});
  FIN[fin.tab](X);
  document.querySelectorAll("#finBody [data-open]").forEach(b=>b.onclick=e=>{e.stopPropagation();openOrder(b.dataset.open)});
  document.querySelectorAll("#finBody [data-inv]").forEach(b=>b.onclick=()=>openInvoice(b.dataset.inv));
};
const lnk=(id,attr)=>`<button class="lnk mono" ${attr}="${id}">${id}</button>`;

FIN.unbilled=X=>{
  const ub=X.orders.filter(o=>o.status==="POD received").sort((a,b)=>a.customerId.localeCompare(b.customerId,undefined,{numeric:true})||a.pod.ts-b.pod.ts);
  [...fin.sel].forEach(id=>{if(!ub.find(o=>o.id===id))fin.sel.delete(id)});
  const waiting=X.orders.filter(o=>o.status==="Delivered").length, sel=ub.filter(o=>fin.sel.has(o.id)), nc=new Set(sel.map(o=>o.customerId)).size;
  $("#finBody").innerHTML=`<div class="stack">
   <div class="row"><span class="muted" style="margin-inline-end:auto;font-size:12.5px">A shipment becomes billable once its POD is received. ${waiting} delivered shipment(s) are still waiting for POD. Selected shipments are consolidated into one invoice per customer.</span>
    <button class="btn sm" id="ubAll">${sel.length===ub.length&&ub.length?"Clear":"Select all"}</button>
    <button class="btn primary" id="ubGo" ${sel.length?"":"disabled"}>Create ${nc||""} invoice${nc===1?"":"s"}${sel.length?` (${sel.length} shipments)`:""}</button></div>
   <div class="tbl-wrap"><table><thead><tr><th></th><th>${t("order")}</th><th>${t("customer")}</th><th>Billing cycle</th><th>Lane</th><th>POD date</th><th class="r">Net</th><th>Tax</th><th class="r">Total</th></tr></thead><tbody>
   ${ub.map(o=>{const tx=taxFor(X,o),c=cust(o.customerId);return `<tr><td><input type="checkbox" data-ub="${o.id}" ${fin.sel.has(o.id)?"checked":""} aria-label="Select ${o.id}"></td><td>${lnk(o.id,"data-open")}</td><td>${esc(c.name)}</td><td>${esc(c.cycle)}</td><td class="mono">${o.origin} → ${o.dest}</td><td class="num">${dt(o.pod.ts,X.tz,false)}</td><td class="r num">${money2(o.sell,X.ccy)}</td><td>${esc(tx.name)} ${Math.round(tx.rate*100)}%</td><td class="r num">${money2(o.sell*(1+tx.rate),X.ccy)}</td></tr>`}).join("")||`<tr><td colspan="9" class="muted">Nothing to bill. Complete a delivery with POD in the Driver app and it appears here.</td></tr>`}
   </tbody></table></div></div>`;
  document.querySelectorAll("[data-ub]").forEach(c=>c.onchange=()=>{c.checked?fin.sel.add(c.dataset.ub):fin.sel.delete(c.dataset.ub);VIEWS.finance()});
  $("#ubAll").onclick=()=>{if(sel.length===ub.length)fin.sel.clear();else ub.forEach(o=>fin.sel.add(o.id));VIEWS.finance()};
  $("#ubGo").onclick=()=>{const by={};sel.forEach(o=>(by[o.customerId]=by[o.customerId]||[]).push(o));let tot=0;const ids=[];
    Object.entries(by).forEach(([cid,os])=>{os.forEach(o=>audit(o.id,"status","POD received","Invoiced"));const inv=makeInvoice(X,cid,os,Date.now());tot+=inv.total;ids.push(inv.id);
      audit(inv.id,"(created)","",money2(inv.total,X.ccy));emit("invoice.issued",inv.id,`${cust(cid).name} · ${os.length} shipment(s) · ${money2(inv.total,X.ccy)}`)});
    fin.sel.clear();toast(`${ids.length} invoice(s) issued, ${money2(tot,X.ccy)} incl. tax. They are now under Customer invoices.`);VIEWS.finance()};
};

FIN.invoices=X=>{
  const STS=["Issued","Part paid","Overdue","Disputed","Paid"];
  const all=X.invoices.filter(i=>{if(fin.st&&invStatus(i)!==fin.st)return false;if(!fin.q)return true;const q=fin.q.toLowerCase();return i.id.toLowerCase().includes(q)||cust(i.customerId).name.toLowerCase().includes(q)||i.lines.some(l=>l.orderId.toLowerCase().includes(q))}).sort((a,b)=>b.issueTs-a.issueTs);
  const rows=all.slice(0,100);

    <select id="fst" aria-label="Invoice status"><option value="">All statuses</option>${STS.map(s=>`<option ${fin.st===s?"selected":""}>${s}</option>`).join("")}</select><span class="muted" style="font-size:12.5px">${all.length} invoices${all.length>100?", showing the latest 100":""}</span></div>

FIN.aging=X=>{
  const B=[["Current","var(--ok)"],["1–30 days","var(--info)"],["31–60 days","var(--warn)"],["61–90 days","var(--accent)"],["90+ days","var(--bad)"]];
  const bucket=i=>{const d=Math.floor((Date.now()-i.dueTs)/DAY);return d<=0?0:d<=30?1:d<=60?2:d<=90?3:4};
  const rows={}; X.invoices.forEach(i=>{const b=invBalance(i);if(b<=0.005)return;const r=rows[i.customerId]=rows[i.customerId]||[0,0,0,0,0];r[bucket(i)]+=b});
  const tot=[0,0,0,0,0]; Object.values(rows).forEach(r=>r.forEach((v,k)=>tot[k]+=v)); const grand=tot.reduce((a,b)=>a+b,0)||1;
  const custs=X.parties.filter(p=>p.type==="customer");
  $("#finBody").innerHTML=`<div class="stack">
   <div class="bar" style="height:18px;display:flex">${tot.map((v,k)=>`<i style="width:${v/grand*100}%;background:${B[k][1]}" title="${B[k][0]}"></i>`).join("")}</div>
   <div class="row" style="font-size:12px;gap:14px">${B.map(([l,c],k)=>`<span class="row" style="gap:6px"><i style="width:10px;height:10px;border-radius:2px;background:${c};display:inline-block"></i>${l}: <b class="num">${money(tot[k],X.ccy)}</b></span>`).join("")}</div>
   <div class="tbl-wrap"><table><thead><tr><th>${t("customer")}</th><th>Terms</th>${B.map(b=>`<th class="r">${b[0]}</th>`).join("")}<th class="r">Open balance</th><th class="r">+ Unbilled</th><th class="r">Credit limit</th><th>Credit check</th></tr></thead><tbody>
   ${custs.map(c=>{const r=rows[c.id]||[0,0,0,0,0],bal=r.reduce((a,b)=>a+b,0),unb=X.orders.filter(o=>o.customerId===c.id&&["Dispatched","In transit","Delivered","POD received"].includes(o.status)).reduce((s,o)=>s+o.sell,0),use=(bal+unb)/c.credit;
     return `<tr><td>${esc(c.name)}</td><td>${c.terms} days</td>${r.map((v,k)=>`<td class="r num" style="${v&&k>=2?"color:var(--bad)":""}">${v?money(v,X.ccy):"–"}</td>`).join("")}<td class="r num"><b>${money(bal,X.ccy)}</b></td><td class="r num">${money(unb,X.ccy)}</td><td class="r num">${money(c.credit,X.ccy)}</td><td>${use>1?pill("Over limit: new orders blocked","p-bad"):use>.8?pill(`${Math.round(use*100)}% used`,"p-warn"):pill(`${Math.round(use*100)}% used`,"p-ok")}</td></tr>`}).join("")}
   <tr><td><b>Total</b></td><td></td>${tot.map(v=>`<td class="r num"><b>${money(v,X.ccy)}</b></td>`).join("")}<td class="r num"><b>${money(grand===1?0:grand,X.ccy)}</b></td><td></td><td></td><td></td></tr>
   </tbody></table></div></div>`;
};

FIN.audit=X=>{
  const cis=X.carrierInvoices, carriers=X.parties.filter(p=>p.type==="carrier");
  const states=new Map(cis.map(ci=>[ci.id,ciState(X,ci)]));
  [...fin.batch].forEach(id=>{if(!states.get(id)?.approvable)fin.batch.delete(id)});
  const ci=cis.find(c=>c.id===fin.ci);
  const bsel=[...fin.batch].map(id=>cis.find(c=>c.id===id)), bamt=bsel.reduce((s,c)=>s+states.get(c.id).pay,0);
  let detail="";
  if(ci){const S=states.get(ci.id),k=X.parties.find(p=>p.id===ci.carrierId);
    detail=`<section class="panel"><div class="panel-h"><h2><span class="mono">${esc(ci.no)}</span> · ${esc(k.name)}</h2>${pill(S.st,S.cls)}<button class="btn sm" id="ciClose">${t("close")}</button></div>
     <div class="panel-b"><span class="muted" style="font-size:12.5px">Received ${dt(ci.receivedTs,X.tz)} via ${esc(ci.channel)}. Three-way match: the order exists, the POD is captured, and the amount matches the cost accrued at dispatch.</span></div>
     <div class="tbl-wrap"><table><thead><tr><th>${t("order")}</th><th>Lane</th><th>Order</th><th>POD</th><th class="r">Accrued</th><th class="r">Invoiced</th><th class="r">Variance</th><th>Result</th><th>Carrier note</th><th></th></tr></thead><tbody>
     ${ci.lines.map((l,i)=>{const o=X.orders.find(x=>x.id===l.orderId),m=S.ms[i];return `<tr><td>${lnk(l.orderId,"data-open")}</td><td class="mono">${o.origin} → ${o.dest}</td><td>${pill("✓","p-ok")}</td><td>${o.pod?pill("✓","p-ok"):pill("Missing","p-warn")}</td><td class="r num">${money2(o.buy,X.ccy)}</td><td class="r num">${money2(l.amount,X.ccy)}</td><td class="r num" style="color:${Math.abs(m.v)>0.005?(m.ok?"var(--warn)":"var(--bad)"):"inherit"}">${m.v>0?"+":""}${money2(m.v,X.ccy)}</td><td>${pill(m.res,m.cls)}</td><td class="muted" style="white-space:normal">${esc(l.note)}</td>
       <td>${ci.batchId?"":m.res==="Over tolerance"?`<button class="btn sm" data-cil="${i}|accept">Accept</button> <button class="btn sm" data-cil="${i}|dispute">Dispute</button>`:m.dup?`<button class="btn sm" data-cil="${i}|reject">Reject line</button>`:""}</td></tr>`}).join("")}
     <tr><td colspan="4"><b>Totals</b></td><td class="r num"><b>${money2(S.acc,X.ccy)}</b></td><td class="r num"><b>${money2(S.inv,X.ccy)}</b></td><td class="r num"><b>${money2(S.inv-S.acc,X.ccy)}</b></td><td colspan="3">Payable now: <b class="num">${money2(S.pay,X.ccy)}</b></td></tr>
     </tbody></table></div></section>`}
  $("#finBody").innerHTML=`<div class="stack">
   <div class="row"><span class="muted" style="font-size:12.5px;margin-inline-end:auto">Lines within ±${X.tol.pct*100}% or ${X.tol.abs} ${X.ccy} of the accrual are approved automatically. Everything else goes to review.</span>
    <select id="sbK" aria-label="Carrier to self-bill">${carriers.map(k=>`<option value="${k.id}">${esc(k.name)}</option>`).join("")}</select><button class="btn" id="sbGo">Self-bill completed trips</button>
    <button class="btn primary" id="pbGo" ${bsel.length?"":"disabled"}>Create payment batch${bsel.length?` · ${bsel.length} · ${money(bamt,X.ccy)}`:""}</button></div>
   ${detail}
   <div class="tbl-wrap"><table><thead><tr><th></th><th>Carrier invoice</th><th>Carrier</th><th>Received</th><th>Channel</th><th class="r">Lines</th><th class="r">Accrued</th><th class="r">Invoiced</th><th class="r">Variance</th><th>Match</th><th class="r">Payable</th></tr></thead><tbody>
   ${cis.map(c=>{const S=states.get(c.id),k=X.parties.find(p=>p.id===c.carrierId);return `<tr class="click" data-ci="${c.id}" style="${fin.ci===c.id?"background:var(--accent-soft)":""}"><td>${S.approvable?`<input type="checkbox" data-pb="${c.id}" ${fin.batch.has(c.id)?"checked":""} aria-label="Add ${esc(c.no)} to payment batch">`:""}</td><td class="mono">${esc(c.no)}${c.batchId?` <span class="muted">· ${c.batchId}</span>`:""}</td><td>${esc(k.name)}</td><td class="num">${dt(c.receivedTs,X.tz,false)}</td><td>${esc(c.channel)}</td><td class="r num">${c.lines.length}</td><td class="r num">${money2(S.acc,X.ccy)}</td><td class="r num">${money2(S.inv,X.ccy)}</td><td class="r num">${money2(S.inv-S.acc,X.ccy)}</td><td>${pill(S.st,S.cls)}</td><td class="r num">${money2(S.pay,X.ccy)}</td></tr>`}).join("")}
   </tbody></table></div>
   <h3 style="font-size:14px;margin:8px 0 0">Payment batches sent to ${esc(X.erp)}</h3>
   <div class="tbl-wrap"><table><thead><tr><th>Batch</th><th>Created</th><th class="r">Invoices</th><th class="r">Amount</th><th>Status</th></tr></thead><tbody>
   ${X.batches.map(b=>`<tr><td class="mono">${b.id}</td><td class="num">${dt(b.ts,X.tz)}</td><td class="r num">${b.ids.length}</td><td class="r num">${money2(b.amount,X.ccy)}</td><td>${pill("Exported to ERP","p-ok")}</td></tr>`).join("")||`<tr><td colspan="5" class="muted">No batches yet.</td></tr>`}
   </tbody></table></div>
   <p class="muted" style="font-size:12px;margin:0">HP TMS approves and exports payables. The ERP makes the actual payment.</p></div>`;
  document.querySelectorAll("[data-ci]").forEach(r=>r.onclick=()=>{fin.ci=fin.ci===r.dataset.ci?null:r.dataset.ci;VIEWS.finance()});
  document.querySelectorAll("[data-pb]").forEach(c=>{c.onclick=e=>e.stopPropagation();c.onchange=()=>{c.checked?fin.batch.add(c.dataset.pb):fin.batch.delete(c.dataset.pb);VIEWS.finance()}});
  $("#ciClose")&&($("#ciClose").onclick=()=>{fin.ci=null;VIEWS.finance()});
  document.querySelectorAll("[data-cil]").forEach(b=>b.onclick=()=>{const [i,how]=b.dataset.cil.split("|"),l=ci.lines[+i];ci.touched=true;
    if(how==="accept"){l.override=true;audit(ci.no,`line ${l.orderId}`,"over tolerance",`accepted by ${ME().name}`);emit("carrier_invoice.line_approved",ci.no,l.orderId)}
    if(how==="dispute"){l.dispute=true;const o=X.orders.find(x=>x.id===l.orderId);audit(ci.no,`line ${l.orderId}`,"over tolerance","disputed");emit("carrier_invoice.disputed",ci.no,`${l.orderId}: disputing ${money2(l.amount-o.buy,X.ccy)}, paying accrual`)}

  $("#sbGo").onclick=()=>{const kid=$("#sbK").value,c=selfBill(X,kid);if(!c){toast("This carrier has no completed trips with POD left to bill.");return}
    audit(c.no,"(created)","","self-billing");emit("carrier_invoice.self_billed",c.no,`${c.lines.length} trips · ${money2(ciState(X,c).inv,X.ccy)}`);fin.ci=c.id;toast(`Self-billing invoice ${c.no} created from ${c.lines.length} completed trips at the contract rate.`);VIEWS.finance()};
  $("#pbGo").onclick=()=>{const b={id:"PB-"+pad4(++X.pbSeq),ts:Date.now(),ids:bsel.map(c=>c.id),amount:round2(bamt),target:X.erp};bsel.forEach(c=>c.batchId=b.id);X.batches.unshift(b);fin.batch.clear();
    audit(b.id,"(created)","",money2(b.amount,X.ccy));emit("payment_batch.exported",b.id,`${b.ids.length} invoices · ${money2(b.amount,X.ccy)} → ${X.erp}`);toast(`${b.id} exported to ${X.erp}.`);VIEWS.finance()};
};

FIN.profit=X=>{
  const os=X.orders.filter(o=>!["Cancelled","Draft"].includes(o.status));
  const grp=(keyf,labelf)=>{const g={};os.forEach(o=>{const k=keyf(o);const r=g[k]=g[k]||{k,label:labelf(o),n:0,rev:0,cost:0};r.n++;r.rev+=o.sell;r.cost+=o.buy});return Object.values(g)};
  const table=(rows,title,first)=>{const mx=Math.max(...rows.map(r=>(r.rev-r.cost)/r.rev),.01);return `<section class="panel"><div class="panel-h"><h2>${title}</h2></div><div class="tbl-wrap"><table><thead><tr><th>${first}</th><th class="r">Shipments</th><th class="r">Revenue</th><th class="r">Cost</th><th class="r">Margin</th><th style="min-width:120px">Margin %</th></tr></thead><tbody>
    ${rows.map(r=>{const m=(r.rev-r.cost)/r.rev;return `<tr><td>${esc(r.label)}</td><td class="r num">${r.n}</td><td class="r num">${money(r.rev,X.ccy)}</td><td class="r num">${money(r.cost,X.ccy)}</td><td class="r num">${money(r.rev-r.cost,X.ccy)}</td><td><div class="row" style="gap:8px;flex-wrap:nowrap"><div class="bar" style="flex:1"><i style="width:${Math.max(0,m)/mx*100}%;background:${m<X.guard?"var(--bad)":"var(--ok)"}"></i></div><span class="num" style="width:36px;text-align:end">${Math.round(m*100)}%</span></div></td></tr>`}).join("")}
    </tbody></table></div></section>`};
  const byCust=grp(o=>o.customerId,o=>cust(o.customerId).name).sort((a,b)=>(b.rev-b.cost)-(a.rev-a.cost));
  const byLane=grp(o=>o.origin+o.dest,o=>`${o.origin} → ${o.dest}`).sort((a,b)=>b.rev-a.rev).slice(0,10);
  const byMode=grp(o=>o.carrierId?"sub":"own",o=>o.carrierId?"Subcontracted":"Own fleet");
  const byMonth=grp(o=>new Date(o.pickupTs).toISOString().slice(0,7),o=>new Intl.DateTimeFormat(LOCALE[lang],{month:"long",year:"numeric",timeZone:X.tz}).format(new Date(o.pickupTs))).sort((a,b)=>b.k.localeCompare(a.k)).slice(0,4);
  $("#finBody").innerHTML=`<div class="stack"><span class="muted" style="font-size:12.5px">Revenue minus carrier and trip cost per shipment, excl. tax. Red bars are below the ${Math.round(X.guard*100)}% margin guardrail.</span>
   ${table(byCust,"By customer",t("customer"))}<div class="grid g-2e">${table(byLane,"Top 10 lanes by revenue","Lane")}<div class="stack">${table(byMode,"Own fleet vs subcontracted","Haulier")}${table(byMonth,"By month (pickup date)","Month")}</div></div></div>`;
};

FIN.rates=X=>{
  const bands=[25,75,150,300,600,1000], eqs=Object.keys(EQUIP), cur=fscPct(X);
  $("#finBody").innerHTML=`<div class="stack">
   <div class="grid g-2e">
    <section class="panel"><div class="panel-h"><h2>Fuel surcharge (index-linked)</h2></div><div class="panel-b stack">
     <form class="row" id="fscF"><label class="ctl">Diesel index (${X.fsc.unit}) <input type="number" step="0.01" id="fscP" value="${X.fsc.price}" style="width:100px"></label><button class="btn sm">Update index</button></form>
     <div class="tbl-wrap"><table><thead><tr><th>Diesel price band (${X.fsc.unit})</th><th class="r">Surcharge on freight</th></tr></thead><tbody>
     ${X.fsc.bands.map(([lo,hi,p])=>`<tr style="${p===cur?"background:var(--accent-soft);font-weight:600":""}"><td class="num">${lo} – ${hi>=99?"and above":hi}</td><td class="r num">${(p*100).toFixed(1)}%${p===cur?" · current":""}</td></tr>`).join("")}</tbody></table></div>
     <span class="muted" style="font-size:12px">Updating the index re-rates open orders that haven't been delivered yet. Delivered and invoiced orders keep their rate.</span></div></section>
    <section class="panel"><div class="panel-h"><h2>Accessorial charges</h2></div><div class="tbl-wrap"><table><thead><tr><th>Code</th><th>Charge</th><th class="r">Rate</th><th>Per</th><th>Cost side</th></tr></thead><tbody>
     ${X.acc.map(a=>`<tr><td class="mono">${a.code}</td><td>${esc(a.label)}</td><td class="r num">${a.unit==="%"?Math.round(a.rate*100)+"% of freight":money2(a.rate,X.ccy)}</td><td>${a.unit==="%"?"order":a.unit}</td><td class="muted">${["SALIK","TOLL","ESC"].includes(a.code)?"Pass-through at cost":a.code==="BORD"?"Agent fee 75%":a.code==="WAIT"?"Carrier 70% / driver 20%":"Margin item"}</td></tr>`).join("")}</tbody></table></div></section>
   </div>
   <section class="panel"><div class="panel-h"><h2>Standard sell tariff (${X.ccy}, excl. fuel and tax)</h2><span class="muted" style="font-size:12px">max(min ${X.rates.min}, ${X.rates.base} + ${X.rates.perKm}/km) × equipment factor</span></div><div class="tbl-wrap"><table><thead><tr><th>Distance</th>${eqs.map(e=>`<th class="r">${esc(e)} <span class="muted">×${EQUIP[e].rate}</span></th>`).join("")}</tr></thead><tbody>
    ${bands.map(b=>`<tr><td class="num">${b} km</td>${eqs.map(e=>`<td class="r num">${money(r5(tariff(X,b,e)),X.ccy)}</td>`).join("")}</tr>`).join("")}</tbody></table></div></section>
   <div class="grid g-2e">
    <section class="panel"><div class="panel-h"><h2>Customer contracts (sell)</h2></div><div class="tbl-wrap"><table><thead><tr><th>${t("customer")}</th><th class="r">Discount</th><th>Billing</th><th class="r">Terms</th><th class="r">Credit limit</th></tr></thead><tbody>
     ${X.parties.filter(p=>p.type==="customer").map(c=>`<tr><td>${esc(c.name)}</td><td class="r num">${c.discount?"−"+Math.round(c.discount*100)+"%":"Tariff"}</td><td>${esc(c.cycle)}</td><td class="r num">${c.terms} days</td><td class="r num">${money(c.credit,X.ccy)}</td></tr>`).join("")}</tbody></table></div></section>
    <section class="panel"><div class="panel-h"><h2>Carrier contracts (buy)</h2></div><div class="tbl-wrap"><table><thead><tr><th>Carrier</th><th class="r">Rate</th><th>Valid to</th><th class="r">Score</th></tr></thead><tbody>
     ${X.parties.filter(p=>p.type==="carrier").map(k=>`<tr><td>${esc(k.name)}</td><td class="r num">${Math.round(k.factor*100)}% of tariff</td><td class="num">${dt(k.validTo,X.tz,false)}</td><td class="r num">${k.score}</td></tr>`).join("")}</tbody></table></div>
     <div class="panel-b"><dl class="kv"><dt>Own-fleet cost model</dt><dd>${X.own.lPerKm} L/km diesel · ${X.own.fixedKm} ${X.ccy}/km vehicle · driver ${X.own.drvTrip} ${X.ccy}/trip + ${X.own.drvPer100}/100 km · empty return 60% (≤200 km) or 30%</dd>
      <dt>Margin guardrail</dt><dd>${Math.round(X.guard*100)}%: orders below it go On hold for Finance approval</dd><dt>Audit tolerance</dt><dd>±${X.tol.pct*100}% or ${X.tol.abs} ${X.ccy}, whichever is larger</dd></dl></div></section>
   </div></div>`;
  $("#fscF").onsubmit=e=>{e.preventDefault();const v=round2(+$("#fscP").value);if(!(v>0)){toast("Enter a diesel price above 0.");return}
    const old=X.fsc.price;X.fsc.price=v;let n=0;X.orders.forEach(o=>{if(["Draft","Confirmed","On hold","Dispatched","In transit"].includes(o.status)){recalc(X,o);n++}});
    audit("rate:fuel-index","diesel price",old,v);emit("rating.fuel_index_updated",X.short,`${old} → ${v} ${X.fsc.unit}; surcharge ${(fscPct(X)*100).toFixed(1)}%; ${n} open orders re-rated`);
    toast(`Diesel index set to ${v}. Surcharge is now ${(fscPct(X)*100).toFixed(1)}%. ${n} open orders re-rated.`);VIEWS.finance()};
};

/* ---------------- live tick ---------------- */
setInterval(()=>{
  Object.values(TENANTS).forEach(X=>X.trips.forEach(tr=>{
    if(tr.ms===4||tr.ms===5||tr.ms>=6) return;
    if(tr.ms===3){tr.progress=Math.min(1,tr.progress+0.0015+(tr.orderIds.length%3)*0.0004);
      if(tr.progress>=1&&!tr.geofenced){tr.geofenced=true;tr.ms=4;tr.orderIds.forEach(id=>{const o=X.orders.find(x=>x.id===id);o.ms=4;o.msTs=o.msTs||{};o.msTs[4]=Date.now()});X.events.unshift({ts:Date.now(),type:"stop.arrived",agg:tr.id,info:"Auto by geofence (driver confirmation pending)"})}}
  }));
  const v=route();
  if(document.hidden) return;
  if(v==="tracking") updateTracking();
  else if(v==="dashboard"&&$("#dashMap")) $("#dashMap").innerHTML=mapSVG();
  else if(v==="track"&&$("#trkMap")){const o=T().orders.find(x=>x.id===trk.id),tr=o&&tripOf(o);if(tr&&tr.ms<6)$("#trkMap").innerHTML=mapSVG({trips:[tr],highlight:tr.id})}
},1000);

render();
</script>
